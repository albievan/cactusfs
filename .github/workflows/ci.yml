name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The quality bar. Everything runs inside the pinned builder image, so CI and
  # developers use identical tool versions.
  check:
    name: make check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The contract gate compares the node RPC contract with the commit
          # this change is based on, so that commit must be present.
          fetch-depth: 0
      - run: make check
        env:
          CONTRACT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}

  # Fault injection: the built binary, and a four-node cluster of containers
  # with nodes killed, partitioned and corrupted.
  chaos:
    name: make test-chaos
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make test-chaos

  # A rolling upgrade with the binaries themselves: three voters of the
  # release before this entry schema, built from the history of the
  # repository - which is why the history is fetched, and why this is a job of
  # its own and no part of make check - and a fourth node of this tree. Both
  # pairs there are: from the release of schema 4 to this one (ADR-0023), which
  # is what make test-rolling runs when it is told nothing, and from the
  # release of schema 3 (ADR-0019), whose test stays in the tree.
  rolling:
    name: make test-rolling
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: make test-rolling (schema 4 to 5)
        run: make test-rolling
      - name: make test-rolling (schema 3 to 4)
        run: make test-rolling ROLLING_FROM_COMMIT=0b7d825 ROLLING_TEST=TestRollingUpgradeFromSchema3ToSchema4

  # The Helm chart on k3s, with the image built here: admitted as restricted,
  # ready, read with a node away, closed to pods that are not its own. A job
  # of its own, and no part of make check: k3s needs a privileged container.
  k8s:
    name: make test-k8s
    runs-on: ubuntu-latest
    # The test itself is given 45 minutes (Makefile), after the builder image
    # is built.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make test-k8s

  # The Go-only path on every supported OS: no make, no container engine.
  unit:
    name: unit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Room for both test runs below at the limit each is given, and for the
    # build before them: a run that hangs is ended by its own limit, with the
    # stacks of its goroutines, and not by the job's, which says nothing.
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go build ./cmd/cactusfs
      - run: go vet ./...
      # The limit is the runner's slowest: on Windows the tests of the metadata
      # store, which sync to disk at every step, pass the default ten minutes.
      - run: go test -count=1 -timeout 30m ./...
      - name: go test -race
        if: runner.os != 'Windows'
        # The same limit: under the race detector the tests of the metadata
        # store pass the default ten minutes of a package on a slow runner.
        run: go test -race -count=1 -timeout 30m ./...
