name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The quality bar. Everything runs inside the pinned builder image, so CI and
  # developers use identical tool versions.
  check:
    name: make check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The contract gate compares the node RPC contract with the commit
          # this change is based on, so that commit must be present.
          fetch-depth: 0
      - run: make check
        env:
          CONTRACT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}

  # Fault injection: the built binary, and a four-node cluster of containers
  # with nodes killed, partitioned and corrupted.
  chaos:
    name: make test-chaos
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make test-chaos

  # The Helm chart on k3s, with the image built here: admitted as restricted,
  # ready, read with a node away, closed to pods that are not its own. A job
  # of its own, and no part of make check: k3s needs a privileged container.
  k8s:
    name: make test-k8s
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make test-k8s

  # The Go-only path on every supported OS: no make, no container engine.
  unit:
    name: unit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go build ./cmd/cactusfs
      - run: go vet ./...
      - run: go test -count=1 ./...
      - name: go test -race
        if: runner.os != 'Windows'
        run: go test -race -count=1 ./...
