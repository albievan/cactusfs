# CactusFS - Prometheus recording and alerting rules.
#
# Every metric named here is one the binary registers today
# (internal/adapters/telemetry); a test of that package reads this file and
# fails on a name the registry does not have. `up` is Prometheus's own.
#
# The rules expect the scrape job to be named "cactusfs". The PodMonitor of
# the Helm chart names it so; a scrape configuration written by hand says
# job_name: cactusfs.
#
# deploy/helm/cactusfs/files/cactusfs.rules.yaml is a copy of this file, for
# the chart's PrometheusRule: `make observability-check` fails when the two
# differ. Change both.
#
# No annotation carries a value, a bucket, a key or a credential: metrics have
# no such label, and the text of an alert names the instance and nothing else.
#
# Counters with labels do not exist before their first event, and rate() and
# increase() see nothing in a series' first sample. Where the first event is
# the one that matters (an object that cannot be rebuilt) the rule also fires
# on a series that is new and above zero.

groups:
  - name: cactusfs.recording
    rules:
      - record: cactusfs:s3_requests:rate5m
        expr: sum by (job, instance, code) (rate(cactusfs_s3_requests_total[5m]))
      - record: cactusfs:s3_request_errors:ratio_rate5m
        expr: |-
          sum by (job, instance) (rate(cactusfs_s3_requests_total{code=~"5.."}[5m]))
            /
          sum by (job, instance) (rate(cactusfs_s3_requests_total[5m]))
      - record: cactusfs:admin_request_errors:ratio_rate5m
        expr: |-
          sum by (job, instance) (rate(cactusfs_admin_requests_total{code=~"5.."}[5m]))
            /
          sum by (job, instance) (rate(cactusfs_admin_requests_total[5m]))
      - record: cactusfs:port_call_errors:ratio_rate5m
        expr: |-
          sum by (job, instance, port) (rate(cactusfs_port_calls_total{result="error"}[5m]))
            /
          sum by (job, instance, port) (rate(cactusfs_port_calls_total[5m]))

  - name: cactusfs.availability
    rules:
      - alert: CactusFSInstanceDown
        expr: up{job="cactusfs"} == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "A CactusFS node does not answer its scrape"
          description: "Prometheus has not been able to scrape {{ $labels.instance }} for three minutes: the node is down, cannot be reached, or refuses the scrape credential."

      - alert: CactusFSAbsent
        expr: absent(up{job="cactusfs"})
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "No CactusFS node is being scraped"
          description: "Prometheus has had no target of the job cactusfs for ten minutes: nothing would be known of a failure."

      - alert: CactusFSRestartingOften
        expr: changes(cactusfs_process_start_time_seconds[30m]) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "A CactusFS node keeps restarting"
          description: "The process on {{ $labels.instance }} has started more than twice in thirty minutes."

      - alert: CactusFSMixedVersions
        expr: count by (job) (count by (job, version) (cactusfs_build_info)) > 1
        for: 6h
        labels:
          severity: warning
        annotations:
          summary: "CactusFS nodes run different versions"
          description: "More than one version of CactusFS has been running for six hours: a rolling upgrade was started and not finished."

  - name: cactusfs.api
    rules:
      - alert: CactusFSS3ServerErrors
        expr: |-
          sum by (job, instance) (rate(cactusfs_s3_requests_total{code=~"5.."}[5m]))
            /
          sum by (job, instance) (rate(cactusfs_s3_requests_total[5m]))
            > 0.05
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "The S3 API is failing requests"
          description: "More than 5 % of the S3 requests answered by {{ $labels.instance }} have ended in a server error (5xx) for ten minutes."

      - alert: CactusFSAdminServerErrors
        expr: |-
          sum by (job, instance) (rate(cactusfs_admin_requests_total{code=~"5.."}[5m]))
            /
          sum by (job, instance) (rate(cactusfs_admin_requests_total[5m]))
            > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "The management API is failing requests"
          description: "More than 5 % of the management API requests answered by {{ $labels.instance }} have ended in a server error (5xx) for ten minutes."

      # Only operations that move no object data: how long a GetObject or a
      # PutObject takes is the size of the object and the speed of the client.
      - alert: CactusFSS3Slow
        expr: |-
          histogram_quantile(0.99, sum by (job, instance, le) (
            rate(cactusfs_s3_request_duration_seconds_bucket{operation=~"HeadBucket|HeadObject|ListBuckets|ListObjects|GetBucketLocation"}[5m])
          )) > 1.024
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "S3 requests that carry no object data are slow"
          description: "The slowest 1 % of HEAD and list requests answered by {{ $labels.instance }} have taken longer than a second for fifteen minutes."

      - alert: CactusFSAdminSlow
        expr: |-
          histogram_quantile(0.99, sum by (job, instance, le) (
            rate(cactusfs_admin_request_duration_seconds_bucket[5m])
          )) > 4.096
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "The management API is slow"
          description: "The slowest 1 % of management API requests answered by {{ $labels.instance }} have taken longer than four seconds for fifteen minutes."

  # The ports of the KMS and of the shard stores only. The metadata port
  # counts an object or a bucket that does not exist as an error, as the port
  # returns it, so its share of errors is what clients ask for and no sign of
  # a fault; it is on the dashboard and in no alert.
  - name: cactusfs.storage
    rules:
      - alert: CactusFSKMSErrors
        expr: sum by (job, instance) (rate(cactusfs_port_calls_total{port="kms", result="error"}[5m])) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Calls to the KMS are failing"
          description: "{{ $labels.instance }} has had calls to the KMS fail for five minutes. Without the KMS no object can be written and none can be read."

      - alert: CactusFSKMSSlow
        expr: |-
          histogram_quantile(0.99, sum by (job, instance, le) (
            rate(cactusfs_port_call_duration_seconds_bucket{port="kms"}[5m])
          )) > 0.4096
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "The KMS is slow"
          description: "The slowest 1 % of the calls {{ $labels.instance }} makes to the KMS have taken longer than 0.4 seconds for fifteen minutes; every read and every write waits for one."

      - alert: CactusFSShardErrors
        expr: |-
          sum by (job, instance) (rate(cactusfs_port_calls_total{port="shards", result="error"}[5m]))
            /
          sum by (job, instance) (rate(cactusfs_port_calls_total{port="shards"}[5m]))
            > 0.05
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Reads and writes of shards are failing"
          description: "More than 5 % of the shard operations of {{ $labels.instance }} have failed for fifteen minutes: look at its drives and at the nodes it reaches them on."

      - alert: CactusFSObjectsUnrecoverable
        expr: |-
          increase(cactusfs_heal_objects_total{result="unrecoverable"}[1h]) > 0
            or
          (
            cactusfs_heal_objects_total{result="unrecoverable"} > 0
              unless
            cactusfs_heal_objects_total{result="unrecoverable"} offset 1h
          )
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Objects were found that cannot be rebuilt"
          description: "Healing on {{ $labels.instance }} met objects with more shards lost or damaged than their parity can replace. Their data is lost unless a missing drive or node comes back; the node's log names them."

      - alert: CactusFSShardsRebuilt
        expr: increase(cactusfs_heal_shards_rebuilt_total[1h]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Damaged or missing shards were rebuilt"
          description: "{{ $labels.instance }} has rebuilt shards from parity in the last hour. Nothing is lost; unless a drive was just replaced, look for the drive that is failing."

      - alert: CactusFSLifecycleFailing
        expr: increase(cactusfs_lifecycle_actions_total{action="failed"}[1h]) > 0
        for: 2h
        labels:
          severity: warning
        annotations:
          summary: "Lifecycle rules cannot be carried out"
          description: "Actions of lifecycle rules have kept failing on {{ $labels.instance }} for two hours: versions that should have expired are still stored."

      - alert: CactusFSObjectAccessDropped
        expr: increase(cactusfs_object_access_dropped_total[15m]) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Downloads are not being counted"
          description: "{{ $labels.instance }} has been dropping records of who read which object for fifteen minutes: more wait to be recorded than it holds, or the metadata store refuses them. The objects themselves are served."

  # What every node says of the metadata group it is part of. A node that is
  # no voter follows the group all the same and has the same gauges.
  - name: cactusfs.metadata
    rules:
      # Across the job, not by instance: every node but one says 0. While no
      # node is scraped at all there is no series, and CactusFSInstanceDown
      # and CactusFSAbsent speak instead.
      #
      # "No node says that it leads" is not yet "nobody leads": the leader's
      # own series may be missing - Prometheus cannot reach it, or the node
      # answered its scrape without its Raft gauges because its metadata
      # state was busy - while the followers go on saying 0. So the nodes are
      # asked a second question, which the followers can answer: a node is
      # ready only while it knows of a leader (cactusfs_ready is 0 when it
      # knows of none, when its metadata state has failed, and while it
      # drains). The alert fires when no node that reports leads AND no node
      # that reports is ready:
      #
      #   - the leader is there and only its series are missing: the
      #     followers follow it and are ready, the second maximum is 1. Quiet.
      #   - the leader is down and the others elect another within seconds:
      #     one of them says 1. Quiet; CactusFSInstanceDown has the node.
      #   - a majority of the voters is gone: those left say that they do not
      #     lead and are not ready. Fires - with the nodes that are down as
      #     with every node up.
      #
      # '==' binds tighter than 'and': (max == 0) and on (job) (max == 0).
      - alert: CactusFSNoMetadataLeader
        expr: |-
          max by (job) (cactusfs_raft_is_leader) == 0
            and on (job)
          max by (job) (cactusfs_ready) == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "The metadata group has no leader"
          description: "For two minutes no node of the job {{ $labels.job }} has led the metadata group and none has known of a leader. Nothing can be written and nothing listed until a majority of the voters can reach each other again."

      # A rolling restart moves the term once for every leader that is
      # restarted: with five voters, five times at most. More than that in an
      # hour is not a restart.
      - alert: CactusFSMetadataLeaderUnstable
        expr: max by (job) (changes(cactusfs_raft_term[1h])) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "The metadata group keeps electing a leader"
          description: "The Raft term of the job {{ $labels.job }} has changed more than five times in an hour: voters lose sight of each other, or one of them is too slow to keep the lead. (A rolling restart moves the term once for every leader that is restarted, and stays below this.)"

      - alert: CactusFSMetadataMemberBehind
        expr: |-
          max by (job) (cactusfs_raft_applied_index)
            - on (job) group_right
          cactusfs_raft_applied_index
            > 1000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "A node is behind the metadata group"
          description: "The metadata state of {{ $labels.instance }} has been more than 1000 entries behind the furthest node for ten minutes: it is slow, or cut off from the leader."

      # A binary that applies a newer schema than the cluster writes: some
      # member is still of the release before, or has not registered since.
      - alert: CactusFSMetadataUpgradeUnfinished
        expr: max by (job) (cactusfs_metadata_schema_supported) > min by (job) (cactusfs_metadata_schema_level)
        for: 6h
        labels:
          severity: warning
        annotations:
          summary: "The cluster writes an older metadata schema than its nodes support"
          description: "For six hours a node of the job {{ $labels.job }} has supported a newer metadata schema than the cluster writes: a rolling upgrade was started and not every member has been replaced."

  - name: cactusfs.drives
    rules:
      - alert: CactusFSDriveOffline
        expr: cactusfs_drive_online == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "A drive cannot be reached"
          description: "Drive {{ $labels.drive }} of {{ $labels.instance }} has not answered for five minutes. Its shards are read from parity until it is back or replaced."

      - alert: CactusFSDriveNearlyFull
        expr: cactusfs_drive_free_bytes / cactusfs_drive_total_bytes < 0.10
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "A drive is nearly full"
          description: "Less than 10 % of the file system of drive {{ $labels.drive }} of {{ $labels.instance }} has been free for fifteen minutes. Writes fail when a write quorum of drives has no room."

  - name: cactusfs.nodes
    rules:
      - alert: CactusFSNodeCertificateExpiresSoon
        expr: cactusfs_node_certificate_not_after_seconds - time() < 14 * 86400
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "A node certificate ends within fourteen days"
          description: "The certificate {{ $labels.instance }} shows the other nodes ends in less than fourteen days. Issue a new one; when it has ended the node can neither call the others nor be called."

      - alert: CactusFSNodeCertificateAboutToExpire
        expr: cactusfs_node_certificate_not_after_seconds - time() < 3 * 86400
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "A node certificate ends within three days"
          description: "The certificate {{ $labels.instance }} shows the other nodes ends in less than three days. When it has ended the node drops out of the cluster."

      # What is in the certificate files is not what the node shows: it found
      # them changed and refused what they hold. Half an hour is longer than
      # any replacement takes to be whole, and long before the old one ends.
      - alert: CactusFSCertificateReloadRefused
        expr: cactusfs_tls_reload_pending == 1
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "A certificate on disk was refused"
          description: "{{ $labels.instance }} has had certificate files it refuses for thirty minutes (use: {{ $labels.use }}; node is the certificate the other nodes are shown, s3 the one clients are). The certificate on disk was refused; the old one is still served, and ends when it would have. The node will not start with the new one if it is the node certificate, or if the files cannot be read as a pair. The log of the node says why."

      # Certificates that are not accepted and nodes that are not admitted;
      # not connections that were merely cut short. A few at the start of a
      # cluster pass: the alert wants them to go on.
      - alert: CactusFSNodeHandshakesRefused
        expr: sum by (job, instance) (increase(cactusfs_node_handshakes_refused_total{reason=~"certificate|not_admitted"}[15m])) > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "A node keeps refusing the handshakes of others"
          description: "{{ $labels.instance }} has been refusing connections on its node ports for thirty minutes: a caller without a certificate of the node CA, a certificate that has ended, or a node that is not a member."

      # The calls this node makes. One that its own caller gave up is no
      # failure of the node that was called.
      - alert: CactusFSNodeRPCErrors
        expr: |-
          sum by (job, instance) (rate(cactusfs_noderpc_requests_total{side="client", code!~"OK|Canceled"}[5m]))
            /
          sum by (job, instance) (rate(cactusfs_noderpc_requests_total{side="client"}[5m]))
            > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Calls between nodes are failing"
          description: "More than 5 % of the calls {{ $labels.instance }} makes to other nodes have failed for ten minutes: a node is down or slow, or the network between them is."

      - alert: CactusFSNotReady
        expr: cactusfs_ready == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "A CactusFS node is running and not ready"
          description: "{{ $labels.instance }} has answered its scrape and said that it is not ready for fifteen minutes: its metadata group has no leader that it knows of, or its metadata state has failed. (A node that is still starting refuses its scrape and shows as not answering.)"

  - name: cactusfs.audit
    rules:
      # Appends only. A listing of the trail that fails - a console that went
      # away while it was reading - loses nothing and wakes nobody.
      - alert: CactusFSAuditLogErrors
        expr: sum by (job, instance) (rate(cactusfs_port_calls_total{port="audit", method="AppendAudit", result="error"}[5m])) > 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "The audit trail cannot be written"
          description: "{{ $labels.instance }} has failed to append to the audit trail for ten minutes. Refusals and failed sign-ins are kept in memory for a while and are lost if this goes on."

# Not here, because the binary has no metric for it yet - and a rule on a
# metric that does not exist never fires and says nothing is wrong:
#
#   - the scrubber has stopped
#       needs: a gauge of the time of the last finished pass; the count of
#       passes cannot tell a pass that is long from one that is stuck
#   - requests refused while a node starts
#       needs: a count of those refusals
#
# The ports of identities, sessions and repeated requests are counted like
# every other port and are in no alert, for the reason the metadata port is
# in none: a user or a session that does not exist is an error of the port.
