# Example - adapt before use; not run by the project's gates.
#
# HAProxy for the development cluster of deploy/compose/compose.yaml, used by
# compose.haproxy.yaml. Written for HAProxy 3.0; it uses nothing that 2.8 does
# not have. Check it with: haproxy -c -f haproxy.compose.cfg
#
# TLS passthrough: HAProxy forwards TCP and never sees a request. The node
# that answers presents the certificate of the cluster (s3.pem of dev-init,
# which names localhost, 127.0.0.1, ::1 and node1 to node4), so a client that
# trusts s3-ca.pem and asks for https://localhost:9443 is served as if it had
# asked a node. The Host header a client signed arrives as it was sent.

global
    log stdout format raw local0 info
    maxconn 4096

defaults
    mode tcp
    log global
    option tcplog
    option dontlognull
    timeout connect 5s
    # Inactivity, not the length of a transfer: a transfer that moves bytes is
    # never cut by these. The nodes close idle connections after 60 s.
    timeout client 15m
    timeout server 15m
    timeout check 500ms

# The names of the nodes are asked of the engine's own DNS, again and again:
# a node that is started later, or again, is found without a reload.
resolvers engine
    parse-resolv-conf
    hold valid 10s

frontend s3
    bind :9443
    default_backend s3_nodes

frontend admin
    bind :9444
    default_backend admin_nodes

# S3, port 9000 of every node. The health check does not go to that port:
# /readyz is served by the admin listener (9001) and by nothing else.
#
# The compose cluster drains for 2 s (CACTUSFS_DRAIN_DELAY). A node that is
# told to stop answers 503 on /readyz at once and goes on serving for those
# 2 s; two failed checks 500 ms apart take it out after about 1 s, in time.
#
# "verify none" - IN THIS EXAMPLE ONLY - because the development CA lives in a
# volume the balancer has no business mounting (it also holds every node's
# private key). The check carries no credential and reads no data, so what an
# unverified check can be told is a wrong "ready" by whoever sits between the
# balancer and the node, not a secret. To verify, copy the CA out,
#   docker compose -f deploy/compose/compose.yaml cp node1:/var/lib/cactusfs/config/s3-ca.pem .
# mount that one file into this container, and replace "verify none" by
#   verify required ca-file /usr/local/etc/haproxy/s3-ca.pem check-sni localhost verifyhost localhost
backend s3_nodes
    balance leastconn
    option httpchk
    http-check send meth GET uri /readyz ver HTTP/1.1 hdr Host localhost
    http-check expect status 200
    default-server check port 9001 check-ssl verify none inter 500ms fall 2 rise 2 resolvers engine init-addr last,libc,none
    server node1 node1:9000
    server node2 node2:9000
    server node3 node3:9000
    server node4 node4:9000

# The console, Swagger UI and the management API, port 9001 of every node
# with the gateway and console roles - all four here. No stickiness: console
# sessions are kept in the replicated metadata, so any node knows them.
backend admin_nodes
    balance leastconn
    option httpchk
    http-check send meth GET uri /readyz ver HTTP/1.1 hdr Host localhost
    http-check expect status 200
    default-server check check-ssl verify none inter 500ms fall 2 rise 2 resolvers engine init-addr last,libc,none
    server node1 node1:9001
    server node2 node2:9001
    server node3 node3:9001
    server node4 node4:9001
