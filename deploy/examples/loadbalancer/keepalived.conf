# Example - adapt before use; not run by the project's gates.
#
# keepalived (VRRP) for two balancer machines that run haproxy.cfg: one
# address, 10.0.0.10, is held by whichever of the two has a running HAProxy.
# Written for keepalived 2.x. Check it with: keepalived -t -f keepalived.conf
#
# Every name and address is a placeholder:
#   10.0.0.5    this balancer         10.0.0.6    the other balancer
#   10.0.0.10   the virtual address   eth0        the interface that holds it
#
# On the second machine: swap the two addresses of unicast_src_ip and
# unicast_peer, and set priority to 100. Nothing else differs.
#
# Unicast is used because many virtual networks do not carry the multicast
# VRRP uses otherwise. Even so, this only works where a machine may announce
# an address that is not its own (gratuitous ARP): on most public clouds it
# may not, and the provider's own network load balancer takes the place of
# both keepalived and the second machine's address (docs/load-balancing.md).
#
# HAProxy binds every address of the machine (bind :443), so it starts on the
# machine that does not hold the virtual address too.

global_defs {
    router_id cactusfs-lb1
}

# The address moves when HAProxy is gone, not only when the machine is: two
# failed looks, 2 s apart, put this instance into the FAULT state.
vrrp_script chk_haproxy {
    script "/usr/bin/pgrep -x haproxy"
    interval 2
    timeout 2
    fall 2
    rise 2
}

vrrp_instance cactusfs {
    # Both machines start as BACKUP and do not take the address back from a
    # peer that holds it: one move for a failure, none for the repair.
    state BACKUP
    nopreempt
    interface eth0
    virtual_router_id 51
    priority 150
    advert_int 1

    unicast_src_ip 10.0.0.5
    unicast_peer {
        10.0.0.6
    }

    virtual_ipaddress {
        10.0.0.10/24 dev eth0
    }

    track_script {
        chk_haproxy
    }
}
