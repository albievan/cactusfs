# Example - adapt before use; not run by the project's gates.
#
# nginx as a TCP (TLS passthrough) balancer for the development cluster of
# deploy/compose/compose.yaml: the equivalent of haproxy.compose.cfg, as a
# whole nginx.conf. It needs the stream module, which the official image
# (docker.io/library/nginx) has. To try it, name the image and this file in a
# copy of compose.haproxy.yaml:
#
#   image: docker.io/library/nginx:1.28        # a deployment pins a digest
#   volumes:
#     - ../examples/loadbalancer/nginx-stream.conf:/etc/nginx/nginx.conf:ro
#
# (and take read_only and cap_drop out of the copy, or give nginx writable
# /var/cache/nginx and /var/run: the official image starts as root and writes
# there).
#
# WHAT THIS CANNOT DO. Open-source nginx has no active health checks in
# "stream": the health_check directive belongs to NGINX Plus. What is left is
# passive: a node is set aside after max_fails failed CONNECTIONS within
# fail_timeout, for fail_timeout. So nginx
#   - never asks /readyz. A node that is draining, or one that is starting
#     (its S3 port is open and answers 503 to everything), keeps receiving
#     new connections until its port closes;
#   - notices a node that has stopped only when a connection to it fails; the
#     client of that connection is passed on to the next node and sees
#     nothing, which is the one thing that does work well.
# Use it where that is acceptable, and HAProxy where it is not.
#
# nginx looks the names of the nodes up once, when it starts or reloads: a
# node that is not up then stops nginx from starting, and a node that comes
# back under another address is not found until a reload.

worker_processes auto;
error_log /dev/stderr notice;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
}

stream {
    upstream cactusfs_s3 {
        least_conn;
        server node1:9000 max_fails=2 fail_timeout=10s;
        server node2:9000 max_fails=2 fail_timeout=10s;
        server node3:9000 max_fails=2 fail_timeout=10s;
        server node4:9000 max_fails=2 fail_timeout=10s;
    }

    upstream cactusfs_admin {
        least_conn;
        server node1:9001 max_fails=2 fail_timeout=10s;
        server node2:9001 max_fails=2 fail_timeout=10s;
        server node3:9001 max_fails=2 fail_timeout=10s;
        server node4:9001 max_fails=2 fail_timeout=10s;
    }

    # S3. No "ssl" on the listener and none towards the nodes: the bytes of
    # the client's TLS session are passed through, and the node ends it.
    server {
        listen 9443;
        proxy_pass cactusfs_s3;
        proxy_connect_timeout 5s;
        # Inactivity in both directions, not the length of a transfer.
        proxy_timeout 15m;
    }

    # Console, Swagger UI and management API. Publish this port to those who
    # administer the cluster only (compose.haproxy.yaml binds it to
    # 127.0.0.1).
    server {
        listen 9444;
        proxy_pass cactusfs_admin;
        proxy_connect_timeout 5s;
        proxy_timeout 15m;
    }
}
