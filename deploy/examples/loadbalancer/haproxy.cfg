# Example - adapt before use; not run by the project's gates.
#
# HAProxy in front of a CactusFS cluster on virtual machines. The same file
# goes on both balancer machines; keepalived.conf moves one address between
# them. Written for HAProxy 3.0; it uses nothing that 2.8 does not have.
# Check it with: haproxy -c -f /etc/haproxy/haproxy.cfg
#
# Every name and address is a placeholder:
#   s3.example.com        the name S3 clients use        -> 10.0.0.10 (the VIP)
#   console.example.com   the name administrators use    -> 10.0.0.10
#   10.0.0.11 to .14      the nodes with the gateway role (and console)
#   10.0.1.0/24           the network administrators come from
#   /etc/haproxy/cactusfs-ca.pem   the CA that signed the certificate the
#                         nodes serve on 9000 and 9001 (--tls-cert)
#
# The nodes are assumed to run with --drain-delay 10s. The default of the
# binary is 0s, which gives a balancer no time at all: see the arithmetic at
# the backends, and docs/load-balancing.md.

global
    log /dev/log local0
    user haproxy
    group haproxy
    daemon
    maxconn 20000
    stats socket /run/haproxy/admin.sock mode 660 level admin

defaults
    mode tcp
    log global
    option tcplog
    option dontlognull
    timeout connect 5s
    # Inactivity, not the length of a transfer: a transfer that moves bytes is
    # never cut by these. The nodes close idle connections after 60 s
    # themselves. Do not go below a few minutes: a client waits in silence
    # while a large multipart upload is completed.
    timeout client 15m
    timeout server 15m
    timeout queue 30s
    timeout check 2s

# --- variant 1: TLS passthrough (in use below) -------------------------------
# HAProxy forwards TCP. The node ends the client's TLS session with its own
# certificate, which must therefore carry s3.example.com (and
# *.s3.example.com with --s3-domain) and console.example.com. Nothing of a
# request can be changed here, which is exactly what SigV4 wants. The nodes
# see the balancer's address as the client's: there is no PROXY protocol and
# no trusted X-Forwarded-For in CactusFS today.

frontend s3
    bind :443
    maxconn 15000
    default_backend s3_nodes

frontend admin
    bind :8443
    maxconn 1000
    # The console of a new deployment has the user admin with the password
    # admin (ADR-0014): this port is for the administrators' network only.
    acl from_admin_net src 10.0.1.0/24
    tcp-request connection reject unless from_admin_net
    default_backend admin_nodes

# S3: port 9000 of every node with the gateway role.
#
# The check goes to port 9001: /readyz is served by the admin listener and by
# nothing else, over TLS, without credentials. 200 is ready; 503 is starting,
# draining, or cut off from the metadata group.
#
# Drain arithmetic. A node that is told to stop answers 503 at once and keeps
# serving for --drain-delay. It is out of rotation after at most
#   inter x fall + timeout check = 2 s x 2 + 2 s = 6 s,
# so --drain-delay must be longer: 10s here. Change one, change the other.
#
# The certificate is verified, against the name clients use: the nodes are
# addressed by IP, which their certificate does not name. Prove that it is
# verified on your version: point check-sni and verifyhost at a wrong name and
# watch every server go down.
backend s3_nodes
    balance leastconn
    option httpchk
    http-check send meth GET uri /readyz ver HTTP/1.1 hdr Host s3.example.com
    http-check expect status 200
    default-server check port 9001 check-ssl verify required ca-file /etc/haproxy/cactusfs-ca.pem check-sni s3.example.com verifyhost s3.example.com inter 2s fall 2 rise 2 maxconn 4000
    server node1 10.0.0.11:9000
    server node2 10.0.0.12:9000
    server node3 10.0.0.13:9000
    server node4 10.0.0.14:9000

# Console, Swagger UI, management API: port 9001 of every node with the
# gateway AND the console role (a gateway without the console role serves the
# API and Swagger UI but no console). No stickiness: console sessions and
# Idempotency-Key records are kept in the replicated metadata.
backend admin_nodes
    balance leastconn
    option httpchk
    http-check send meth GET uri /readyz ver HTTP/1.1 hdr Host console.example.com
    http-check expect status 200
    default-server check check-ssl verify required ca-file /etc/haproxy/cactusfs-ca.pem check-sni console.example.com verifyhost console.example.com inter 2s fall 2 rise 2 maxconn 500
    server node1 10.0.0.11:9001
    server node2 10.0.0.12:9001
    server node3 10.0.0.13:9001
    server node4 10.0.0.14:9001

# --- variant 2: TLS ended here, and begun again towards the nodes ------------
# Use it only when the balancer must hold the public certificate. To switch,
# comment out "frontend s3" and "backend s3_nodes" above and take the "#" off
# what follows. What it must keep to:
#   - TLS to the nodes, verified. There is no plaintext listener to send to
#     (--dev-plaintext binds to loopback only).
#   - The Host header, the path and the query go through untouched - HAProxy
#     does that unless told otherwise. No "http-request set-header Host", no
#     "http-request set-path", no "http-request normalize-uri": the signature
#     covers all three.
#   - No header whose name begins with x-amz-, and no Content-MD5, is added:
#     the nodes refuse a request that carries one the client did not sign.
#   - No "option http-buffer-request": bodies stream. There is no limit on
#     the size of a body here, and there must be none below 5 GiB.
#   - No "option forwardfor": harmless, and useless - the nodes do not read
#     X-Forwarded-For, and record this balancer's address either way.
#   - The certificate file holds the public certificate, its chain and its
#     key, for s3.example.com and, with --s3-domain, *.s3.example.com.
#
# frontend s3
#     mode http
#     bind :443 ssl crt /etc/haproxy/certs/s3.example.com.pem alpn h2,http/1.1 ssl-min-ver TLSv1.2
#     maxconn 15000
#     option httplog
#     timeout http-request 10s
#     timeout http-keep-alive 50s
#     default_backend s3_nodes_reencrypt
#
# backend s3_nodes_reencrypt
#     mode http
#     balance leastconn
#     option httpchk
#     http-check send meth GET uri /readyz ver HTTP/1.1 hdr Host s3.example.com
#     http-check expect status 200
#     default-server ssl verify required ca-file /etc/haproxy/cactusfs-ca.pem sni str(s3.example.com) ssl-min-ver TLSv1.2 check port 9001 check-ssl check-sni s3.example.com inter 2s fall 2 rise 2 maxconn 4000
#     server node1 10.0.0.11:9000
#     server node2 10.0.0.12:9000
#     server node3 10.0.0.13:9000
#     server node4 10.0.0.14:9000
