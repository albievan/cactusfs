# expect: networkPolicy.egressTo[1].ports: name the ports
# Laid over ci/cluster-values.yaml; the chart must refuse to render: a rule
# without ports would let the pods reach every port of its peers.
networkPolicy:
  egressTo:
    - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: vault}}}]
      ports: [8200]
    - to: [{ipBlock: {cidr: 203.0.113.10/32}}]
