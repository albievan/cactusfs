# expect: extraEnv sets CACTUSFS_UPDATE_CA, and updates.caSecret sets it too
# Laid over ci/cluster-values.yaml; the chart must refuse to render.
updates: {caSecret: cactusfs-update-ca}
extraEnv:
  - {name: CACTUSFS_UPDATE_SOURCE, value: "https://mirror.example/releases"}
  - {name: CACTUSFS_UPDATE_CA, value: /etc/other/ca.crt}
