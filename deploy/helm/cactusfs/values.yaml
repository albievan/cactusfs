# CactusFS on Kubernetes.
#
# A cluster is a set of nodes in pools. Every node is a StatefulSet of one
# pod: a node has an identity of its own - its ID, its certificate and key,
# its drives - and keeps it for life.

image:
  # Where a release is published (README, "Releases"). For an image built
  # here with `make image` and loaded into the cluster, or pushed to a
  # registry of your own, say its name: repository: cactusfs.
  repository: ghcr.io/albievan/cactusfs
  # The build to run: <version>-<build>, as `make image` tags it and
  # `cactusfs version` says it (0.7.0-412). When empty, the chart's appVersion:
  # the release, of whatever build. Pods are labelled app.kubernetes.io/version
  # with it.
  tag: ""
  # A digest (sha256:...) to run exactly that image; it wins over the tag.
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

# The domain of the cluster's DNS.
clusterDomain: cluster.local

# Pools of nodes. A node is named <release>-<pool>-<index>, with the name
# of the Helm release as it is; that name is its node ID, the one name in its
# certificate, and the name of its Secret below.
# roles: empty for all roles (the node votes in the metadata group), or names
# separated by commas, without "meta", for a node that stores and serves but
# does not vote.
# Across all pools 3 or 5 nodes must vote, and at least 4 must store - or
# exactly one node in all, which is a standalone deployment.
pools:
  - name: meta
    replicas: 3
    roles: ""
    # region, zone, rack: where the pool's nodes are, for the placement of
    # shards. Leave empty where there is nothing to tell apart.
    topology: {}
    nodeSelector: {}
    tolerations: []
  - name: data
    replicas: 1
    roles: gateway,storage,console
    topology: {}
    nodeSelector: {}
    tolerations: []

# Drives of every node that stores, and the volume of its metadata.
drives:
  count: 2
  size: 100Gi
metadata:
  size: 10Gi
# The storage class of the claims. Empty: the cluster's default. The chart
# depends on no particular driver.
storageClassName: ""

# Volumes on the disks of one named machine, for a cluster that has no
# storage driver to rely on - a single-machine k3s, a test bench. The
# directories <basePath>/<node ID>/<volume> must exist and belong to the
# user the pods run as. Not for production: every node's drives are then on
# one machine.
localVolumes:
  enabled: false
  basePath: ""
  nodeName: ""

# --- secrets: the chart makes none, and starts nothing without them ---------
secrets:
  # Root credentials: a Secret with the keys access-key and secret-key.
  root: ""
  # The certificate of the S3 and admin listeners: a kubernetes.io/tls Secret.
  tls: ""
  # The CA of node certificates: a Secret with the key ca.crt.
  nodeCA: ""
  # Each node's certificate and key: one kubernetes.io/tls Secret per node,
  # named <node ID><nodeTLSSuffix>, whose certificate names the node ID. A
  # pod mounts its own and no other. cert-manager can issue them; nothing
  # here requires it.
  nodeTLSSuffix: -node-tls

kms:
  # vault: HashiCorp Vault Transit - what a cluster uses in production.
  # local: a sealed key file. For one node; for more only with dev.localKMS.
  type: vault
  vault:
    addr: ""
    transitMount: transit
    key: ""
    namespace: ""
    # A Secret with the key token, mounted as a file. A Vault agent that
    # writes the same file can take its place.
    tokenSecret: ""
    # Optional: a Secret with the key ca.crt, when Vault's CA is not public.
    caSecret: ""
  local:
    # A Secret with the key kms.json (made by "cactusfs dev-init").
    keyFileSecret: ""
    # A Secret with the key passphrase.
    passphraseSecret: ""

dev:
  # Lets a cluster of several nodes share one sealed local KMS key file. A
  # development arrangement: every node can then open every key.
  localKMS: false

s3:
  # The domain of virtual-hosted-style requests; empty for path-style only.
  domain: ""
  region: us-east-1

# The Service of the S3 API, named after the release. ClusterIP by default:
# how it is published is the operator's choice.
service:
  type: ClusterIP
  port: 9000
  # Only with type NodePort or LoadBalancer.
  nodePort: null
  annotations: {}

# The Service of the management API, Swagger UI and the console, named
# <release>-admin: published apart from S3, and by default not at all. A new
# deployment has the console user admin with the password admin (ADR-0014):
# delete it or change its password before this Service is opened to anybody.
adminService:
  type: ClusterIP
  port: 9001
  nodePort: null
  annotations: {}

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: "4"
    memory: 4Gi

probes:
  periodSeconds: 5
  failureThreshold: 3
  timeoutSeconds: 3
  # How long a node may take to start answering at all.
  startupSeconds: 120
# How long in-flight requests get to finish after the drain delay.
shutdownTimeoutSeconds: 30

# Pods of the cluster are kept apart by this key. DoNotSchedule is what a
# cluster of several machines wants; ScheduleAnyway lets them share one.
spread:
  topologyKey: kubernetes.io/hostname
  whenUnsatisfiable: DoNotSchedule

podDisruptionBudget:
  # One node at a time: a cluster reads and writes with one node away.
  maxUnavailable: 1

# --- monitoring: both off; the chart needs no Prometheus Operator -----------
# A PodMonitor (monitoring.coreos.com/v1) that scrapes /metrics of every pod
# of the release on its admin port - the nodes that are no gateway too, which
# no Service with that port is in front of. Only for a cluster that has the
# Prometheus Operator's resource definitions. Prometheus must also be let in:
# networkPolicy.adminFrom names who reaches port 9001.
podMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  # /metrics requires a credential. A Secret, in the release's namespace,
  # with one key whose value is <access key ID>:<secret> of an API key whose
  # owner is allowed admin:GetMetrics and nothing else. Required when enabled.
  bearerTokenSecret:
    name: ""
    key: token
  # The certificate of the pod is always checked: the credential goes to
  # nobody else, and no value turns that off.
  tlsConfig:
    # Pods are scraped by their addresses, which no certificate names: a
    # name that the certificate of secrets.tls carries. Required when enabled.
    serverName: ""
    # The CA that signed that certificate, when it is not one Prometheus
    # trusts already: a Secret in the release's namespace.
    caSecret:
      name: ""
      key: ca.crt
  # Labels the Prometheus Operator selects PodMonitors by.
  labels: {}
# A PrometheusRule (monitoring.coreos.com/v1) with the alerting rules of
# deploy/observability/rules, which the chart carries in files/.
prometheusRule:
  enabled: false
  # Labels the Prometheus Operator selects PrometheusRules by.
  labels: {}

logLevel: info
otlpEndpoint: ""
extraEnv: []
podAnnotations: {}
podLabels: {}

# Default deny, with the exceptions a cluster needs.
networkPolicy:
  enabled: true
  # Who may reach the S3 port: a list of NetworkPolicy peers (podSelector,
  # namespaceSelector, ipBlock). Empty: nobody - name your clients, your
  # ingress controller's namespace, or a network.
  clientsFrom: []
  # Who may reach the admin port, in the same form. Empty: nobody.
  adminFrom: []
  # Where the pods may ask for names.
  dns:
    - namespaceSelector:
        matchLabels: {kubernetes.io/metadata.name: kube-system}
      podSelector:
        matchLabels: {k8s-app: kube-dns}
  # What else the pods may reach - Vault, a collector of traces: peers in
  # the same form, and ports. With kms.type=vault this must say where Vault
  # is, or the nodes could not open their keys.
  #   - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: vault}}}]
  #     ports: [8200]
  #   - to: [{ipBlock: {cidr: 10.0.0.5/32}}]
  #     ports: [8200]
  egressTo: []

# --- checking for releases (ADR-0029) --------------------------------------
# The nodes check for releases once extraEnv sets CACTUSFS_UPDATE_SOURCE
# (README, "Upgrading from the console"). These give the check the files it
# may need, each from a Secret mounted as a file; both only with the source.
updates:
  # A Secret with the key ca.crt: the CA certificates the source's
  # certificate is verified against (update-ca) - the CA of a mirror of your
  # own. Empty: the system's CAs.
  caSecret: ""
  # A Secret with the key trusted_root.json: the Sigstore trusted root that
  # releases are verified against instead of the one in the binary
  # (update-trusted-root), after a rotation of Sigstore's keys that the
  # binary has not seen. Empty: the binary's.
  trustedRootSecret: ""

# --- upgrading from the console (ADR-0029): off ----------------------------
upgrade:
  fromConsole:
    # Lets the console move the nodes to a newer release's image, one at a
    # time, this chart's way: it gives the cactusfs container - and only it -
    # a short-lived token of a ServiceAccount whose Role may get and patch the
    # nodes' StatefulSets, get their pods and evict them, each by name, and
    # lets the pods reach the API server. The node's own setting
    # CACTUSFS_UPGRADE_MODE=kubernetes is set with it. Whoever may upgrade
    # from the console then chooses the image the nodes run - among the
    # releases signed for their version. After such an upgrade the next
    # `helm upgrade` must name the installed digest or a newer one
    # (--set image.digest=...), or it puts the nodes back (README, "Upgrading
    # from the console"). The nodes find releases only once extraEnv sets
    # CACTUSFS_UPDATE_SOURCE, and networkPolicy.egressTo has a rule to it on
    # 443. The token can patch the StatefulSets' pod templates, which is as
    # good as creating any pod - with any Secret and ServiceAccount - in the
    # namespace: give the chart a namespace of its own (README, "What the
    # token can reach").
    enabled: false
    # Where the pods reach the API server, for the NetworkPolicy: its
    # addresses as the pods see them after the Service's translation - the
    # endpoints of the Service kubernetes in the namespace default
    # (kubectl get endpointslices -n default -l kubernetes.io/service-name=kubernetes)
    # - and their port (6443 on k3s and kubeadm). Required when enabled with
    # networkPolicy.enabled.
    apiServer:
      cidrs: []
      port: 6443
