{{- if .Values.serviceMonitor.enabled }}
{{- $sm := .Values.serviceMonitor -}}
{{- $token := $sm.bearerTokenSecret | default dict -}}
{{- $tls := $sm.tlsConfig | default dict -}}
{{- $ca := $tls.caSecret | default dict -}}
{{- if or (not $token.name) (not $token.key) -}}{{- fail "serviceMonitor.bearerTokenSecret: /metrics answers no one without a credential: name the Secret, and its key, that holds <access key ID>:<secret> of an API key allowed admin:GetMetrics" -}}{{- end -}}
{{- if and (not $tls.serverName) (not $tls.insecureSkipVerify) -}}{{- fail "serviceMonitor.tlsConfig.serverName: pods are scraped by their addresses, which no certificate names: say a name the certificate of secrets.tls carries" -}}{{- end -}}
{{- if and $ca.name (not $ca.key) -}}{{- fail "serviceMonitor.tlsConfig.caSecret: name the key of the Secret that holds the CA" -}}{{- end -}}
# For the Prometheus Operator; rendered only when serviceMonitor.enabled.
# Scrapes /metrics of every pod behind the admin Service, over TLS, with a
# credential from a Secret. The selector matches every Service of the release;
# only the admin Service has a port named admin, so only its pods are targets.
# The job is named after the label app.kubernetes.io/name: "cactusfs", whatever
# the release is called, which is the job the alerting rules look for.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "cactusfs.fullname" . }}
  labels:
    {{- include "cactusfs.labels" . | nindent 4 }}
    {{- with $sm.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  jobLabel: app.kubernetes.io/name
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace | quote }}
  selector:
    matchLabels: {{- include "cactusfs.selector" . | nindent 6 }}
  endpoints:
    - port: admin
      path: /metrics
      scheme: https
      interval: {{ $sm.interval | quote }}
      scrapeTimeout: {{ $sm.scrapeTimeout | quote }}
      authorization:
        type: Bearer
        credentials:
          name: {{ $token.name | quote }}
          key: {{ $token.key | quote }}
      tlsConfig:
        {{- with $tls.serverName }}
        serverName: {{ . | quote }}
        {{- end }}
        {{- if $ca.name }}
        ca:
          secret:
            name: {{ $ca.name | quote }}
            key: {{ $ca.key | quote }}
        {{- end }}
        {{- if $tls.insecureSkipVerify }}
        insecureSkipVerify: true
        {{- end }}
{{- end }}
