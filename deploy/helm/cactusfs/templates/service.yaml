{{- include "cactusfs.validate" . -}}
{{- $full := include "cactusfs.fullname" . -}}
# How the nodes find each other: a name per pod, there before the pod is
# ready - a node must reach its peers in order to become ready.
apiVersion: v1
kind: Service
metadata:
  name: {{ $full }}-nodes
  labels: {{- include "cactusfs.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: {{- include "cactusfs.selector" . | nindent 4 }}
  ports:
    - {name: rpc, port: 9002, targetPort: rpc}
    - {name: raft, port: 9003, targetPort: raft}
---
# What S3 clients use: the nodes with the gateway role that are ready.
apiVersion: v1
kind: Service
metadata:
  name: {{ $full }}
  labels: {{- include "cactusfs.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "cactusfs.selector" . | nindent 4 }}
    cactusfs.io/gateway: "true"
  ports:
    - name: s3
      port: {{ .Values.service.port }}
      targetPort: s3
      {{- if and .Values.service.nodePort (ne .Values.service.type "ClusterIP") }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
---
# The management API, Swagger UI and the console: a Service of their own,
# published - or not - apart from S3. A new deployment has a console user
# whose password everybody knows (ADR-0014).
apiVersion: v1
kind: Service
metadata:
  name: {{ $full }}-admin
  labels: {{- include "cactusfs.labels" . | nindent 4 }}
  {{- with .Values.adminService.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.adminService.type }}
  selector:
    {{- include "cactusfs.selector" . | nindent 4 }}
    cactusfs.io/gateway: "true"
  ports:
    - name: admin
      port: {{ .Values.adminService.port }}
      targetPort: admin
      {{- if and .Values.adminService.nodePort (ne .Values.adminService.type "ClusterIP") }}
      nodePort: {{ .Values.adminService.nodePort }}
      {{- end }}
