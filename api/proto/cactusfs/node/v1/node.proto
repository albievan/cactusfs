// Node RPC: what the nodes of a CactusFS cluster ask of each other. It is
// spoken over mutual TLS 1.3 only, between nodes that hold a certificate of
// the cluster's node CA; no client of the object store ever uses it.
//
// Every response carries an Error. A call that reached the other node and was
// answered is a successful RPC, whatever the answer; a failed RPC means the
// node could not be reached or did not answer. Callers rely on the
// difference: only an answer says for certain what the other node did.
//
// Compatibility: this package is checked with `buf breaking`. Fields are only
// ever added.
syntax = "proto3";

package cactusfs.node.v1;

option go_package = "github.com/albievan/cactusfs/internal/adapters/noderpc/nodev1/cactusfs/node/v1;nodev1";

// Error is a failure reported by the node that was asked.
message Error {
  // Stable names of the conditions the failure is an instance of, such as
  // "shard_not_found" or "not_leader". A receiver ignores names it does not
  // know.
  repeated string codes = 1;
  // Text for logs. It never contains secrets or object contents.
  string message = 2;
}

// ShardId names one shard: the stored data it belongs to and its position.
message ShardId {
  // 16 bytes.
  bytes data_id = 1;
  uint32 index = 2;
}

// NodeService describes a node and answers questions about its work in
// progress.
service NodeService {
  // Info describes the node: who it is, what it does, which drives it has.
  rpc Info(InfoRequest) returns (InfoResponse);
  // InFlight reports whether the node has a write under way, or one whose
  // outcome it does not know, that uses the given stored data. The garbage
  // collector of every storage node asks every node before it removes a
  // shard.
  rpc InFlight(InFlightRequest) returns (InFlightResponse);
  // Settings returns how the node was configured, what it stores on and
  // which certificates it serves, as it may be shown: the node that answers
  // has redacted it, and the node that asked redacts it again. It is read
  // from the running node each time and stored nowhere. A node of a release
  // without this call answers the RPC with UNIMPLEMENTED.
  rpc Settings(SettingsRequest) returns (SettingsResponse);
  // DeliveryStatus reports how delivery to the targets of the deployment
  // stands: notifications, the export of the audit trail and replication to
  // another deployment. Only the node that leads the metadata group
  // delivers, so only it can say; a node that does not lead answers with the
  // error "not_leader". What is reported is what the leader holds in memory
  // since it came to lead, with the counts the metadata keeps. Neither an
  // endpoint nor the text of an error is ever part of it. A node of a
  // release without this call answers the RPC with UNIMPLEMENTED.
  rpc DeliveryStatus(DeliveryStatusRequest) returns (DeliveryStatusResponse);
}

message InfoRequest {}

message InfoResponse {
  Error error = 1;
  string node_id = 2;
  // Address of the node's Raft transport, as other nodes must dial it.
  string raft_addr = 3;
  repeated string roles = 4;
  string region = 5;
  string zone = 6;
  string rack = 7;
  string host = 8;
  // Newest metadata entry format the node's binary can apply.
  uint32 metadata_version = 9;
  // Whether the node knows of a metadata group: it has bootstrapped one or
  // been added to one.
  bool formed = 10;
  repeated Drive drives = 11;
  // Address of the node's RPC listener, as other nodes must dial it.
  string rpc_addr = 12;
  // The deployment the node belongs to, as far as it knows: the ID in the
  // drive topology it has a copy of. Empty on a node that has none, which is
  // every node until a new cluster has recorded its topology.
  string deployment_id = 13;
}

// Drive is a drive attached to a node.
message Drive {
  string id = 1;
  // Whether the drive holds no shard.
  bool empty = 2;
  // The deployment the drive is claimed for; empty when unclaimed.
  string deployment_id = 3;
}

message InFlightRequest {
  // 16 bytes.
  bytes data_id = 1;
}

message InFlightResponse {
  Error error = 1;
  bool in_flight = 2;
}

message SettingsRequest {}

message SettingsResponse {
  Error error = 1;
  string node_id = 2;
  Build build = 3;
  // When the process started, in seconds since the Unix epoch; 0 when the
  // node does not say.
  int64 started_at_unix = 4;
  // The name of the key that wraps data keys. A name, never key material.
  string kms_key_id = 5;
  repeated Setting settings = 6;
  repeated DriveSettings drives = 7;
  // Where the node keeps its metadata. Absent on a node that keeps none.
  Volume metadata = 8;
  repeated Certificate certificates = 9;
  repeated string roles = 10;
  // The placement labels that are set: region, zone, rack, host.
  map<string, string> labels = 11;
}

// Build names the build of a binary.
message Build {
  string version = 1;
  // The number of the build.
  string build = 2;
  string commit = 3;
}

// Setting is one setting of a node. The words of kind, scope and source
// travel as strings, so that a release that adds one is still understood: a
// receiver treats a kind it does not know as a secret.
message Setting {
  string name = 1;
  // The environment variable, such as "CACTUSFS_S3_ADDR".
  string env = 2;
  // The flag, without dashes; empty for a setting that has none.
  string flag = 3;
  // The heading the setting is listed under.
  string group = 4;
  // "plain", "path", "url", "secret" or "secret-file".
  string kind = 5;
  // "node" or "cluster".
  string scope = 6;
  // "default", "environment", "flag" or "derived".
  string source = 7;
  // Whether the setting has a value. For the secret kinds it is all that is
  // sent.
  bool set = 8;
  // The redacted value: always empty for the kinds "secret" and
  // "secret-file"; without userinfo, query and fragment for "url"; at most
  // 4096 bytes.
  string value = 9;
}

// Filesystem is the file system behind a directory, where the node can
// tell. Mount options are never sent: they can hold credentials.
message Filesystem {
  string type = 1;
  string device = 2;
  string mount_point = 3;
}

// Volume is a directory a node stores in.
message Volume {
  // The directory as the node sees it.
  string directory = 1;
  // What the deployment calls the volume, as the node was told; empty when
  // it was told nothing.
  string label = 2;
  Filesystem filesystem = 3;
  uint64 total_bytes = 4;
  uint64 free_bytes = 5;
}

// DriveSettings is one drive of a node and where it is.
message DriveSettings {
  string id = 1;
  Volume volume = 2;
  // Whether the node can use the drive.
  bool online = 3;
}

// Certificate is what may be said of a certificate a node serves. Nothing
// of the key.
message Certificate {
  // "s3" for the listeners clients reach, "node" for node RPC and Raft.
  string use = 1;
  string subject = 2;
  string issuer = 3;
  repeated string dns_names = 4;
  repeated string ip_addresses = 5;
  // Seconds since the Unix epoch.
  int64 not_before_unix = 6;
  int64 not_after_unix = 7;
}

message DeliveryStatusRequest {
  // The targets to report on, by name. Empty asks for every target. A name
  // that is not a target's is left out of the answer.
  repeated string targets = 1;
}

message DeliveryStatusResponse {
  Error error = 1;
  // In name order.
  repeated TargetDelivery targets = 2;
}

// TargetDelivery is how delivery to one target stands. The words of state
// and of the class of an error travel as strings, so that a release that
// adds one is still understood: a receiver shows a word it does not know as
// it is.
message TargetDelivery {
  string name = 1;
  // "webhook", "nats" or "s3".
  string kind = 2;
  // "ok", "retrying" or "stalled".
  string state = 3;
  // Rows of the outbox matched for the target and not yet acknowledged.
  uint64 pending = 4;
  // When the oldest of them was made, in seconds since the Unix epoch; 0
  // when nothing waits.
  int64 oldest_pending_unix = 5;
  // When the leader last delivered something, in seconds since the Unix
  // epoch; 0 when it has not since it came to lead.
  int64 last_success_unix = 6;
  // The class of the last failure, such as "timeout", "auth" or "rejected";
  // empty when the last attempt succeeded. Never the text of the error.
  string last_error_class = 7;
  // Rows that were dropped before they were sent, as the metadata counts
  // them.
  uint64 lost = 8;
  // Messages the target refused one by one - a webhook's 4xx other than 401,
  // 403, 408 and 429 - which are not sent again, since the leader came to
  // lead. A 401 and a 403 are of the credential: class "auth", tried again,
  // and not counted here.
  uint64 rejected = 9;
  // Versions the leader gave up on because they cannot be replicated, of
  // every bucket that uses the target, since it came to lead. Kind "s3"
  // only. It is the leader's own count of what it did; the exact figure of
  // one bucket is in that bucket's usage record, in the metadata, and is not
  // sent here.
  uint64 failed = 10;
  // Whether rows for replication were lost, so that the other deployment
  // lacks versions until a resync. Kind "s3" only.
  bool resync_needed = 11;
}

// MetaService is what a node asks of the members of the metadata Raft group.
service MetaService {
  // Propose has the leader commit one metadata entry. A node that does not
  // lead answers with the error "not_leader" and has logged nothing.
  rpc Propose(ProposeRequest) returns (ProposeResponse);
  // ReadIndex returns, from the leader, an index such that a node whose
  // state machine has applied it reflects every change acknowledged before
  // the call.
  rpc ReadIndex(ReadIndexRequest) returns (ReadIndexResponse);
  // Term returns the Raft term the node is in. A leader asks the voters to
  // prove that it still leads.
  rpc Term(TermRequest) returns (TermResponse);
  // Join adds the calling node to the Raft group. Only the leader can.
  rpc Join(JoinRequest) returns (JoinResponse);
  // Leave removes a node from the Raft group and from the record of nodes.
  // Only the leader can.
  rpc Leave(LeaveRequest) returns (LeaveResponse);
}

message ProposeRequest {
  // The entry in the metadata log format: one version byte, then the body.
  bytes entry = 1;
}

message ProposeResponse {
  Error error = 1;
  // The state machine's answer, set when error is empty. An entry the state
  // machine refused is reported in here, not in error.
  bytes result = 2;
}

message ReadIndexRequest {}

message ReadIndexResponse {
  Error error = 1;
  uint64 index = 2;
}

message TermRequest {}

message TermResponse {
  Error error = 1;
  uint64 term = 2;
}

message JoinRequest {
  // Must be the node the caller's certificate names.
  string node_id = 1;
  string raft_addr = 2;
  // Whether the node votes: nodes with the meta role do.
  bool voter = 3;
}

message JoinResponse {
  Error error = 1;
}

message LeaveRequest {
  string node_id = 1;
}

message LeaveResponse {
  Error error = 1;
}

// StorageService reaches the shards on the drives of a node.
service StorageService {
  // WriteShard writes one shard. The caller sends a header, any number of
  // chunks and a commit; the node answers the header as soon as it has
  // accepted or refused the shard, and the commit once the shard is flushed
  // to stable storage. A stream that ends without a commit leaves nothing
  // behind - and, for a rewrite, leaves the old shard as it was.
  rpc WriteShard(stream WriteShardRequest) returns (stream WriteShardResponse);
  // StatShard reports the size of a committed shard.
  rpc StatShard(StatShardRequest) returns (StatShardResponse);
  // ReadShard returns a range of a committed shard. Every byte returned has
  // passed checksum verification on the node that stores it.
  rpc ReadShard(ReadShardRequest) returns (ReadShardResponse);
  // DeleteShard removes a shard. Removing one that does not exist succeeds.
  rpc DeleteShard(DeleteShardRequest) returns (DeleteShardResponse);
  // ListShards lists the committed shards on a drive.
  rpc ListShards(ListShardsRequest) returns (stream ListShardsResponse);
}

message WriteShardRequest {
  oneof step {
    WriteShardHeader header = 1;
    bytes chunk = 2;
    WriteShardCommit commit = 3;
  }
}

message WriteShardHeader {
  string drive_id = 1;
  ShardId shard = 2;
  // Replace the shard if it exists, in one step at commit. Without it an
  // existing shard is an error: shards are immutable.
  bool rewrite = 3;
}

message WriteShardCommit {}

message WriteShardResponse {
  Error error = 1;
}

message StatShardRequest {
  string drive_id = 1;
  ShardId shard = 2;
}

message StatShardResponse {
  Error error = 1;
  int64 size = 2;
}

message ReadShardRequest {
  string drive_id = 1;
  ShardId shard = 2;
  int64 offset = 3;
  // At most 2 MiB.
  uint32 length = 4;
}

message ReadShardResponse {
  Error error = 1;
  bytes data = 2;
  // The size of the whole shard.
  int64 size = 3;
}

message DeleteShardRequest {
  string drive_id = 1;
  ShardId shard = 2;
}

message DeleteShardResponse {
  Error error = 1;
}

message ListShardsRequest {
  string drive_id = 1;
}

message ListShardsResponse {
  Error error = 1;
  repeated ShardInfo shards = 2;
}

message ShardInfo {
  ShardId shard = 1;
  // When the shard's content was last written, in nanoseconds since the Unix
  // epoch, by the clock of the node that stores it.
  int64 modified_unix_nano = 2;
  // How long ago that was, in nanoseconds, by the same clock. A node that
  // judges the age of a shard on another node uses this, so that the two
  // clocks need not agree.
  int64 age_nanos = 3;
}
