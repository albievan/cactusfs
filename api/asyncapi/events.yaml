      $ref: '#/channels/notificationObject'
  deliverAuditExported:
    action: send
    channel:
      $ref: '#/channels/auditExported'

components:
  messages:
    BucketCreated:
      name: cactusfs.bucket.created.v1
      title: A bucket was created
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              type:
                const: cactusfs.bucket.created.v1
              data:
                $ref: '#/components/schemas/Bucket'
    BucketDeleted:
      name: cactusfs.bucket.deleted.v1
      title: A bucket was deleted
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              type:
                const: cactusfs.bucket.deleted.v1
              data:
                $ref: '#/components/schemas/Bucket'
    ObjectCreated:
      name: cactusfs.object.created.v1
      title: An object version became the current version of its key
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              type:
                const: cactusfs.object.created.v1
              data:
                $ref: '#/components/schemas/Object'
    ObjectDeleted:
      name: cactusfs.object.deleted.v1
      title: A version of an object was removed for good; the payload describes it
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              type:
                const: cactusfs.object.deleted.v1
              data:
                $ref: '#/components/schemas/Object'
    BucketVersioningChanged:
      name: cactusfs.bucket.versioning-changed.v1
      title: A bucket began or stopped keeping the versions of its objects
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              type:
                const: cactusfs.bucket.versioning-changed.v1
              data:
                $ref: '#/components/schemas/BucketVersioning'
    ObjectDeleteMarkerCreated:
      name: cactusfs.object.delete-marker-created.v1
      title: An object in a bucket that keeps versions was deleted; the payload describes the delete marker that is now its newest version
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              type:
                const: cactusfs.object.delete-marker-created.v1
              data:
                $ref: '#/components/schemas/Object'
    ObjectRetentionChanged:
      name: cactusfs.object.retention-changed.v1
      title: The retention of an object version was set, extended or removed
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              type:
                const: cactusfs.object.retention-changed.v1
              data:
                $ref: '#/components/schemas/Object'
    ObjectLegalHoldChanged:
      name: cactusfs.object.legal-hold-changed.v1
      title: An object version was put under legal hold, or taken off it
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              type:
                const: cactusfs.object.legal-hold-changed.v1
              data:
                $ref: '#/components/schemas/Object'
    BucketObjectLockChanged:
      name: cactusfs.bucket.object-lock-changed.v1
      title: The default retention of a bucket was set, changed or removed
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              type:
                const: cactusfs.bucket.object-lock-changed.v1
              data:
                $ref: '#/components/schemas/Bucket'
    BucketConfigurationChanged:
      name: cactusfs.bucket.configuration-changed.v1
      title: The policy, the CORS rules or the tags of a bucket were set, changed or removed
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              type:
                const: cactusfs.bucket.configuration-changed.v1
              data:
                $ref: '#/components/schemas/Bucket'
    ObjectTagsChanged:
      name: cactusfs.object.tags-changed.v1
      title: The tags of an object version were set, changed or removed
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              type:
                const: cactusfs.object.tags-changed.v1
              data:
                $ref: '#/components/schemas/Object'
    RootCredentialSet:
      name: cactusfs.iam.root-credential-set.v1
      title: The deployment was given its root credential
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              type:
                const: cactusfs.iam.root-credential-set.v1
              data:
                $ref: '#/components/schemas/RootCredential'
    TopologyChanged:
      name: cactusfs.cluster.topology-changed.v1
      title: The assignment of drives to erasure sets was recorded or changed
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              type:
                const: cactusfs.cluster.topology-changed.v1
              data:
                $ref: '#/components/schemas/Topology'
    NodeRegistered:
      name: cactusfs.cluster.node-registered.v1
      title: A node was recorded as part of the cluster, or its record changed
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              type:
                const: cactusfs.cluster.node-registered.v1
              data:
                $ref: '#/components/schemas/Node'
    NodeRemoved:
      name: cactusfs.cluster.node-removed.v1
      title: A node was removed from the cluster
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              type:
                const: cactusfs.cluster.node-removed.v1
              data:
                $ref: '#/components/schemas/Node'
    AuditRecorded:
      name: cactusfs.audit.recorded.v1
      title: A record was appended to the audit trail
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              type:
                const: cactusfs.audit.recorded.v1
              data:
                $ref: '#/components/schemas/Audit'
    BucketQuotaChanged:
      name: cactusfs.bucket.quota-changed.v1
      title: The quota of a bucket was set, changed or removed. A write that a quota refused is no event
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              type:
                const: cactusfs.bucket.quota-changed.v1
              data:
                $ref: '#/components/schemas/BucketQuota'
    BucketReplicaModeChanged:
      name: cactusfs.bucket.replica-mode-changed.v1
      title: A bucket became the replica of another deployment's bucket, or was promoted
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              type:
                const: cactusfs.bucket.replica-mode-changed.v1
              data:
                $ref: '#/components/schemas/BucketReplicaMode'
    TargetChanged:
      name: cactusfs.cluster.target-changed.v1
      title: A target the deployment sends to was defined or changed
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              type:
                const: cactusfs.cluster.target-changed.v1
              data:
                $ref: '#/components/schemas/Target'
    TargetDeleted:
      name: cactusfs.cluster.target-deleted.v1
      title: A target was deleted
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              type:
                const: cactusfs.cluster.target-deleted.v1
              data:
                $ref: '#/components/schemas/Target'
    NotificationObject:
      name: cactusfs.notification.object.v1
      title: An object of a bucket was created or removed, told to a target in the form of an S3 event notification
      contentType: application/json
      headers:
        $ref: '#/components/schemas/DeliveryHeaders'
      payload:
        $ref: '#/components/schemas/NotificationRecords'
    AuditExported:
      name: cactusfs.audit.exported.v1
      title: One record of the audit trail, sent to a target
      contentType: application/json
      headers:
        $ref: '#/components/schemas/DeliveryHeaders'
      payload:
        $ref: '#/components/schemas/AuditExport'

  schemas:
    Envelope:
      type: object
      required: [id, type, sequence, data]
      properties:
        id:
          type: string
          description: Unique within a deployment and the same on every node. Consumers deduplicate by it.
        type:
          type: string
          description: The event name.
        sequence:
          type: integer
          minimum: 1
          description: Index of the metadata entry the event was derived from. Events are published in ascending order of it.
        time:
          type: string
          format: date-time
          description: When the change was made, as recorded in the change itself. Absent when the change carries no time.
        data:
          type: object
    Bucket:
      type: object
      required: [bucket]
      additionalProperties: false
      properties:
        bucket:
          type: string
    BucketVersioning:
      type: object
      required: [bucket, status]
      additionalProperties: false
      properties:
        bucket:
          type: string
        status:
          type: string
          enum: [Enabled, Suspended]
    Object:
      type: object
      required: [bucket, key, version_id, size, etag]
      additionalProperties: false
      properties:
        bucket:
          type: string
        key:
          type: string
        version_id:
          type: string
        size:
          type: integer
          minimum: 0
          description: Size of the object in bytes.
        etag:
          type: string
    RootCredential:
      type: object
      required: [access_key_id]
      additionalProperties: false
      description: The secret is never part of an event.
      properties:
        access_key_id:
          type: string
    Topology:
      type: object
      required: [deployment_id, version, erasure_sets, drives_per_set]
      additionalProperties: false
      properties:
        deployment_id:
          type: string
        version:
          type: integer
          minimum: 1
        erasure_sets:
          type: integer
          minimum: 1
        drives_per_set:
          type: integer
          minimum: 1
    Node:
      type: object
      required: [node_id]
      additionalProperties: false
      properties:
        node_id:
          type: string
        roles:
          type: array
          items:
            type: string
            enum: [gateway, meta, storage, console]
    Audit:
      type: object
      required: [sequence, actor, action, outcome, hash]
      additionalProperties: false
      description: >-
        Enough of an audit record to follow the hash chain. The record itself is read from
        the audit log. No secret is ever part of it.
      properties:
        sequence:
          type: integer
          minimum: 1
        actor:
          type: string
        action:
          type: string
        resource:
          type: string
        outcome:
          type: string
          enum: [success, denied, failed]
        hash:
          type: string
          description: SHA-256 of the record, which includes the hash of the record before it.
    BucketQuota:
      type: object
      required: [bucket, quota_bytes]
      additionalProperties: false
      properties:
        bucket:
          type: string
        quota_bytes:
          type: integer
          minimum: 0
          description: The most bytes the bucket may hold from now on; 0 when the quota was removed.
    BucketReplicaMode:
      type: object
      required: [bucket, source]
      additionalProperties: false
      properties:
        bucket:
          type: string
        source:
          type: string
          description: The ID of the deployment the bucket now takes its versions from; empty when it was promoted.
    Target:
      type: object
      required: [name]
      additionalProperties: false
      description: Which target. Neither its endpoint nor anything of its credentials is ever part of an event.
      properties:
        name:
          type: string
        kind:
          type: string
          enum: [webhook, nats, s3]
    DeliveryHeaders:
      type: object
      description: >-
        What travels beside the body of a message to a target. To a webhook as HTTP headers of a POST, with
        Content-Type application/json and User-Agent cactusfs/<version>, and with Authorization: Bearer
        <secret> when the target was given one. To NATS as message headers: Nats-Msg-Id carries what
        X-Cactusfs-Event-Id carries here - JetStream deduplicates by it - and Cactusfs-Event-Type what
        X-Cactusfs-Event-Type does; a NATS message is not signed, the connection is TLS and authenticated.
      required: [X-Cactusfs-Event-Id, X-Cactusfs-Event-Type, X-Cactusfs-Timestamp, X-Cactusfs-Signature]
      properties:
        X-Cactusfs-Event-Id:
          type: string
          description: >-
            Unique within the deployment for a message to a target, and the same every time the message is
            sent again: consumers deduplicate by it. For a notification it is the sequencer of the record
            in another spelling; for an audit record, "audit-" and its sequence. It is not signed: where it
            matters, read the sequencer or the sequence from the body.
        X-Cactusfs-Event-Type:
          type: string
          enum: [cactusfs.notification.object.v1, cactusfs.audit.exported.v1]
          description: Which of the two messages the body is. Not signed; the two bodies cannot be taken for each other.
        X-Cactusfs-Timestamp:
          type: string
          pattern: '^[0-9]{1,12}$'
          description: >-
            When this attempt was made, in seconds since the Unix epoch - of the attempt, not of the change,
            so that a message that waited is not refused for its age. A receiver refuses a request whose
            timestamp is more than five minutes from its own clock.
        X-Cactusfs-Signature:
          type: string
          pattern: '^v1=[0-9a-f]{64}$'
          description: >-
            "v1=" and, in lower-case hexadecimal, HMAC-SHA256 under the signing key of the target of: the
            value of X-Cactusfs-Timestamp, a full stop, and the body exactly as it was sent. A receiver
            computes the same over the bytes it received, compares in constant time, and refuses what does
            not match. The signing key is shown once, when the target is defined.
    NotificationRecords:
      type: object
      required: [Records]
      additionalProperties: false
      description: >-
        An S3 event notification. Always exactly one record a message. Object contents are never part of
        it, and neither is the address of the client: the metadata holds none.
      properties:
        Records:
          type: array
          minItems: 1
          maxItems: 1
          items:
            $ref: '#/components/schemas/NotificationRecord'
    NotificationRecord:
      type: object
      required: [eventVersion, eventSource, eventTime, eventName, s3]
      additionalProperties: false
      properties:
        eventVersion:
          const: '2.1'
        eventSource:
          const: cactusfs:s3
        eventTime:
          type: string
          format: date-time
          description: When the change was made, as the change itself records it.
        eventName:
          type: string
          enum:
            - ObjectCreated:Put
            - ObjectCreated:CompleteMultipartUpload
            - ObjectRemoved:Delete
            - ObjectRemoved:DeleteMarkerCreated
          description: >-
            What happened, as S3 names it. A copy arrives as a put and is told as one. ObjectRemoved:Delete
            is a version removed for good; ObjectRemoved:DeleteMarkerCreated is an object deleted in a
            bucket that keeps versions.
        userIdentity:
          type: object
          required: [principalId]
          additionalProperties: false
          description: Who made the change. Absent when it was not recorded.
          properties:
            principalId:
              type: string
              description: The actor as the audit trail names actors - root, user/<name>, key/<access key ID>, service/lifecycle.
        s3:
          type: object
          required: [bucket, object]
          additionalProperties: false
          properties:
            bucket:
              type: object
              required: [name]
              additionalProperties: false
              properties:
                name:
                  type: string
            object:
              type: object
              required: [key, sequencer]
              additionalProperties: false
              properties:
                key:
                  type: string
                  description: The key, URL-encoded as S3 encodes it in a notification - a space is "+".
                size:
                  type: integer
                  minimum: 0
                  description: The size of the version in bytes. Absent for a delete marker.
                eTag:
                  type: string
                  description: The entity tag of the version, without quotes. Absent for a delete marker.
                versionId:
                  type: string
                  description: The version, or the delete marker. Absent in a bucket that keeps no versions.
                sequencer:
                  type: string
                  pattern: '^[0-9a-f]{20}$'
                  description: >-
                    Orders the changes of a deployment: of two records the one with the greater sequencer -
                    compared as text - was made later. Records reach a target in ascending order of it,
                    except where one is sent again.
    AuditExport:
      type: object
      required: [stream, sequence, time, actor, action, outcome, hash]
      additionalProperties: false
      description: >-
        One record of the audit trail, whole, as the node writes it to its own output. The hash of each
        record covers the hash of the one before it, so a receiver that keeps every sequence can verify the
        chain. No secret is ever part of a record.
      properties:
        stream:
          const: audit
        sequence:
          type: integer
          minimum: 1
        time:
          type: string
          format: date-time
        actor:
          type: string
        access_key_id:
          type: string
        action:
          type: string
        resource:
          type: string
        outcome:
          type: string
          enum: [success, denied, failed]
        source_ip:
          type: string
        request_id:
          type: string
        details:
          type: object
          additionalProperties:
            type: string
        previous_hash:
          type: string
          description: The hash of the record before this one. Absent on the first record.
        hash:
          type: string
          description: SHA-256 of the record, which includes the hash of the record before it.
