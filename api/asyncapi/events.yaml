# CactusFS events. Contract first: an event exists here before any code
# publishes it, and internal/ports/events.go is held to this document by a
# test (internal/ports/events_test.go). Validated by `make contracts`.
#
# Every event is a fact: a change of state that was committed through Raft.
# Events are derived from applied Raft entries, never published by a request
# handler, so every node derives the same events with the same IDs.
#
# Names: cactusfs.<aggregate>.<event>.v<major>. A change that an existing
# consumer could not read gets a new name with the next major version; fields
# are otherwise only ever added.
#
# Delivery. There are two ways, and they promise different things.
#
# Inside each node's process, every event of this document but the two
# messages named below: at most once per node. An event can be missed (the
# node stops between committing the change and delivering the event, or
# catches up from a snapshot), and is never invented. Consumers must be
# idempotent and can recognise a repeated event by its id.
#
# To targets outside the deployment - webhooks and NATS JetStream servers that
# an administrator defined (ADR-0023, ADR-0025) - the two messages
# cactusfs.notification.object.v1 (a bucket notification) and
# cactusfs.audit.exported.v1 (a record of the audit trail): at least once.
# What is to be sent is kept in the replicated metadata until the target has
# acknowledged it, and is sent by the node that leads the metadata group, to
# each target in the order the changes were made. A message is sent again
# when its acknowledgement was not recorded - after a failure, and up to a
# batch of 100 after a change of leader - so a consumer must be idempotent:
# it recognises a repeated message by its id (the header X-Cactusfs-Event-Id
# of a webhook request, Nats-Msg-Id of a NATS message). A target that cannot
# be reached delays its own messages and nobody else's, and never a write. A
# message is lost in one case only, which is counted and said: more than
# 1 000 000 changes waiting for targets, of which the oldest is then dropped.
# Neither message is delivered inside the process, and neither carries the
# envelope: receivers written for S3 read the first as it is.
asyncapi: 3.0.0
info:
  title: CactusFS events
  version: 1.0.0
  description: State changes of a CactusFS deployment, derived from applied metadata entries.

defaultContentType: application/json

channels:
  bucketCreated:
    address: cactusfs.bucket.created.v1
    messages:
      event:
        $ref: '#/components/messages/BucketCreated'
  bucketDeleted:
    address: cactusfs.bucket.deleted.v1
    messages:
      event:
        $ref: '#/components/messages/BucketDeleted'
  objectCreated:
    address: cactusfs.object.created.v1
    messages:
      event:
        $ref: '#/components/messages/ObjectCreated'
  objectDeleted:
    address: cactusfs.object.deleted.v1
    messages:
      event:
        $ref: '#/components/messages/ObjectDeleted'
  bucketVersioningChanged:
    address: cactusfs.bucket.versioning-changed.v1
    messages:
      event:
        $ref: '#/components/messages/BucketVersioningChanged'
  objectDeleteMarkerCreated:
    address: cactusfs.object.delete-marker-created.v1
    messages:
      event:
        $ref: '#/components/messages/ObjectDeleteMarkerCreated'
  objectRetentionChanged:
    address: cactusfs.object.retention-changed.v1
    messages:
      event:
        $ref: '#/components/messages/ObjectRetentionChanged'
  objectLegalHoldChanged:
    address: cactusfs.object.legal-hold-changed.v1
    messages:
      event:
        $ref: '#/components/messages/ObjectLegalHoldChanged'
  bucketObjectLockChanged:
    address: cactusfs.bucket.object-lock-changed.v1
    messages:
      event:
        $ref: '#/components/messages/BucketObjectLockChanged'
  bucketConfigurationChanged:
    address: cactusfs.bucket.configuration-changed.v1
    messages:
      event:
        $ref: '#/components/messages/BucketConfigurationChanged'
  objectTagsChanged:
    address: cactusfs.object.tags-changed.v1
    messages:
      event:
        $ref: '#/components/messages/ObjectTagsChanged'
  rootCredentialSet:
    address: cactusfs.iam.root-credential-set.v1
    messages:
      event:
        $ref: '#/components/messages/RootCredentialSet'
  topologyChanged:
    address: cactusfs.cluster.topology-changed.v1
    messages:
      event:
        $ref: '#/components/messages/TopologyChanged'
  nodeRegistered:
    address: cactusfs.cluster.node-registered.v1
    messages:
      event:
        $ref: '#/components/messages/NodeRegistered'
  nodeRemoved:
    address: cactusfs.cluster.node-removed.v1
    messages:
      event:
        $ref: '#/components/messages/NodeRemoved'
  auditRecorded:
    address: cactusfs.audit.recorded.v1
    messages:
      event:
        $ref: '#/components/messages/AuditRecorded'
  bucketQuotaChanged:
    address: cactusfs.bucket.quota-changed.v1
    messages:
      event:
        $ref: '#/components/messages/BucketQuotaChanged'
  bucketReplicaModeChanged:
    address: cactusfs.bucket.replica-mode-changed.v1
    messages:
      event:
        $ref: '#/components/messages/BucketReplicaModeChanged'
  targetChanged:
    address: cactusfs.cluster.target-changed.v1
    messages:
      event:
        $ref: '#/components/messages/TargetChanged'
  targetDeleted:
    address: cactusfs.cluster.target-deleted.v1
    messages:
      event:
        $ref: '#/components/messages/TargetDeleted'
  notificationObject:
    address: cactusfs.notification.object.v1
    description: >-
      Bucket notifications, to the targets the rules of a bucket name. External only. The address is the
      name of the message, not where it is sent. A webhook target is sent it as the body of a POST to the
      target's endpoint. A NATS target is sent it on the one subject the target was defined with, whatever
      the bucket and the kind of change: the subject is the administrator's to choose and the stream that
      takes it is the operator's, which CactusFS neither creates nor changes.
    messages:
      event:
        $ref: '#/components/messages/NotificationObject'
  auditExported:
    address: cactusfs.audit.exported.v1
    description: >-
      The audit trail, record by record in the order of its sequence, to the targets that were defined to
      take it. External only; sent to a webhook and to NATS as a notification is, on the same endpoint and
      the same subject.
    messages:
      event:
        $ref: '#/components/messages/AuditExported'

