openapi: 3.0.3
info:
  title: CactusFS management API
  version: 1.0.0
  description: |
    The management API of CactusFS: buckets and objects, users, groups, roles,
    policies and API keys, the state of the cluster, and the audit trail; the
    quota of a bucket, the targets the deployment sends to, and the
    notifications and the replication of a bucket; the tags of buckets and
    objects, the tag rules of a bucket, and the deployment's catalogue of tags.

    **Authentication.** Every request is authenticated, except signing in and
    fetching this document. Send an API key as a bearer credential,
    `Authorization: Bearer <access key ID>:<secret key>`, or - from the
    console - the session cookie that signing in sets. A request made with a
    session that changes something must also carry the CSRF token of that
    session in `X-CSRF-Token`. One that does not is answered 403 with the
    problem code `CSRFTokenInvalid` - not 401: the session is there, and
    `getSession` returns its CSRF token (`csrf_token`). The cookie belongs to
    the browser and the token to one tab of it: a tab whose token is not that
    of the session the cookie stands for now - another tab signed in, say -
    asks `getSession` again.

    **Authorization.** Every request is decided by the same authorizer as the
    S3 API, from the policies of the user. What a request needs is named in
    each operation as `x-cactusfs-action`.

    **Errors** are `application/problem+json` (RFC 9457).

    **A path this document does not name.** A request whose path begins with
    `/api/v1/` and that is none of the operations of this document - a path
    it does not name, or a method that a path it names does not have - is
    answered 404 `application/problem+json` with the problem code `NotFound`,
    whatever its method, and whether or not it carries a credential: it is
    answered before anybody is asked who sent it, and says nothing that this
    document does not. (`HEAD` of a path that has a `GET` is that `GET`
    without its body, as HTTP has it; the object and its preview answer it
    405 `MethodNotAllowed`.) `NotFound` is answered for nothing else: a
    bucket, object, version, user or other entity that is not there has a
    code of its own (`NoSuchBucket`, `NoSuchObject`, `NoSuchVersion`,
    `NoSuchEntity`, `NoSuchSubBucket`), so a client answered `NotFound` for an
    operation of this document is talking to a node of a release that does
    not have that operation yet.

    **A locked session.** A console session that reaches its timeout while its
    user is uploading objects is not ended: it is locked. A locked session may
    store objects (`putObject`), read its own state (`getSession`), unlock
    (`unlockSession`) and sign out (`signOut`). Every other operation answers
    423 with the problem code `SessionLocked` - not 401, which says that the
    session is gone. The password of the session's user unlocks it. A session
    is locked no longer than the uploads last and a moment more, and no longer
    than the deployment allows; then it has ended, and the answer is 401. An
    API key is never locked. What is wrong with a request whoever sent it is
    still said first: 400, 404, 415 and 501 are answered to a locked session
    as to any other.

    **A changed password** ends every console session of the user, at once,
    that of the user who changed it included: the next request answers 401.

    **Idempotency.** Every request that changes something accepts
    `Idempotency-Key`. A request repeated with the same key and the same
    content gets the answer the first one got, and changes nothing again; with
    the same key and other content it is refused with 422; while the first is
    still being carried out it is refused with 409. Keys are kept for 24 hours.
    A locked session is given no answer that was kept, and none of its
    answers is: with a key or without, it is answered 423 - but for an upload,
    whose repeat is answered as ever. A request whose body may hold a secret
    (`createUser`, `updateUser`, `putTarget`) is recognised again by a slow
    hash of the body, never by the body or a plain hash of it; when that hash
    cannot be made at once the request is answered 429 with `Retry-After`,
    and nothing is reserved.
servers:
  - url: /api/v1
security:
  - apiKey: []
  - session: []
tags:
  - name: session
    description: Signing in to the console and out of it.
  - name: buckets
  - name: objects
  - name: search
    description: Finding buckets and objects by name.
  - name: catalogue
    description: The deployment's catalogue of tags, for users to pick from when tagging (ADR-0018).
  - name: users
  - name: groups
  - name: roles
  - name: policies
  - name: keys
    description: API keys.
  - name: targets
    description: The places outside the deployment that it sends to - webhooks, NATS servers, other deployments.
  - name: cluster
  - name: updates
    description: Which releases there are, which of them may be installed, and installing one.
  - name: audit
  - name: meta
    description: This document.
paths:
  /session:
    post:
      operationId: signIn
      tags: [session]
      summary: Sign in to the console
      description: |
        Checks a user name and password and starts a session. The session token is set as an HttpOnly cookie;
        the CSRF token is returned once, here. `Idempotency-Key` is accepted and has no effect: an answer that
        holds a session is never given twice, so repeating a sign-in starts another session.
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInRequest'
      responses:
        '200':
          description: Signed in.
          headers:
            Set-Cookie:
              description: The session cookie.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        default:
          $ref: '#/components/responses/Problem'
    get:
      operationId: getSession
      tags: [session]
      summary: Who is making this request
      description: |
        The identity of the caller. For a console session it also says when the session reaches its timeout,
        whether it is locked, and its CSRF token. A locked session can ask this.
      responses:
        '200':
          description: The identity of the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Identity'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: signOut
      tags: [session]
      summary: Sign out
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204':
          description: Signed out. The cookie is cleared.
          headers:
            Set-Cookie:
              description: Clears the session cookie.
              schema:
                type: string
        default:
          $ref: '#/components/responses/Problem'
  /session/unlock:
    post:
      operationId: unlockSession
      tags: [session]
      summary: Unlock the session with the user's password
      description: |
        Checks the password of the user the session belongs to - no user name is taken - and gives the session
        its full authority back, for another lifetime. The session gets a new token, set as the cookie, and a
        new CSRF token, returned once, here; the tokens it had are refused from then on. It is accepted on a
        session that is not locked too, and does the same.

        A password that is not accepted answers 403 with the code `AccessDenied` - not 401 - and the session
        stays as it was. Too many attempts from one address answer 429 with the code `TooManyAttempts` and
        `Retry-After`, as at sign-in: failed sign-ins and failed unlocks are counted together. After too many
        wrong passwords for one session the session is ended: the answer is then 401 and the cookie is
        cleared. A session that had ended before is answered 401 as well, and the cookie is left alone.
        A request made with an API key answers 400: a key has nothing to unlock.

        Send it once. The tokens the request came with are refused the moment it has succeeded: the same
        request sent again answers 401, although the session lives on under the tokens of the first answer.

        `Idempotency-Key` is accepted and has no effect: nothing of a request that holds a password is kept,
        and an answer that holds a session is never given twice.
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnlockRequest'
      responses:
        '200':
          description: Unlocked. The session has a new token and a new CSRF token.
          headers:
            Set-Cookie:
              description: The session cookie, with the new token.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        default:
          $ref: '#/components/responses/Problem'
  /buckets:
    get:
      operationId: listBuckets
      tags: [buckets]
      summary: List buckets
      description: |
        Every bucket, in name order. With `details=true` every bucket also carries `details`: who created
        it and its latest uploads and downloads, where the caller holds `admin:GetObjectAccess` on that
        bucket - the keys of the objects only where the caller holds `s3:ListBucket` on it as well - and a
        summary of the bucket's policy, where the caller holds `s3:GetBucketPolicy` on it. Every upload
        and download is of an object, and is additionally decided for that object as
        `GET /buckets/{bucket}/object/access` decides it: a row is given only where the caller holds
        `admin:GetObjectAccess` on its key, and is otherwise left out whole - who, when and key - so a
        policy that denies the action by key holds here too. The action is required on the bucket as
        well: a caller who holds it on objects only is given `access_included: false` and no row, which
        is stricter than the object list's `access_included`. Those
        permissions decide only what the list carries, bucket by bucket: a caller without them is given
        the same list with `access_included: false` or `policy_included: false`. The list is authorized
        as it is without `details`, is never refused for want of those permissions, and nothing is written
        to the audit trail for a part that is left out; where a part may be shown and cannot be read, the
        list fails as any read that fails does.
      x-cactusfs-action: s3:ListAllMyBuckets
      parameters:
        - name: details
          in: query
          description: |
            Whether every bucket should carry `details`: its creator, its latest uploads and downloads
            and a summary of its policy, each as far as the caller may see it. See `BucketDetails`.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: The buckets.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Bucket'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createBucket
      tags: [buckets]
      summary: Create a bucket
      description: |
        Makes the bucket. A bucket made through this API or the console by a release that implements tag rules
        (ADR-0018) is given the tag rule `lowercase` from the start: its tags are kept in lower case until its
        rules say otherwise (`/buckets/{bucket}/tag-rules`). One made by an earlier release, or with S3's
        `CreateBucket`, has no tag rules.
      x-cactusfs-action: s3:CreateBucket
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BucketCreate'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bucket'
        default:
          $ref: '#/components/responses/Problem'
  /buckets/{bucket}:
    get:
      operationId: getBucket
      tags: [buckets]
      summary: Get a bucket
      x-cactusfs-action: s3:ListBucket
      parameters:
        - $ref: '#/components/parameters/BucketName'
      responses:
        '200':
          description: The bucket.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bucket'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteBucket
      tags: [buckets]
      summary: Delete an empty bucket
      x-cactusfs-action: s3:DeleteBucket
      parameters:
        - $ref: '#/components/parameters/BucketName'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204':
          description: Deleted.
        default:
          $ref: '#/components/responses/Problem'
  /buckets/{bucket}/usage:
    get:
      operationId: getBucketUsage
      tags: [buckets]
      summary: How many objects a bucket holds, and their size together
      description: |
        How many objects the bucket holds and their sizes together - the current versions; older versions and
        uploads in progress are not part of `object_count` and `total_size`.

        Where the metadata store keeps a count of the bucket, the answer is that count: `exact` and
        `complete` are true, and `versions`, `stored_bytes` and `upload_bytes` say what the bucket keeps
        beyond its current versions - which is what a quota counts. A bucket made by a release that counts is
        counted from the start. One that is older is counted in the background, without being asked; until
        that is done, and on a deployment that does not count yet, `exact` is false and the answer is made as
        it always was, by reading the index: for a very large bucket that count stops at a bound and
        `complete` is false; the figures are then of the keys counted so far.
      x-cactusfs-action: s3:ListBucket
      parameters:
        - $ref: '#/components/parameters/BucketName'
      responses:
        '200':
          description: The bucket's usage.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BucketUsage'
        default:
          $ref: '#/components/responses/Problem'
  /buckets/{bucket}/usage/recount:
    post:
      operationId: recountBucketUsage
      tags: [buckets]
      summary: Count a bucket's usage again
      description: |
        Asks for the bucket's usage to be counted again from its index, as it was counted the first time: by
        the metadata store, in steps, while the bucket is used. The answer is given as soon as the count is
        asked for; `GET /buckets/{bucket}/usage` goes on answering from the figures there are until the new
        ones take their place, and `exact` stays true meanwhile. A count that comes out other than the
        figures that were kept is counted in `cactusfs_bucket_usage_drift_total`. Asking again while a count
        is under way starts it again.

        Answers 503 until every member of the metadata group is of a release that counts usage.

        The request has no body. Like every POST of this API it must still say
        `Content-Type: application/json`, and is refused with 415 otherwise.
      x-cactusfs-action: admin:RecountBucketUsage
      parameters:
        - $ref: '#/components/parameters/BucketName'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '202':
          description: The count was asked for.
        default:
          $ref: '#/components/responses/Problem'
  /buckets/{bucket}/quota:
    get:
      operationId: getBucketQuota
      tags: [buckets]
      summary: Get the quota of a bucket
      description: |
        The most bytes the bucket may hold, and how many it holds. A bucket without a quota is answered too:
        `quota_bytes` is then absent.
      x-cactusfs-action: admin:GetBucketQuota
      parameters:
        - $ref: '#/components/parameters/BucketName'
      responses:
        '200':
          description: The quota, or that there is none.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BucketQuota'
        default:
          $ref: '#/components/responses/Problem'
    put:
      operationId: putBucketQuota
      tags: [buckets]
      summary: Set the quota of a bucket
      description: |
        Sets the most bytes the bucket may hold. What counts is what the bucket keeps: every version of every
        object, current or not, by its size, and the parts of multipart uploads that are not completed. A
        quota below what the bucket holds already is accepted: nothing is removed, and nothing more is taken
        until enough was deleted.

        Once it is set, an upload, a copy or a part that would take the bucket past it is refused - in S3
        with `403 QuotaExceeded`, here with a 403 whose `code` is `QuotaExceeded`. Deleting is never refused.

        Having `s3:*` on the bucket does not give this: a bucket's own administrator cannot lift its limit.
      x-cactusfs-action: admin:PutBucketQuota
      parameters:
        - $ref: '#/components/parameters/BucketName'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BucketQuotaPut'
      responses:
        '200':
          description: Set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BucketQuota'
        '403':
          description: The caller is not allowed `admin:PutBucketQuota`. The refusal is written to the audit trail.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: |
            The bucket's usage is still being counted (`code` is `Conflict`): a quota can be set once
            `exact` is true. A bucket made by this release is exact from the start; one that was there before
            is counted without being asked.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteBucketQuota
      tags: [buckets]
      summary: Remove the quota of a bucket
      x-cactusfs-action: admin:DeleteBucketQuota
      parameters:
        - $ref: '#/components/parameters/BucketName'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204':
          description: Removed, or there was none.
        default:
          $ref: '#/components/responses/Problem'
  /buckets/{bucket}/policy:
    get:
      operationId: getBucketPolicy
      tags: [buckets]
      summary: Get the policy of a bucket
      description: |
        The bucket's policy (ADR-0011), as it was set - through this API or through S3's `PutBucketPolicy`,
        which set the same document. A bucket without a policy is answered too: `document` is then absent.
      x-cactusfs-action: s3:GetBucketPolicy
      parameters:
        - $ref: '#/components/parameters/BucketName'
      responses:
        '200':
          description: The policy, or that there is none.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BucketPolicy'
        default:
          $ref: '#/components/responses/Problem'
    put:
      operationId: putBucketPolicy
      tags: [buckets]
      summary: Set the policy of a bucket
      description: |
        Sets the bucket's policy, in place of the one it had: the document S3's `GetBucketPolicy` answers
        from then on. The language is that of identity policies with `Principal` (ADR-0011); every resource
        is the bucket or keys in it; no statement may allow `s3:BypassGovernanceRetention`, and nothing that
        writes, deletes or configures is ever allowed to a caller who has not authenticated, whatever the
        document says. A document of more than 20 KiB, or one that does not keep to these rules, is refused
        with 400 and the problem code `InvalidPolicy`, and the policy the bucket had is kept.
      x-cactusfs-action: s3:PutBucketPolicy
      parameters:
        - $ref: '#/components/parameters/BucketName'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BucketPolicyPut'
      responses:
        '200':
          description: Set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BucketPolicy'
        '400':
          description: |
            The document is not a bucket policy that can be kept (`code` is `InvalidPolicy`); `detail` says
            what is wrong with it.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteBucketPolicy
      tags: [buckets]
      summary: Remove the policy of a bucket
      description: |
        Removes the bucket's policy. What it allowed is refused from then on, unless the caller's own
        policies allow it; what it denied is no longer denied by it.
      x-cactusfs-action: s3:DeleteBucketPolicy
      parameters:
        - $ref: '#/components/parameters/BucketName'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204':
          description: Removed, or there was none.
        default:
          $ref: '#/components/responses/Problem'
  /buckets/{bucket}/subbuckets:
    get:
      operationId: listSubBuckets
      tags: [buckets]
      summary: List the sub-buckets of a bucket
      description: |
        The sub-buckets of the bucket (ADR-0017), in name order, at most 10. A sub-bucket is a named
        first-level prefix of its bucket: its objects are the keys that begin with its name and a slash, and
        S3 clients address them as keys of the bucket. A caller who holds `s3:ListSubBuckets` on the bucket
        is given every one. Any other caller is given those whose keys they may list; one they may not is
        left out, and nothing says it is there. A list is never given a policy: `getSubBucket` reads one.

        A caller who may list the bucket's keys and is shown none is given an empty list. A caller to whom
        nothing of the bucket is visible - who may neither list its sub-buckets, nor its keys, nor the keys
        of any of its sub-buckets - is refused with 403 (`code` is `AccessDenied`), and is not told whether
        the bucket is there: they are refused so for a bucket that is not there too. A caller who may list
        the bucket or its sub-buckets is told 404 (`code` is `NoSuchBucket`) for one that is not there.
      x-cactusfs-action: s3:ListSubBuckets
      parameters:
        - $ref: '#/components/parameters/BucketName'
      responses:
        '200':
          description: The sub-buckets.
          content:
            application/json:
              schema:
                type: array
                maxItems: 10
                items:
                  $ref: '#/components/schemas/SubBucketSummary'
        default:
          $ref: '#/components/responses/Problem'
  /buckets/{bucket}/subbuckets/{name}:
    get:
      operationId: getSubBucket
      tags: [buckets]
      summary: Get a sub-bucket and its policy
      x-cactusfs-action: s3:GetSubBucketPolicy
      parameters:
        - $ref: '#/components/parameters/BucketName'
        - $ref: '#/components/parameters/SubBucketName'
      responses:
        '200':
          description: The sub-bucket.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubBucket'
        '404':
          description: |
            The bucket is not there (`code` is `NoSuchBucket`), or it has no sub-bucket of this name (`code` is
            `NoSuchSubBucket`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'
    put:
      operationId: putSubBucket
      tags: [buckets]
      summary: Create a sub-bucket, or set its policy
      description: |
        Registers a sub-bucket of the bucket with the policy in the body, or - when the bucket has one of
        this name - sets its policy in place of the one it had; it keeps the time it was created. Without
        `policy` the sub-bucket has no policy of its own, and one it had is removed. Registering a sub-bucket
        over keys that exist adopts them: nothing is moved, copied or renamed.

        A bucket has at most 10 sub-buckets: an 11th is refused with 409 and the problem code
        `TooManySubBuckets`, decided when the change is committed. A name is 1 to 63 lower-case letters,
        digits and hyphens, beginning and ending with a letter or digit; sub-buckets do not nest.

        The policy is written in the language of bucket policies (ADR-0011) and confined to the sub-bucket:
        every resource is its keys (`arn:aws:s3:::<bucket>/<name>/*`), or the bucket for listing; its actions
        are those on objects and listing. It cannot allow `s3:BypassGovernanceRetention`, cannot allow
        anything to a caller who has not authenticated, and cannot deny listing. A document that does not
        keep to these rules, or is larger than 20 KiB, is refused with 400 and the problem code
        `InvalidPolicy`, and nothing is changed.

        The authorizer judges a request on a key of the sub-bucket by the caller's own policies, the
        bucket's policy and this one together: a deny in any refuses, an allow in any allows. Having this
        action is worth what `s3:PutBucketPolicy` is, for the sub-bucket's keys.
      x-cactusfs-action: s3:PutSubBucket
      parameters:
        - $ref: '#/components/parameters/BucketName'
        - $ref: '#/components/parameters/SubBucketName'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubBucketPut'
      responses:
        '200':
          description: Created, or its policy set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubBucket'
        '400':
          description: |
            The policy is not one a sub-bucket can have (`code` is `InvalidPolicy`; `detail` says what is
            wrong with it), or the name is not one a sub-bucket can have (`code` is `InvalidArgument`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: The bucket has 10 sub-buckets already (`code` is `TooManySubBuckets`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteSubBucket
      tags: [buckets]
      summary: Delete an empty sub-bucket
      description: |
        Removes the sub-bucket and its policy. Only an empty one is deleted: one under whose name the bucket
        holds no object, no older version, no delete marker and no upload in progress - decided when the
        change is committed, as for a bucket. Its keys are not deleted with it.
      x-cactusfs-action: s3:DeleteSubBucket
      parameters:
        - $ref: '#/components/parameters/BucketName'
        - $ref: '#/components/parameters/SubBucketName'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204':
          description: Deleted.
        '404':
          description: |
            The bucket is not there (`code` is `NoSuchBucket`), or it has no sub-bucket of this name (`code` is
            `NoSuchSubBucket`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: The bucket holds keys under the sub-bucket's name (`code` is `SubBucketNotEmpty`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /buckets/{bucket}/tags:
    get:
      operationId: getBucketTags
      tags: [buckets]
      summary: Get the tags of a bucket
      description: |
        The bucket's tags (ADR-0011), in key order - the same tags S3's `GetBucketTagging` gives. A bucket
        without tags is answered too, with none.
      x-cactusfs-action: s3:GetBucketTagging
      parameters:
        - $ref: '#/components/parameters/BucketName'
      responses:
        '200':
          description: The tags, or that there are none.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BucketTags'
        default:
          $ref: '#/components/responses/Problem'
    put:
      operationId: putBucketTags
      tags: [buckets]
      summary: Set the tags of a bucket
      description: |
        Replaces the bucket's tags with those in the body: the tags S3's `GetBucketTagging` gives from then on.
        A bucket has at most 50 tags; a key is 1 to 128 characters and a value at most 256, of letters, digits,
        spaces and `+ - = . _ : / @`, and a key is given once. An empty list removes every tag.

        Where the bucket's tag rules say `lowercase` (ADR-0018), keys and values are kept in lower case
        whatever case they are sent in, and the answer shows them so; two keys that are one key in lower case
        are refused, not merged. Tags that do not keep to these rules are refused with 400 and the problem
        code `InvalidArgument`, and the tags the bucket had are kept.
      x-cactusfs-action: s3:PutBucketTagging
      parameters:
        - $ref: '#/components/parameters/BucketName'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BucketTagsPut'
      responses:
        '200':
          description: Set. The tags as they are kept.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BucketTags'
        '400':
          description: The tags cannot be kept (`code` is `InvalidArgument`); `detail` says why.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteBucketTags
      tags: [buckets]
      summary: Remove the tags of a bucket
      description: |
        Removes every tag of the bucket. As in S3, it is asked as setting them is.
      x-cactusfs-action: s3:PutBucketTagging
      parameters:
        - $ref: '#/components/parameters/BucketName'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204':
          description: Removed, or there were none.
        default:
          $ref: '#/components/responses/Problem'
  /buckets/{bucket}/tag-rules:
    get:
      operationId: getBucketTagRules
      tags: [buckets]
      summary: Get the tag rules of a bucket
      description: |
        The rules for the tags of the bucket's objects (ADR-0018): whether tags are kept in lower case, whether
        an object may carry only tags of the deployment's catalogue (`/tag-definitions`), and which tags every
        object must carry. A bucket without rules is answered too: `lowercase` and `catalogue_only` are then
        false and `required` is empty. A bucket made through this API or the console by a release that
        implements tag rules lower-cases its tags from the start (see `createBucket`); one made with S3's
        `CreateBucket`, or by an earlier release, does not until its rules say so.
      x-cactusfs-action: s3:GetBucketTagRules
      parameters:
        - $ref: '#/components/parameters/BucketName'
      responses:
        '200':
          description: The rules, or that there are none.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagRules'
        default:
          $ref: '#/components/responses/Problem'
    put:
      operationId: putBucketTagRules
      tags: [buckets]
      summary: Set the tag rules of a bucket
      description: |
        Replaces the bucket's tag rules (ADR-0018). From then on every node of a release that enforces them
        keeps them by every way an object comes to have tags (but see **Rolling upgrades** below) - this API's upload and `putObjectTags`, and S3's `PutObject`, `CopyObject`, multipart
        uploads and `PutObjectTagging` alike - and `deleteObjectTags` (S3's `DeleteObjectTagging`) is refused
        where a tag is required. An object that breaks a rule is refused: here with 400 and the problem code
        `TagRuleViolated`, in S3 with `400 InvalidTag`. Objects that exist are left as they are, and tags
        stored before `lowercase` was set are lower-cased when they are next written.

        - `lowercase`: keys and values are kept in lower case whatever case they are sent in; two keys that
          are one key in lower case are refused, not merged. The keys and values of `required` must then be
          written in lower case.
        - `catalogue_only`: an object may carry only tags the catalogue defines, each with a value the
          definition allows.
        - `required`: at most 10 tags every object must carry - or, with `sub_bucket`, every object of that
          sub-bucket - each with one of `values` when they are given. A key is required once for the bucket
          and once for each sub-bucket.

        Rules that do not keep to these bounds are refused with 400 and the problem code `InvalidArgument`,
        and the rules the bucket had are kept. A rule is read once a request: an upload that races a change
        of the rules may be judged by the rules before. A definition of the catalogue whose key a rule
        requires cannot be deleted.

        **Rolling upgrades.** Rules are kept by the nodes of a release that enforces them. While a cluster is
        being upgraded to such a release, a node of an older release stores what it is sent without
        checking it against the rules - through S3 or through this API - and an older node's upload ignores
        `X-CactusFS-Tagging` and stores the object without tags. Objects stored so are left as they are, as
        those stored before the rules were set.

        Answers 503 until every member of the metadata group is of a release that knows tag rules.
      x-cactusfs-action: s3:PutBucketTagRules
      parameters:
        - $ref: '#/components/parameters/BucketName'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagRulesPut'
      responses:
        '200':
          description: Set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagRules'
        '400':
          description: The rules cannot be kept (`code` is `InvalidArgument`); `detail` says why.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteBucketTagRules
      tags: [buckets]
      summary: Remove the tag rules of a bucket
      description: |
        Removes the bucket's tag rules: from then on its tags are kept in the case they are sent in, any tag
        may be given, and none is required. Tags already kept are not changed. As for CORS and lifecycle
        rules, it is asked as setting them is.
      x-cactusfs-action: s3:PutBucketTagRules
      parameters:
        - $ref: '#/components/parameters/BucketName'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204':
          description: Removed, or there were none.
        default:
          $ref: '#/components/responses/Problem'
  /buckets/{bucket}/notifications:
    get:
      operationId: getBucketNotifications
      tags: [buckets]
      summary: Get the notification rules of a bucket
      description: |
        The rules by which changes of the bucket's objects are told to targets - what S3 calls the
        notification configuration, and the same document `GET /{bucket}?notification` gives. A bucket
        without rules is answered with none.
      x-cactusfs-action: s3:GetBucketNotification
      parameters:
        - $ref: '#/components/parameters/BucketName'
      responses:
        '200':
          description: The rules, in the order they were given.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BucketNotifications'
        default:
          $ref: '#/components/responses/Problem'
    put:
      operationId: putBucketNotifications
      tags: [buckets]
      summary: Set the notification rules of a bucket
      description: |
        Replaces the rules. A rule names a target by its name, never an address: targets are defined under
        `/targets` by who may define them, and each lists the buckets that may use it. A rule that names a
        target that is not there, is not of kind `webhook` or `nats`, or does not allow this bucket is refused
        with 400. No rules at all removes the configuration.

        From then on every change a rule matches is delivered to its target at least once, in the order the
        changes were made; see `api/asyncapi/events.yaml`, `cactusfs.notification.object.v1`. Nothing of
        before is delivered.

        Answers 503 until every member of the metadata group is of a release that knows notifications.
      x-cactusfs-action: s3:PutBucketNotification
      parameters:
        - $ref: '#/components/parameters/BucketName'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BucketNotificationsPut'
      responses:
        '200':
          description: Set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BucketNotifications'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteBucketNotifications
      tags: [buckets]
      summary: Remove the notification rules of a bucket
      description: |
        What was matched before is still delivered; nothing after is.
      x-cactusfs-action: s3:PutBucketNotification
      parameters:
        - $ref: '#/components/parameters/BucketName'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204':
          description: Removed, or there were none.
        default:
          $ref: '#/components/responses/Problem'
  /buckets/{bucket}/replication:
    get:
      operationId: getBucketReplication
      tags: [buckets]
      summary: Get the replication configuration of a bucket
      description: |
        Where the versions of this bucket are copied to - the same document `GET /{bucket}?replication`
        gives. 404 when the bucket has none.
      x-cactusfs-action: s3:GetReplicationConfiguration
      parameters:
        - $ref: '#/components/parameters/BucketName'
      responses:
        '200':
          description: The configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BucketReplication'
        default:
          $ref: '#/components/responses/Problem'
    put:
      operationId: putBucketReplication
      tags: [buckets]
      summary: Set the replication configuration of a bucket
      description: |
        Has every new version of the bucket that a rule matches copied to one bucket of another deployment,
        through a target of kind `s3` that allows this bucket. The bucket must keep versions (400 otherwise,
        and versioning cannot be suspended while the configuration is there) and must not itself be a replica
        (409). The bucket at the other end must be put into replica mode there, with this deployment as its
        source.

        Versions that were there before are not sent until a resync is asked for. Versions removed for good
        are never removed at the other end.

        Answers 503 until every member of the metadata group is of a release that knows replication.
      x-cactusfs-action: s3:PutReplicationConfiguration
      parameters:
        - $ref: '#/components/parameters/BucketName'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BucketReplicationPut'
      responses:
        '200':
          description: Set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BucketReplication'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteBucketReplication
      tags: [buckets]
      summary: Remove the replication configuration of a bucket
      description: |
        Nothing more is matched. What was matched and not yet sent is still sent. Nothing is removed at the
        other end, and the bucket there stays a replica until it is promoted there.
      x-cactusfs-action: s3:PutReplicationConfiguration
      parameters:
        - $ref: '#/components/parameters/BucketName'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204':
          description: Removed, or there was none.
        default:
          $ref: '#/components/responses/Problem'
  /buckets/{bucket}/replication/status:
    get:
      operationId: getBucketReplicationStatus
      tags: [buckets]
      summary: How far the replication of a bucket has come
      description: |
        What the node that leads the metadata group, which does the sending, says of the bucket's target, and
        the resync of the bucket if one was asked for. Any node answers; it asks the leader. 404 when the
        bucket has no replication configuration; 503 when there is no leader to ask.
      x-cactusfs-action: admin:GetReplicationStatus
      parameters:
        - $ref: '#/components/parameters/BucketName'
      responses:
        '200':
          description: The state of replication as the leader has it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BucketReplicationStatus'
        default:
          $ref: '#/components/responses/Problem'
  /buckets/{bucket}/replication/resync:
    post:
      operationId: resyncBucketReplication
      tags: [buckets]
      summary: Send what the other deployment lacks
      description: |
        Starts a walk of every version of the bucket, oldest key first, that asks the other deployment for
        each and sends those it does not have - the versions that were there before the configuration, and
        those that were lost to a target that could not be reached for too long (`resync_needed`). The walk
        is the leader's, goes on across a change of leader from where it had come, and is followed in
        `GET /buckets/{bucket}/replication/status`. Asking again starts it from the beginning. 404 when the
        bucket has no replication configuration.

        The request has no body. Like every POST of this API it must still say
        `Content-Type: application/json`, and is refused with 415 otherwise.
      x-cactusfs-action: admin:ResyncReplication
      parameters:
        - $ref: '#/components/parameters/BucketName'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '202':
          description: The resync was started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplicationResync'
        default:
          $ref: '#/components/responses/Problem'
  /buckets/{bucket}/replica:
    get:
      operationId: getBucketReplicaMode
      tags: [buckets]
      summary: Whether a bucket is the replica of another deployment's
      x-cactusfs-action: admin:GetBucketReplicaMode
      parameters:
        - $ref: '#/components/parameters/BucketName'
      responses:
        '200':
          description: The mode of the bucket.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BucketReplicaMode'
        default:
          $ref: '#/components/responses/Problem'
    put:
      operationId: putBucketReplicaMode
      tags: [buckets]
      summary: Make a bucket a replica, or promote it
      description: |
        With a `source`, the bucket becomes the replica of a bucket of that deployment: from then on it takes
        new versions and delete markers from that source only, and refuses everybody else's - the root
        identity's too - with `409 InvalidBucketState`. Reading is as before, and so is removing a version for
        good, which stays governed by the permissions and locks of this deployment. The bucket must keep
        versions, its usage must be exact, and it must have no replication configuration of its own (409
        otherwise).

        With an empty `source` the bucket is promoted: it takes writes again, and nothing more from the
        source. Promotion is the whole of failing over; nothing is sent back.

        Answers 503 until every member of the metadata group is of a release that knows replication.
      x-cactusfs-action: admin:PutBucketReplicaMode
      parameters:
        - $ref: '#/components/parameters/BucketName'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BucketReplicaModePut'
      responses:
        '200':
          description: Set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BucketReplicaMode'
        default:
          $ref: '#/components/responses/Problem'
  /buckets/{bucket}/objects:
    get:
      operationId: listObjects
      tags: [objects]
      summary: List the objects of a bucket
      description: |
        One page of the bucket's objects. With `access=true` every object also says who uploaded it and
        when, how often it was downloaded and copied, and when last - the figures of
        `/buckets/{bucket}/object/access`, without the readers - where the caller holds
        `admin:GetObjectAccess` on that object. That permission decides only what the listing carries: a
        caller without it is given the same listing with `access_included: false` and no `access` on any
        object. The listing is never refused for want of that permission, and nothing is written to the audit trail
        for it; where the facts may be shown and cannot be read, the listing fails as any read that fails does.
      x-cactusfs-action: s3:ListBucket
      parameters:
        - $ref: '#/components/parameters/BucketName'
        - name: prefix
          in: query
          description: Only keys that begin with this.
          schema:
            type: string
            maxLength: 1024
        - name: delimiter
          in: query
          description: Keys that contain it after the prefix are rolled up into common prefixes.
          schema:
            type: string
            maxLength: 16
        - name: continuation_token
          in: query
          description: The `next_continuation_token` of the previous page.
          schema:
            type: string
            maxLength: 4096
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 200
        - name: access
          in: query
          description: |
            Whether the listing should carry, for each object, who uploaded it and how often it was
            downloaded. It does so only for a caller who holds `admin:GetObjectAccess`; see
            `access_included`.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: One page of the listing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectList'
        default:
          $ref: '#/components/responses/Problem'
  /buckets/{bucket}/object:
    get:
      operationId: getObject
      tags: [objects]
      summary: Download an object
      x-cactusfs-action: s3:GetObject
      parameters:
        - $ref: '#/components/parameters/BucketName'
        - $ref: '#/components/parameters/ObjectKey'
      responses:
        '200':
          description: The content of the object.
          headers:
            Content-Length:
              schema:
                type: integer
                format: int64
            ETag:
              schema:
                type: string
            Last-Modified:
              schema:
                type: string
            Content-Disposition:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        default:
          $ref: '#/components/responses/Problem'
    put:
      operationId: putObject
      tags: [objects]
      summary: Upload an object
      description: |
        Stores the body as the object. `Content-Length` is required. With `Idempotency-Key`, a repeated request
        is recognised by its bucket, key, length and tags, not by its content.

        **Tags.** `X-CactusFS-Tagging` gives the version its tags, as S3's `x-amz-tagging` does: at most 10, a
        key of 1 to 128 characters and a value of at most 256, of letters, digits, spaces and
        `+ - = . _ : / @`, each key once. Tagging needs `s3:PutObjectTagging` on the object as well, as in S3;
        a locked session, which may do nothing but store objects, is refused an upload with tags (423,
        `SessionLocked`). The bucket's tag rules (ADR-0018, `/buckets/{bucket}/tag-rules`) hold for every
        upload that a node of a release that enforces them answers, with tags or without: where they say `lowercase` the tags are kept in lower case, and an
        upload whose tags they do not allow - a required tag missing or with a value it may not have, a tag
        outside the catalogue where only the catalogue's are taken - is refused with 400 and the problem code
        `TagRuleViolated`, whose `detail` names the rule, never a value. Nothing is stored then.

        A node of a release older than tags on this upload ignores `X-CactusFS-Tagging` and stores the object
        without tags, and checks no tag rule; while a cluster is being upgraded, an upload answered by such a
        node is stored so (see `putBucketTagRules`).
      x-cactusfs-action: s3:PutObject
      parameters:
        - $ref: '#/components/parameters/BucketName'
        - $ref: '#/components/parameters/ObjectKey'
        - name: Content-Type
          in: header
          description: The media type to store with the object.
          schema:
            type: string
            maxLength: 255
        - name: X-CactusFS-Tagging
          in: header
          description: |
            The tags of the version, as a URL query string - `stage=draft&team=finance` - each key and value
            URL-encoded. Given at most once.
          schema:
            type: string
            maxLength: 16384
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectMetadata'
        '403':
          description: |
            The caller is not allowed `s3:PutObject` on the object (`code` is `AccessDenied`), or the bucket
            has a quota and the object would take it past it (`code` is `QuotaExceeded`). Nothing was
            stored. Sending the same request again does not help until something was deleted or the quota
            was raised.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '400':
          description: |
            The bucket's tag rules do not allow the upload's tags, or their absence (`code` is
            `TagRuleViolated`), or the tags cannot be kept at all (`code` is `InvalidArgument`); `detail` says
            why. Nothing was stored.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteObject
      tags: [objects]
      summary: Delete an object
      x-cactusfs-action: s3:DeleteObject
      parameters:
        - $ref: '#/components/parameters/BucketName'
        - $ref: '#/components/parameters/ObjectKey'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204':
          description: Deleted, or was not there.
        default:
          $ref: '#/components/responses/Problem'
  /buckets/{bucket}/object/metadata:
    get:
      operationId: getObjectMetadata
      tags: [objects]
      summary: Get what is known about an object
      x-cactusfs-action: s3:GetObject
      parameters:
        - $ref: '#/components/parameters/BucketName'
        - $ref: '#/components/parameters/ObjectKey'
      responses:
        '200':
          description: The metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectMetadata'
        default:
          $ref: '#/components/responses/Problem'
  /buckets/{bucket}/object/access:
    get:
      operationId: getObjectAccess
      tags: [objects]
      summary: Get who uploaded an object and who downloaded it
      description: |
        Who uploaded the object and when, how often it was downloaded and used as the source of a copy, and
        by whom. The figures are best-effort counts, not an audit trail: every node counts in memory and hands
        its counts over every half a minute or so, a node that crashes loses what it had not handed over, and
        a transfer that was cut short counts like a whole one. They are counts of one version - in a bucket
        that keeps no versions an overwrite starts again at zero. Reading the object does not give the
        permission to see them.
      x-cactusfs-action: admin:GetObjectAccess
      parameters:
        - $ref: '#/components/parameters/BucketName'
        - $ref: '#/components/parameters/ObjectKey'
        - name: version_id
          in: query
          description: The version to ask about - `null`, or the ID of a version. Without it, the current version.
          schema:
            type: string
            pattern: '^(null|[0-9a-f]{32})$'
      responses:
        '200':
          description: What is known of the uploading and the reading of the object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectAccess'
        default:
          $ref: '#/components/responses/Problem'
  /buckets/{bucket}/object/tags:
    get:
      operationId: getObjectTags
      tags: [objects]
      summary: Get the tags of an object
      description: |
        The tags of a version of the object, in key order - the same tags S3's `GetObjectTagging` gives.
      x-cactusfs-action: s3:GetObjectTagging
      parameters:
        - $ref: '#/components/parameters/BucketName'
        - $ref: '#/components/parameters/ObjectKey'
        - $ref: '#/components/parameters/TaggedVersion'
      responses:
        '200':
          description: The tags of the version, or that it has none.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectTags'
        '404':
          description: There is no such bucket, object or version (`code` is `NoSuchBucket`, `NoSuchObject` or `NoSuchVersion`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '405':
          description: The version is a delete marker, which has no tags (`code` is `MethodNotAllowed`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'
    put:
      operationId: putObjectTags
      tags: [objects]
      summary: Set the tags of an object
      description: |
        Replaces the tags of a version of the object with those in the body - S3's `PutObjectTagging`. A
        version has at most 10 tags; a key is 1 to 128 characters and a value at most 256, of letters, digits,
        spaces and `+ - = . _ : / @`, and a key is given once. An empty list removes every tag, and is asked
        as `deleteObjectTags` is (`s3:DeleteObjectTagging`).

        The bucket's tag rules (ADR-0018, `/buckets/{bucket}/tag-rules`) hold: where they say `lowercase`
        the tags are kept in lower case and the answer shows them so, and tags they do not allow - a required
        tag missing or with a value it may not have, a tag outside the catalogue where only the catalogue's
        are taken - are refused with 400 and the problem code `TagRuleViolated`, whose `detail` names the
        rule, never a value. The tags the version had are then kept.
      x-cactusfs-action: s3:PutObjectTagging
      parameters:
        - $ref: '#/components/parameters/BucketName'
        - $ref: '#/components/parameters/ObjectKey'
        - $ref: '#/components/parameters/TaggedVersion'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ObjectTagsPut'
      responses:
        '200':
          description: Set. The tags as they are kept.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectTags'
        '400':
          description: |
            The bucket's tag rules do not allow the tags (`code` is `TagRuleViolated`), or they cannot be kept
            at all (`code` is `InvalidArgument`); `detail` says why.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: There is no such bucket, object or version (`code` is `NoSuchBucket`, `NoSuchObject` or `NoSuchVersion`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '405':
          description: The version is a delete marker, which has no tags (`code` is `MethodNotAllowed`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteObjectTags
      tags: [objects]
      summary: Remove the tags of an object
      description: |
        Removes every tag of a version of the object - S3's `DeleteObjectTagging`. Where the bucket's tag rules
        require a tag of the object it is refused with 400 and the problem code `TagRuleViolated`, and the tags
        are kept.
      x-cactusfs-action: s3:DeleteObjectTagging
      parameters:
        - $ref: '#/components/parameters/BucketName'
        - $ref: '#/components/parameters/ObjectKey'
        - $ref: '#/components/parameters/TaggedVersion'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204':
          description: Removed, or there were none.
        '400':
          description: The bucket's tag rules require a tag of the object (`code` is `TagRuleViolated`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: There is no such bucket, object or version (`code` is `NoSuchBucket`, `NoSuchObject` or `NoSuchVersion`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '405':
          description: The version is a delete marker, which has no tags (`code` is `MethodNotAllowed`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /buckets/{bucket}/object/preview:
    get:
      operationId: previewObject
      tags: [objects]
      summary: Get an object's bytes for the console to show
      description: |
        The bytes of an object version for the console to draw itself, when the object is of a kind it shows:
        an image (PNG, JPEG, GIF, WebP), a PDF, a Word document (DOCX), an Excel workbook (XLSX), or text, CSV
        or JSON. The answer is always `application/octet-stream` and an attachment, whatever the object is:
        `X-CactusFS-Preview-Kind` says what it is, and nothing of it is ever rendered by the browser on the
        console's origin.

        **Who may.** The caller needs `s3:GetObject` on the object - `s3:GetObjectVersion` when `version_id`
        is given - because a preview is never more than a download, AND either `admin:PreviewObject` on it or
        to own the version shown. The owner is the user who uploaded that version - by a console session or by
        one of their API keys; the root identity and keys that belong to no user own nothing, and a version
        uploaded before its uploader was recorded has no owner. An explicit Deny of `admin:PreviewObject`
        refuses the owner as well, an API key's own policy must allow both actions, and a locked session
        previews nothing. A refusal is written to the audit trail; a preview is not, and counts as a
        download.

        **What kind of thing it is** is decided from the type the object was stored with AND the signature
        of its first bytes, never from its key: both must say the same. A stored type of
        `application/octet-stream`, or none, lets the bytes decide for images and PDF only. SVG, HTML, XML,
        script and every type not listed are never previewed (415).

        **Bounds.** An object larger than the node's `preview-max-size` (32 MiB unless configured) is refused
        with 413 before any of it is read - but for text, CSV and JSON, of which the first 1 MiB is sent and
        `X-CactusFS-Preview-Truncated` says whether there is more. An image may have at most 16 384 pixels on
        a side and 40 megapixels in all, read from its header (413 when it has more, 415 when its size is not
        found in its first 256 KiB). A GIF frame that reaches past the GIF's screen is refused: when such a
        frame begins later in the object, the transfer is cut off there, and the answer is shorter than its
        `Content-Length` - an error, never a shorter image. A caller has at most 2 previews running at once and
        a node 16; beyond, the answer is 429 with `Retry-After`. There is no `Range`.

        An object encrypted with a customer key (SSE-C) cannot be previewed: this API never holds the key
        (409, `code` `CustomerKeyRequired`).
      x-cactusfs-action: admin:PreviewObject
      parameters:
        - $ref: '#/components/parameters/BucketName'
        - $ref: '#/components/parameters/ObjectKey'
        - name: version_id
          in: query
          description: The version to show - `null`, or the ID of a version. Without it, the current version.
          schema:
            type: string
            pattern: '^(null|[0-9a-f]{32})$'
      responses:
        '200':
          description: The bytes of the version, or the first 1 MiB of them for text, CSV and JSON.
          headers:
            X-CactusFS-Preview-Kind:
              description: What the object is shown as. Values are only ever added to.
              required: true
              schema:
                $ref: '#/components/schemas/PreviewKind'
            X-CactusFS-Preview-Truncated:
              description: Whether the object has more bytes than were sent (text, CSV and JSON only).
              required: true
              schema:
                type: boolean
            Content-Length:
              required: true
              schema:
                type: integer
                format: int64
            ETag:
              description: The entity tag of the version shown.
              required: true
              schema:
                type: string
            Content-Disposition:
              description: Always `attachment`.
              required: true
              schema:
                type: string
            Content-Security-Policy:
              description: Always `sandbox; default-src 'none'`.
              required: true
              schema:
                type: string
            Cross-Origin-Resource-Policy:
              description: Always `same-origin`.
              required: true
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '403':
          description: |
            The caller may not download the object, or neither owns the version nor is allowed
            `admin:PreviewObject` on it (`code` is `AccessDenied`). The refusal is written to the audit trail.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: There is no such bucket, object or version (`code` is `NoSuchBucket`, `NoSuchObject` or `NoSuchVersion`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: |
            The object is encrypted with a customer key (SSE-C), which this API never holds (`code` is
            `CustomerKeyRequired`). It can be downloaded through the S3 API with its key.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          description: |
            The object is larger than a preview may be, or the image has more pixels than a preview may have
            (`code` is `PreviewTooLarge`). Nothing of the object was sent; it can be downloaded.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '415':
          description: |
            The object is not of a kind the console shows, or its stored type and its bytes do not agree
            (`code` is `NotPreviewable`). Nothing of the object was sent; it can be downloaded.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '423':
          description: The session is locked (`code` is `SessionLocked`); a locked session previews nothing.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: |
            The caller has 2 previews running already, or the node 16 (`code` is `TooManyRequests`). Nothing
            was read; the same request can be sent again.
          headers:
            Retry-After:
              description: After how many seconds to send the request again.
              schema:
                type: integer
                minimum: 1
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /search:
    get:
      operationId: search
      tags: [search]
      summary: Search buckets and objects by name
      description: |
        Finds the buckets whose name, and the objects whose key, answer to `q`.

        **What is searched.** Only what the caller may list: the name of a bucket is a result for who may list
        the buckets (`s3:ListAllMyBuckets`), and the keys of a bucket are searched for who may list that bucket
        (`s3:ListBucket`, the bucket's own policy included). Buckets the caller may not list are passed over
        without a word. Who may list neither the buckets nor any bucket is refused with 403, as is a `bucket`
        the caller may not list. Current versions are searched; an object that was deleted is not found.

        **The query** is read in one of three ways.
        Plain text is found anywhere in a name, whatever its case: `report` finds `2025/Annual-Report.pdf`.
        Text with `*` or `?` in it is a pattern for the whole name, whatever its case: `*` stands for any run
        of characters, `/` included, and `?` for exactly one, so `*.pdf` finds every key that ends so.
        Text that begins with `rx:` is a regular expression in the RE2 syntax, taken as written - case and
        all - and found anywhere in a name unless it anchors itself: `rx:^logs/\d{4}/`. A regular expression
        that cannot be read is refused with 400, and `detail` says what the matter with it is.

        **Bounds.** One request looks at no more than 50 000 keys and 200 buckets, for no more than two
        seconds, and returns no more than `limit` results. When a bound stops it, `complete` is false and
        `next_continuation` goes on from there: send it as `continuation` with the same `q` and `bucket`.
        A page can be empty and still not be the last. Only buckets the caller may see count, and only such
        a bucket is where a page stops: `examined`, `complete` and the number of pages say nothing of the
        others. A caller runs one search at a time and a node eight; beyond that the answer is 429 with
        `Retry-After`.

        **What a page costs.** Before it looks at a key, every page decides again which buckets are the
        caller's to see - all of them, whatever `continuation` says - from the bucket policies as the node
        that answers has them, read page by page. That takes time in proportion to the number of buckets
        there are and the size of their policies, not to how many of them the caller may see nor to where the
        page begins. The node remembers what a policy says for as long as the policy does not change, so a
        page checks every policy and reads anew only those that changed: some 0.2 seconds for 5 000 buckets
        whose policies are 16 KiB each, 0.1 for 20 000 with policies of 1 KiB, on the machine it was measured
        on.

        **503 from a search.** Deciding counts towards the two seconds. When it takes them all, the answer is
        503 with `Retry-After: 1` and a `detail` that says so, and no part of an answer. That 503 has two
        causes, and only one of them passes. A node that was started not long ago remembers nothing yet and
        reads every policy in full - some ten times the work, 2.6 seconds for the 5 000 buckets above - but
        keeps what it has read when it gives up, so the same request sent again gets further and is soon
        answered. Past a size of the deployment, though, the two seconds are not enough even then: about
        10 000 buckets with policies of 16 KiB, or 150 000 with policies of 1 KiB, on that machine (the node
        remembers 128 MiB of policies and reads the others in full on every page). There the 503 is a limit
        and repeating the request does not help: search a `bucket` by name, which decides that bucket alone.
        The root identity is bound by no bucket policy, reads none, and is not subject to this.

        A `continuation` says where to go on and grants nothing. It is refused with 400 when it is not one
        this API gave out for the same `q` and `bucket`.

        Results come in order: buckets by name, each followed by its objects by key. A search is a read and
        leaves no audit record.
      x-cactusfs-action: s3:ListBucket
      parameters:
        - name: q
          in: query
          required: true
          description: What to search for - text, a wildcard, or `rx:` and a regular expression.
          schema:
            type: string
            minLength: 1
            maxLength: 256
        - name: bucket
          in: query
          description: Search the keys of this bucket only. Its name is then no result.
          schema:
            type: string
            minLength: 3
            maxLength: 63
        - name: continuation
          in: query
          description: The `next_continuation` of the previous page.
          schema:
            type: string
            maxLength: 4096
        - name: limit
          in: query
          description: The most results to return.
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        '200':
          description: One page of what was found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResults'
        '429':
          description: |
            The caller has a search running already, or the node is running as many as it runs at a time
            (`code` is `TooManyRequests`). Nothing was searched; the same request can be sent again.
          headers:
            Retry-After:
              description: After how many seconds to send the request again.
              schema:
                type: integer
                minimum: 1
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /tag-definitions:
    get:
      operationId: listTagDefinitions
      tags: [catalogue]
      summary: List the catalogue of tags
      description: |
        Every tag the deployment defines for its users to pick (ADR-0018), in key order, at most 200. Every
        built-in role may list them. A deployment whose metadata group is not yet all of a release that knows
        the catalogue has none.
      x-cactusfs-action: admin:ListTagDefinitions
      responses:
        '200':
          description: The definitions.
          content:
            application/json:
              schema:
                type: array
                maxItems: 200
                items:
                  $ref: '#/components/schemas/TagDefinition'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createTagDefinition
      tags: [catalogue]
      summary: Define a tag
      description: |
        Adds a definition to the catalogue: a key, what the tag is for, and optionally the only values it may
        have. The catalogue is always in lower case: a key or a value that is not is refused, and so is one no
        tag can have (see `TagDefinitionKey`). A key that is defined already is refused with 409 and the
        problem code `EntityAlreadyExists`; `putTagDefinition` changes it. That is decided before the
        definition is stored, not with it: two requests that define the same new key at the same moment may
        both be answered 201, and the definition is then that of the one stored last. The catalogue holds at most 200 definitions, each with at most 50 values: beyond is
        refused with 400 and the problem code `InvalidArgument`. Tags outside the catalogue stay allowed,
        but by a bucket whose tag rules say `catalogue_only`.

        Answers 503 until every member of the metadata group is of a release that knows the catalogue.
      x-cactusfs-action: admin:PutTagDefinition
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagDefinitionCreate'
      responses:
        '201':
          description: Defined.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagDefinition'
        '400':
          description: The definition cannot be kept (`code` is `InvalidArgument`); `detail` says why.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: |
            The key is defined already (`code` is `EntityAlreadyExists`) - as far as could be seen before the
            definition was stored; see above.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /tag-definitions/{key}:
    get:
      operationId: getTagDefinition
      tags: [catalogue]
      summary: Get a definition of the catalogue
      x-cactusfs-action: admin:GetTagDefinition
      parameters:
        - $ref: '#/components/parameters/TagDefinitionKeyParam'
      responses:
        '200':
          description: The definition.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagDefinition'
        '404':
          description: The catalogue does not define the key (`code` is `NoSuchEntity`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'
    put:
      operationId: putTagDefinition
      tags: [catalogue]
      summary: Define a tag, or change its definition
      description: |
        Defines the key with what the body says, in place of the definition it had: it keeps the time it was
        first defined. `values` empty lets the tag have any value. The bounds are those of
        `createTagDefinition`. Changing a definition changes no tag already kept, and no tag rule.

        Answers 503 until every member of the metadata group is of a release that knows the catalogue.
      x-cactusfs-action: admin:PutTagDefinition
      parameters:
        - $ref: '#/components/parameters/TagDefinitionKeyParam'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagDefinitionPut'
      responses:
        '200':
          description: Defined.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagDefinition'
        '400':
          description: The definition cannot be kept (`code` is `InvalidArgument`); `detail` says why.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteTagDefinition
      tags: [catalogue]
      summary: Remove a definition from the catalogue
      description: |
        Removes the definition. Tags already kept are not changed. While the tag rules of any bucket require a
        tag with this key it cannot be removed: 409 with the problem code `EntityInUse`, which does not say
        which bucket - the caller may not be allowed to know of it.
      x-cactusfs-action: admin:DeleteTagDefinition
      parameters:
        - $ref: '#/components/parameters/TagDefinitionKeyParam'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204':
          description: Removed.
        '404':
          description: The catalogue does not define the key (`code` is `NoSuchEntity`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: The tag rules of a bucket require a tag with this key (`code` is `EntityInUse`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /users:
