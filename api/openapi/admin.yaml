  /settings:
    get:
      operationId: getSettings
      tags: [cluster]
      summary: How every node of the deployment is configured
      description: |
        The settings of every node, its drives and the directories they are in, the certificates it serves, and
        what holds for the deployment as a whole. The node that answers asks every other node as the request is
        served, each at most once and all at the same time, and waits for none of them longer than three
        seconds: the view is live, and nothing of it is stored anywhere.

        **Nothing secret is part of it.** A setting of kind `secret` or `secret-file` is listed with `set` and
        never with a `value`; a setting of kind `url` is given without userinfo, query and fragment; no mount
        option of a file system and nothing of a private key is given. A value is cut at 4096 bytes. Each node
        redacts what it says of itself, and the node that answers redacts all of it again.

        A node that did not answer is listed with `answered: false` and the `reason`, and nothing else. A node
        of an older release, which cannot be asked, has the reason `unsupported`.
      x-cactusfs-action: admin:GetSettings
      responses:
        '200':
          description: The settings of the deployment as the answering node could gather them.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
        '403':
          description: The caller is not allowed `admin:GetSettings`. The refusal is written to the audit trail.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /updates:
    get:
      operationId: getUpdates
      tags: [updates]
      summary: Which releases there are, and which of them may be installed
      description: |
        What the answering node knows of releases: its own build, the releases it found when it last asked
        the update source, which of them may be installed from here and why the others may not, and how this
        deployment installs one. It is answered from the node's memory: **nothing is asked of any server to
        answer it.** What a node found is not shared with the other nodes and is not kept across a restart;
        another node may answer otherwise until it has asked too.

        **Air gap.** A deployment asks no server anything about releases until an operator sets
        `update-source` (`CACTUSFS_UPDATE_SOURCE`, https only); until then `source_configured` is false,
        `available` is empty and nothing has been checked. The node then asks by itself once every
        `update-check-interval` (24 hours unless configured), and when asked to (`POST /updates/check`).

        **What is listed** decides what is offered, never what is installed: the source is not trusted. A
        release may be installed when it is a newer patch of the running minor version, or the newest patch
        of the next minor version; pre-releases only on the channel `prerelease`. Each release that may not
        has its `refusal`. What is installed is believed only from the release's signed lists, verified on
        the node when it is installed (`POST /upgrade`).

        **Who may.** The caller needs `admin:GetUpdates` (`cluster-admin`, `auditor`). Nothing is written to
        the audit trail for an answer; a refusal is.

        A node of an earlier release does not know this path, and answers 404 `NotFound`.
      x-cactusfs-action: admin:GetUpdates
      responses:
        '200':
          description: What the answering node knows of releases.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdatesView'
        default:
          $ref: '#/components/responses/Problem'
  /updates/check:
    post:
      operationId: checkForUpdates
      tags: [updates]
      summary: Ask the update source for its releases now
      description: |
        Asks the update source for its releases now, on the answering node, and answers what the node knows
        then - as `GET /updates` does. Whether the source answered is in the view: `checked_at` is when it was
        asked, and `last_error` says, as a class only, why it could not be read; the source's own words are
        never given, and its address is never logged with what it may hold of a credential.

        **Air gap.** This makes the deployment call out, to the place the operator named and nowhere else.
        Without `update-source` nothing is asked, and the answer is 409 with the code `UpdatesOff`.

        **Who may.** The caller needs `admin:CheckForUpdates` (`cluster-admin`): it reads, but it makes the
        deployment call out, so it is not one of the `admin:Get*` actions. Every check is written to the
        audit trail, and so is a refusal.

        **Bounds.** A node asks at most once a minute, whoever asks; beyond, the answer is 429 with the code
        `TooManyRequests` and `Retry-After`, and nothing was asked.

        The request has no body. Like every POST of this API it must still say
        `Content-Type: application/json`, and is refused with 415 otherwise.
      x-cactusfs-action: admin:CheckForUpdates
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '200':
          description: The source was asked, or could not be; what the node knows now.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdatesView'
        '403':
          description: The caller is not allowed `admin:CheckForUpdates`. The refusal is written to the audit trail.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: |
            Checking for updates is off: no `update-source` is configured, which is how a deployment is by
            default (`code` is `UpdatesOff`). Nothing was asked of anyone.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: |
            The node asked less than a minute ago (`code` is `TooManyRequests`). Nothing was asked; `GET /updates`
            answers what that check found.
          headers:
            Retry-After:
              description: After how many seconds to send the request again.
              schema:
                type: integer
                minimum: 1
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /upgrade:
    post:
      operationId: startUpgrade
      tags: [updates]
      summary: Install a release on the deployment
      description: |
        Starts installing the release named, the way this deployment's `upgrade-mode` does: by replacing the
        binary of a deployment of one node (`binary`), or by moving the nodes to the release's image one at a
        time, the answering node last (`kubernetes`). The answer is given once the upgrade has begun; how far
        it has come is `GET /upgrade`, which the `Location` header names. Expect the answering node to restart
        during it.

        **What may be installed.** A release the node found when it last checked (`GET /updates`), whose
        `allowed` is true: a newer patch of the running minor version, or the newest patch of the next minor
        version. Anything else answers 409 with the code `UpgradeNotAllowed`. Before anything is installed the
        release's signed list - `SHA256SUMS` for a binary, `digests.txt` for an image - must verify against its
        Sigstore bundle, offline, as signed by the release workflow of this product at the tag of that very
        version, and the artifact must be the one the list names; otherwise the answer is 412 with the code
        `ReleaseNotVerified`, and nothing was installed.

        **Air gap.** Nothing is asked of any server until an operator sets `update-source`; without it the
        answer is 409 with the code `UpdatesOff`. Installing also needs `upgrade-mode`, which is `off` by
        default: when it is, or when what the mode needs is not there, the answer is 501 with the code
        `UpgradeUnavailable`, and `GET /updates` says why and what to do instead.

        **Who may.** The caller needs `admin:UpgradeCluster` (`cluster-admin`), and must be a console session
        whose user types the password again in this request: the server judges it, here. An API key can
        never install, whatever its policy says: it has no password to type, and is answered 403. A password
        that is not accepted answers 403 with the code `AccessDenied` - not 401 - and the session stays as it
        was. Too many attempts from one address answer 429 with the code `TooManyAttempts` and
        `Retry-After`, as at sign-in: failed sign-ins, unlocks and upgrades are counted together. After too
        many wrong passwords for one session the session is ended, and the answer is 401. A locked session
        installs nothing (423). One upgrade runs at a time (409, `UpgradeRunning`). Every start, and every
        refusal, is written to the audit trail, with the version it was from and to.

        `Idempotency-Key` is accepted and has no effect: nothing of a request that holds a password is kept,
        and an upgrade is never started from a stored answer.
      x-cactusfs-action: admin:UpgradeCluster
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpgradeRequest'
      responses:
        '202':
          description: The upgrade has begun.
          headers:
            Location:
              description: Where its progress is read, `/api/v1/upgrade`.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpgradeProgress'
        '400':
          description: |
            The body is not an upgrade request, or its version is not a version (`code` is `InvalidArgument`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: |
            The request has no credential that checks out, or the session was ended - by too many wrong
            passwords among them (`code` is `Unauthenticated`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: |
            The caller is not allowed `admin:UpgradeCluster`, is an API key, or typed a password that was not
            accepted (`code` is `AccessDenied`). The refusal is written to the audit trail.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: |
            An upgrade is running already (`code` is `UpgradeRunning`); the version may not be installed from
            the running one, or was not found when the node last checked (`UpgradeNotAllowed`); or checking
            for updates is off (`UpdatesOff`). Nothing was installed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '412':
          description: |
            The release's signed list, or the artifact it names, did not verify (`code` is
            `ReleaseNotVerified`). Nothing of it was installed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '423':
          description: The session is locked (`code` is `SessionLocked`); a locked session installs nothing.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: |
            Too many attempts from the caller's address (`code` is `TooManyAttempts`). The password was not
            judged; nothing was started.
          headers:
            Retry-After:
              description: After how many seconds to send the request again.
              schema:
                type: integer
                minimum: 1
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '501':
          description: |
            This deployment cannot be upgraded from the console: `upgrade-mode` is `off`, or what the mode
            needs is not there (`code` is `UpgradeUnavailable`). `GET /updates` says why, and what an operator
            does instead.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'
    get:
      operationId: getUpgrade
      tags: [updates]
      summary: How far the latest upgrade has come
      description: |
        Where the latest upgrade stands, and each node with the build it runs. It is read from where the
        upgrade happens - the process itself for a binary, the StatefulSets, the pods and each node's build
        for Kubernetes - not from anything kept: `idle` when none was started since the answering node
        started. Nothing is asked of any server outside the deployment to answer it. The console polls it
        through the answering node's restart.

        **Who may.** The caller needs `admin:GetUpdates` (`cluster-admin`, `auditor`).
      x-cactusfs-action: admin:GetUpdates
      responses:
        '200':
          description: The progress of the latest upgrade.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpgradeProgress'
        default:
          $ref: '#/components/responses/Problem'
  /targets:
    get:
      operationId: listTargets
      tags: [targets]
      summary: List the targets
      description: |
        Every place outside the deployment that it sends to: webhooks and NATS JetStream servers for
        notifications and for the audit trail, and other deployments for replication. In name order, without
        any credential.
      x-cactusfs-action: admin:ListTargets
      responses:
        '200':
          description: The targets.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Target'
        default:
          $ref: '#/components/responses/Problem'
  /targets/{name}:
    get:
      operationId: getTarget
      tags: [targets]
      summary: Get a target
      x-cactusfs-action: admin:GetTarget
      parameters:
        - $ref: '#/components/parameters/TargetName'
      responses:
        '200':
          description: The target, without any credential and without the path of its endpoint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Target'
        default:
          $ref: '#/components/responses/Problem'
    put:
      operationId: putTarget
      tags: [targets]
      summary: Define a target, or change it
      description: |
        A target is the only way an address outside the deployment is named: the rules of a bucket name a
        target, never an address. So whoever may define targets decides where the deployment connects to, and
        `buckets` decides which buckets may use each.

        **The endpoint** is refused with 400 unless it is `https://` for the kinds `webhook` and `s3`, or
        `tls://` for `nats`; it may carry no userinfo, no query
        and no fragment. Where it leads is checked again each time a connection is made: an address that is
        loopback, link-local, unspecified or multicast is refused unless the nodes were started with a range
        that admits it (`--egress-allow`), and the addresses of cloud metadata services are refused whatever
        was admitted. No redirect is followed, no proxy is used, and the certificate is verified against
        `ca_pem` or the system's roots: there is no way to turn that off.

        **The path of the endpoint is write-only.** The URL of a webhook often carries a token in its path,
        so no answer of this API gives the path back - not to whoever defined the target either: a target is
        shown with the scheme, the host and the port of its endpoint, and with `endpoint_path_set`. The whole
        URL is sent here. Changing a target without `endpoint` keeps the endpoint it has, path and all; to
        change any part of the endpoint - the host, the port or the path - the whole URL is sent again. A
        target that is new needs one (400 without).

        **Secrets are write-only.** `auth.secret` is sealed through the key service and is in no answer of
        this API, in no log line, audit record or event. Changing a target without `auth.secret` keeps the
        one it has, as long as `auth.mode` stays what it was. A target of kind `webhook` is given a signing
        key, made here and returned once, in the answer to the request that made it or that asked for a new
        one with `rotate_signing_key`. A request that defines a target and is answered 503 may have defined it
        all the same, with a signing key nobody was shown: repeat it with the same `Idempotency-Key`, and when
        the target turns out to exist without the key having been shown, obtain one with `rotate_signing_key`.

        The kind of a target cannot be changed (409); delete it and define it again. Nothing is connected to
        by this request: whether the target can be reached is told by its status.

        Answers 503 until every member of the metadata group is of a release that knows targets.
      x-cactusfs-action: admin:PutTarget
      parameters:
        - $ref: '#/components/parameters/TargetName'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TargetPut'
      responses:
        '200':
          description: Defined or changed. A signing key that was made is in this response and nowhere else, ever.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TargetPutResult'
        '429':
          description: |
            A request with `Idempotency-Key` whose body may hold a secret is recognised again by a slow hash of
            the body, of which a node computes few at a time and one at a time for a caller; none could be
            computed at once (`code` is `TooManyRequests`). Nothing was reserved or changed; the same request,
            with the same key, can be sent again.
          headers:
            Retry-After:
              description: After how many seconds to send the request again.
              schema:
                type: integer
                minimum: 1
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteTarget
      tags: [targets]
      summary: Delete a target
      description: |
        Refused with 409 (`code` `EntityInUse`) while a bucket's notification rules or replication
        configuration name it. What was waiting to be sent to it is not sent.
      x-cactusfs-action: admin:DeleteTarget
      parameters:
        - $ref: '#/components/parameters/TargetName'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204':
          description: Deleted.
        default:
          $ref: '#/components/responses/Problem'
  /targets/{name}/status:
    get:
      operationId: getTargetStatus
      tags: [targets]
      summary: Whether a target is being delivered to
      description: |
        What the node that leads the metadata group, which does the delivering, knows of the target: any node
        answers, and asks the leader. The figures are the leader's own and begin again when another node
        comes to lead. Nothing of the endpoint and none of the words of an error are part of it - a failure is named by
        its class, and the cause is in the leader's log. 503 when there is no leader to ask.
      x-cactusfs-action: admin:GetTargetStatus
      parameters:
        - $ref: '#/components/parameters/TargetName'
      responses:
        '200':
          description: The state of delivery to the target.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TargetStatus'
        default:
          $ref: '#/components/responses/Problem'
  /audit:
    get:
      operationId: listAudit
      tags: [audit]
      summary: Read the audit trail
      x-cactusfs-action: admin:GetAuditLog
      parameters:
        - name: after
          in: query
          description: Return records with a sequence number greater than this.
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
      responses:
        '200':
          description: Records in the order they were written. The chain of hashes is verified before they are returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditPage'
        default:
          $ref: '#/components/responses/Problem'
  /openapi.json:
    get:
      operationId: getOpenAPIJSON
      tags: [meta]
      summary: This document as JSON
      security: []
      responses:
        '200':
          description: The OpenAPI document.
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: '#/components/responses/Problem'
  /openapi.yaml:
    get:
      operationId: getOpenAPIYAML
      tags: [meta]
      summary: This document as YAML
      security: []
      responses:
        '200':
          description: The OpenAPI document.
          content:
            application/yaml:
              schema:
                type: string
        default:
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: An API key, as `<access key ID>:<secret key>`.
    session:
      type: apiKey
      in: cookie
      name: __Host-cactusfs-session
      description: The cookie that signing in sets. Requests that change something also need `X-CSRF-Token`.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: Makes the request safe to repeat. Any string of 1 to 128 printable ASCII characters, unique per request.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[\x21-\x7E]+$'
    CSRFToken:
      name: X-CSRF-Token
      in: header
      description: The CSRF token of the session. Required when the request is made with a session; ignored with an API key.
      schema:
        type: string
        maxLength: 128
    BucketName:
      name: bucket
      in: path
      required: true
      schema:
        type: string
        minLength: 3
        maxLength: 63
    ObjectKey:
      name: key
      in: query
      required: true
      description: The key of the object.
      schema:
        type: string
        minLength: 1
        maxLength: 1024
    SubBucketName:
      name: name
      in: path
      required: true
      description: The name of the sub-bucket.
      schema:
        $ref: '#/components/schemas/SubBucketNameValue'
    EntityName:
      name: name
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Name'
    TaggedVersion:
      name: version_id
      in: query
      description: The version whose tags are meant - `null`, or the ID of a version. Without it, the current version.
      schema:
        type: string
        pattern: '^(null|[0-9a-f]{32})$'
    TagDefinitionKeyParam:
      name: key
      in: path
      required: true
      description: The key the definition is of, in lower case.
      schema:
        $ref: '#/components/schemas/TagDefinitionKey'
    TargetName:
      name: name
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/TargetNameValue'
  responses:
    Problem:
      description: The request was not carried out.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Name:
      type: string
      description: The name of a user, group, role or policy.
      minLength: 1
      maxLength: 64
      pattern: '^[A-Za-z0-9][A-Za-z0-9+=,.@_-]*$'
    Problem:
      type: object
      description: Problem details (RFC 9457).
      required: [type, title, status, code]
      properties:
        type:
          type: string
          description: A URI reference that identifies the kind of problem.
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          description: A stable name for the kind of problem, for programs.
        request_id:
          type: string
    PreviewKind:
      type: string
      description: |
        What an object is shown as by the console (`X-CactusFS-Preview-Kind`). Values are only ever added to.
      enum: [png, jpeg, gif, webp, pdf, docx, xlsx, text, csv, json]
    SignInRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 1024
    UnlockRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          format: password
          description: The password of the user the session belongs to.
          minLength: 1
          maxLength: 1024
    ServerVersion:
      type: object
      description: |
        Which build of CactusFS answered. It is told to a caller who has proved who they are, and to nobody
        else: no answer to a request without a credential names it, and no response header does.
      required: [version, build]
      properties:
        version:
          type: string
          description: The release, a semantic version without a leading "v".
        build:
          type: string
          description: |
            The number of the build: the count of commits it was made from. "0" is a build that was not numbered -
            one made with plain `go build`, say.
        commit:
          type: string
          description: |
            The short hash of the commit the build was made from, followed by "-dirty" when the tree had
            uncommitted changes. Absent when the build does not know it.
    Session:
      type: object
      required: [user, csrf_token, expires_at, server]
      properties:
        user:
          type: string
        csrf_token:
          type: string
          description: Send it back in `X-CSRF-Token` with every request that changes something.
        expires_at:
          type: string
          format: date-time
          description: When the session reaches its timeout.
        server:
          $ref: '#/components/schemas/ServerVersion'
    Identity:
      type: object
      required: [kind, via, server]
      properties:
        server:
          $ref: '#/components/schemas/ServerVersion'
        kind:
          type: string
          enum: [root, user]
        via:
          type: string
          enum: [api_key, session]
        user:
          type: string
        access_key_id:
          type: string
        locked:
          type: boolean
          description: |
            Only with `via: session`. True when the session has reached its timeout and is kept because its
            user is uploading objects: it may store objects, ask this, unlock and sign out, and nothing else.
        expires_at:
          type: string
          format: date-time
          description: |
            Only with `via: session`. When the session reaches - or, if it is locked, reached - its timeout.
        lock_ends_at:
          type: string
          format: date-time
          description: |
            Only with `via: session`, and only where sessions can lock. The latest moment the session can stay
            locked to: it has ended by then whatever is being uploaded. A locked session usually ends
            earlier, a moment after its last upload.
        csrf_token:
          type: string
          description: |
            Only with `via: session`. The CSRF token of the session the cookie of this request stands for -
            the one signing in and unlocking returned - to send in `X-CSRF-Token`. Every tab of a browser
            shares the cookie: a tab keeps the token it is given here, and asks again when a change is
            answered `CSRFTokenInvalid`. Left out for a session begun by a node of an earlier release,
            whose token only the tab that signed in knows.
    Bucket:
      type: object
      required: [name, created_at]
      properties:
        name:
          type: string
        created_at:
          type: string
          format: date-time
        details:
          $ref: '#/components/schemas/BucketDetails'
    BucketDetails:
      type: object
      description: |
        What the list of buckets says of one bucket beyond its name, when it was asked for with
        `details=true`: every bucket of such a list has it, and no bucket of any other answer. Each part
        is given as far as the caller may see it of this bucket; a part that is left out was not refused
        and is not audited.
      required: [access_included, policy_included]
      properties:
        access_included:
          type: boolean
          description: |
            True when the caller holds `admin:GetObjectAccess` on the bucket itself and this node keeps
            the record: `activity` is then given, and `created_by` when it was recorded. False otherwise -
            also for a caller who holds the action on objects of the bucket and not on the bucket - and
            then neither is given. True says nothing of any one object: the rows of `activity` are
            decided object by object, and may be none.
        created_by:
          type: string
          description: |
            Who created the bucket, as the audit trail names actors. Absent when it was not recorded -
            the bucket is older than the record - and when `access_included` is false.
        activity:
          $ref: '#/components/schemas/BucketActivity'
        policy_included:
          type: boolean
          description: |
            True when the caller holds `s3:GetBucketPolicy` on the bucket: `policy` then says what the
            bucket's policy is, and is absent when the bucket has none. False otherwise - not permitted,
            or the stored policy of the bucket cannot be read - and then `policy` is absent and says
            nothing of whether there is one.
        policy:
          $ref: '#/components/schemas/BucketPolicySummary'
    BucketActivity:
      type: object
      description: |
        The latest uploads into and downloads from a bucket, newest first, at most three of each. Kept as
        well as can be without making a request wait for it: not an audit trail. An upload has one row a
        key; a download one row for a key, a reader and whether the reader came with a presigned URL.
        The rows outlive the objects they name. A row of an object the caller does not hold
        `admin:GetObjectAccess` on is left out, as `GET /buckets/{bucket}/object/access` would refuse it:
        there may be fewer rows than are kept, or both arrays may be empty, and nothing says how many
        were left out. No older row takes the place of one that is left out.
      required: [uploads, downloads]
      properties:
        uploads:
          type: array
          maxItems: 3
          items:
            $ref: '#/components/schemas/BucketActivityEntry'
        downloads:
          type: array
          maxItems: 3
          items:
            $ref: '#/components/schemas/BucketActivityEntry'
    BucketActivityEntry:
      type: object
      required: [at, by]
      properties:
        at:
          type: string
          format: date-time
          description: |
            When the version was committed, for an upload; for a download, when the node that served it
            handed its count over, which is up to a flush interval after the bytes left.
        by:
          type: string
          description: |
            Who uploaded or downloaded, as the audit trail names actors, or `anonymous`. Empty for an
            upload whose uploader was not recorded; never empty for a download.
        key:
          type: string
          description: |
            The key of the object, which may have been deleted since. Absent when the caller does not
            hold `s3:ListBucket` on the bucket.
        presigned:
          type: boolean
          description: |
            Present and true for a download made with a URL that `by` signed: whoever held the URL made
            it, not necessarily the signer.
    BucketPolicySummary:
      type: object
      description: What a bucket's policy is, without what it says.
      required: [statements, open_to_anyone]
      properties:
        statements:
          type: integer
          minimum: 0
          description: How many statements the policy has.
        open_to_anyone:
          type: boolean
          description: |
            True when some statement of the policy allows something to every caller: an `Allow` whose
            principal is `*`. It classifies the document and decides nothing - conditions and `Deny`
            statements are not weighed, and it does not say that callers who have not authenticated are
            let in: a statement that allows every caller `s3:PutObject` sets it, and nobody writes
            without authenticating.
    BucketPolicy:
      type: object
      description: The policy of a bucket. `document` is absent when the bucket has none.
      properties:
        document:
          $ref: '#/components/schemas/PolicyDocument'
    BucketPolicyPut:
      type: object
      required: [document]
      properties:
        document:
          $ref: '#/components/schemas/PolicyDocument'
    SubBucketNameValue:
      type: string
      description: |
        The name of a sub-bucket: 1 to 63 lower-case letters, digits and hyphens, beginning and ending with a
        letter or digit. The first segment of the keys that belong to it.
      minLength: 1
      maxLength: 63
      pattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?$'
    SubBucketSummary:
      type: object
      description: A sub-bucket of a bucket, without its policy.
      required: [name, created_at]
      properties:
        name:
          $ref: '#/components/schemas/SubBucketNameValue'
        created_at:
          type: string
          format: date-time
    SubBucket:
      type: object
      description: A sub-bucket of a bucket and its policy. `policy` is absent when it has none of its own.
      required: [name, created_at]
      properties:
        name:
          $ref: '#/components/schemas/SubBucketNameValue'
        created_at:
          type: string
          format: date-time
          description: When the sub-bucket was registered; setting its policy does not change it.
        policy:
          $ref: '#/components/schemas/PolicyDocument'
    SubBucketPut:
      type: object
      description: |
        What a sub-bucket is to be. `policy` absent is a sub-bucket without a policy of its own.
      properties:
        policy:
          $ref: '#/components/schemas/PolicyDocument'
    TagKey:
      type: string
      description: |
        The key of a tag: 1 to 128 characters - letters, digits, spaces and `+ - = . _ : / @`.
      minLength: 1
      maxLength: 128
    TagValue:
      type: string
      description: The value of a tag - at most 256 characters, of those a key may have.
      maxLength: 256
    Tag:
      type: object
      description: A tag, as S3 has them on buckets and on versions of objects.
      required: [key, value]
      properties:
        key:
          $ref: '#/components/schemas/TagKey'
        value:
          $ref: '#/components/schemas/TagValue'
    BucketTags:
      type: object
      description: The tags of a bucket, in key order.
      required: [tags]
      properties:
        tags:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/Tag'
    BucketTagsPut:
      type: object
      description: |
        What the tags of a bucket are to be. A list, not a map, so that a key given twice is seen and refused.
      required: [tags]
      properties:
        tags:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/Tag'
    ObjectTags:
      type: object
      description: The tags of a version of an object, in key order.
      required: [version_id, tags]
      properties:
        version_id:
          type: string
          description: The version whose tags these are - `null`, or the ID of a version.
        tags:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/Tag'
    ObjectTagsPut:
      type: object
      description: |
        What the tags of a version are to be. A list, not a map, so that a key given twice is seen and refused.
      required: [tags]
      properties:
        tags:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/Tag'
    RequiredTag:
      type: object
      description: A tag every object of the bucket - or of one of its sub-buckets - must carry.
      required: [key]
      properties:
        key:
          $ref: '#/components/schemas/TagKey'
        values:
          type: array
          description: |
            The only values the tag may have, each given once and each a value a tag can have. Absent or empty,
            any value. The key and the values are compared as they are written - in lower case when the rules
            lower-case tags, and then they must be written so.
          maxItems: 50
          items:
            $ref: '#/components/schemas/TagValue'
        sub_bucket:
          $ref: '#/components/schemas/SubBucketNameValue'
    TagRules:
      type: object
      description: The rules for the tags of a bucket's objects (ADR-0018).
      required: [lowercase, catalogue_only, required]
      properties:
        lowercase:
          type: boolean
          description: Whether keys and values are kept in lower case, whatever case they are sent in.
        catalogue_only:
          type: boolean
          description: Whether an object may carry only tags the catalogue defines, with values it allows.
        required:
          type: array
          description: The tags every object must carry, in the order they were given.
          maxItems: 10
          items:
            $ref: '#/components/schemas/RequiredTag'
    TagRulesPut:
      type: object
      description: |
        What the tag rules of a bucket are to be. Every field is given: a PUT replaces the rules whole, and a
        field left out would otherwise switch a rule off.
      required: [lowercase, catalogue_only, required]
      properties:
        lowercase:
          type: boolean
        catalogue_only:
          type: boolean
        required:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/RequiredTag'
    TagDefinitionKey:
      type: string
      description: |
        The key a definition of the catalogue is of: a key a tag can have (`TagKey`: letters, digits, spaces
        and `+ - = . _ : / @`), in lower case, of 1 to 128 characters and at most 128 bytes in UTF-8.
      minLength: 1
      maxLength: 128
    TagDefinitionValue:
      type: string
      description: |
        A value a definition allows: a value a tag can have (`TagValue`: letters, digits, spaces and
        `+ - = . _ : / @`), in lower case, of at most 256 bytes in UTF-8.
      maxLength: 256
    TagDefinition:
      type: object
      description: A tag the deployment defines for its users to pick (ADR-0018). Always in lower case.
      required: [key, description, values, created_at]
      properties:
        key:
          $ref: '#/components/schemas/TagDefinitionKey'
        description:
          type: string
          description: What the tag is for.
          maxLength: 256
        values:
          type: array
          description: The only values the tag may have, in the order they were given. Empty, any value.
          maxItems: 50
          items:
            $ref: '#/components/schemas/TagDefinitionValue'
        created_at:
          type: string
          format: date-time
          description: When the tag was first defined; changing the definition does not change it.
    TagDefinitionCreate:
      type: object
      description: A new definition. Without `values` the tag may have any value.
      required: [key]
      properties:
        key:
          $ref: '#/components/schemas/TagDefinitionKey'
        description:
          type: string
          maxLength: 256
        values:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/TagDefinitionValue'
    TagDefinitionPut:
      type: object
      description: |
        What a definition is to be. Both fields are given: a PUT replaces the definition whole, and `values`
        left out would otherwise let the tag have any value.
      required: [description, values]
      properties:
        description:
          type: string
          maxLength: 256
        values:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/TagDefinitionValue'
    BucketCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 63
    ObjectSummary:
      type: object
      required: [key, size, etag, last_modified]
      properties:
        key:
          type: string
        size:
          type: integer
          format: int64
        etag:
          type: string
        last_modified:
          type: string
          format: date-time
        access:
          $ref: '#/components/schemas/ObjectAccessSummary'
    ObjectAccessSummary:
      type: object
      description: |
        Who uploaded the current version of an object and how often it was read, as a listing carries it:
        the figures of `ObjectAccess` without the readers. Best-effort counts, not an audit trail. Present
        on an object only in a listing that was asked for with `access=true`, and only where the caller
        holds `admin:GetObjectAccess` on the object.
      required: [uploaded_at, download_count, copy_count]
      properties:
        uploaded_by:
          type: string
          description: Who uploaded the version, as the audit trail names actors. Absent when it was not recorded.
        uploaded_at:
          type: string
          format: date-time
        download_count:
          type: integer
          format: int64
          minimum: 0
          description: Downloads of the version, every ranged request counted by itself.
        copy_count:
          type: integer
          format: int64
          minimum: 0
          description: How often the version was the source of a copy.
        last_downloaded_at:
          type: string
          format: date-time
          description: When the last download or copy was recorded. Absent when there was none.
    BucketUsage:
      type: object
      required: [object_count, total_size, complete, exact]
      properties:
        object_count:
          type: integer
          format: int64
          minimum: 0
          description: Objects in the bucket (current versions; delete markers are not objects).
        total_size:
          type: integer
          format: int64
          minimum: 0
          description: Their sizes added up, in bytes.
        complete:
          type: boolean
          description: False when the bucket has more objects than are counted in one request. Never false when `exact` is true.
        exact:
          type: boolean
          description: |
            True when the figures are the count the metadata store keeps of the bucket, which every change
            of the bucket keeps right. False when they were counted for this request, as far as one request
            counts: `versions`, `stored_bytes` and `upload_bytes` are then absent.
        versions:
          type: integer
          format: int64
          minimum: 0
          description: Versions the bucket keeps, current or not, delete markers among them. Present when `exact` is true.
        stored_bytes:
          type: integer
          format: int64
          minimum: 0
          description: |
            The sizes of all those versions added up, in bytes - of the objects as they were sent, not of
            what they take on the drives, which is more by the parity. Present when `exact` is true.
        upload_bytes:
          type: integer
          format: int64
          minimum: 0
          description: |
            The sizes of the parts of multipart uploads that are neither completed nor aborted. Present when
            `exact` is true.
        quota_bytes:
          type: integer
          format: int64
          minimum: 1
          description: |
            The bucket's quota: the most `stored_bytes` and `upload_bytes` together may come to. Absent when
            the bucket has none. Who may read the usage is told the quota; changing it needs
            `admin:PutBucketQuota`.
    BucketQuota:
      type: object
      description: The quota of a bucket and what counts against it.
      required: [used_bytes, exact]
      properties:
        quota_bytes:
          type: integer
          format: int64
          minimum: 1
          description: The most bytes the bucket may hold. Absent when the bucket has no quota.
        used_bytes:
          type: integer
          format: int64
          minimum: 0
          description: |
            What counts against the quota: `stored_bytes` and `upload_bytes` of the bucket's usage, added. 0
            while `exact` is false: it is not known yet.
        exact:
          type: boolean
          description: |
            Whether the bucket's usage is counted. False while a bucket that is older than the count is
            being counted for the first time; a quota cannot be set until then.
    BucketQuotaPut:
      type: object
      required: [quota_bytes]
      properties:
        quota_bytes:
          type: integer
          format: int64
          minimum: 1
          description: |
            The most bytes the bucket may hold, from 1 to 2^62 (4 611 686 018 427 387 904); more is refused
            with 400. The bound is said here and not as `maximum`: it is beyond what JSON numbers hold exactly
            in every reader of this document.
    NotificationRule:
      type: object
      description: |
        One rule of a bucket's notifications: which changes, of which keys, are told to which target.
      required: [id, target, events, as]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 255
          description: The name of the rule, unique in the bucket - the `Id` of the configuration in the S3 API.
        target:
          $ref: '#/components/schemas/TargetNameValue'
        events:
          type: array
          minItems: 1
          maxItems: 4
          uniqueItems: true
          description: |
            The kinds of change the rule is for: `put` (an object was put, or copied here - S3's
            `s3:ObjectCreated:Put`), `complete` (a multipart upload was completed -
            `s3:ObjectCreated:CompleteMultipartUpload`), `marker` (an object was deleted where versions are
            kept, which leaves a delete marker - `s3:ObjectRemoved:DeleteMarkerCreated`) and `delete` (a
            version was removed for good - `s3:ObjectRemoved:Delete`).
          items:
            type: string
            enum: [put, complete, marker, delete]
        prefix:
          type: string
          maxLength: 1024
          description: Only keys that begin with this, byte for byte. Absent or empty for every key.
        suffix:
          type: string
          maxLength: 1024
          description: Only keys that end with this, byte for byte. Absent or empty for every key.
        as:
          type: string
          enum: [queue, topic]
          description: |
            Whether the S3 API shows the rule as a `QueueConfiguration` or as a `TopicConfiguration`. It
            changes nothing of what is delivered.
    NotificationRulePut:
      type: object
      required: [id, target, events]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 255
        target:
          $ref: '#/components/schemas/TargetNameValue'
        events:
          type: array
          minItems: 1
          maxItems: 4
          uniqueItems: true
          items:
            type: string
            enum: [put, complete, marker, delete]
        prefix:
          type: string
          maxLength: 1024
        suffix:
          type: string
          maxLength: 1024
        as:
          type: string
          enum: [queue, topic]
          default: queue
    BucketNotifications:
      type: object
      description: The notification rules of a bucket. No rules is no configuration.
      required: [rules]
      properties:
        rules:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/NotificationRule'
    BucketNotificationsPut:
      type: object
      required: [rules]
      properties:
        rules:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/NotificationRulePut'
    ReplicationRule:
      type: object
      description: One rule of a bucket's replication - which keys are copied, and whether their delete markers are.
      required: [id, enabled, priority, delete_markers]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 255
          description: The name of the rule, unique in the bucket.
        enabled:
          type: boolean
          description: False for a rule that is kept and matches nothing (S3's `Status` `Disabled`).
        priority:
          type: integer
          minimum: 0
          maximum: 2147483647
          description: Of the rules that match a key, the one with the greatest priority decides.
        prefix:
          type: string
          maxLength: 1024
          description: Only keys that begin with this, byte for byte. Absent or empty for every key.
        delete_markers:
          type: boolean
          description: |
            Whether a delete marker made by a caller is copied too. A marker made by a lifecycle rule never
            is; neither is the removal of a version for good.
    BucketReplication:
      type: object
      description: Where the versions of a bucket are copied to. One target and one bucket there.
      required: [target, destination_bucket, rules]
      properties:
        target:
          $ref: '#/components/schemas/TargetNameValue'
        destination_bucket:
          type: string
          minLength: 3
          maxLength: 63
          description: The bucket of the other deployment, which must be a replica of this one.
        rules:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/ReplicationRule'
    BucketReplicationPut:
      type: object
      required: [target, destination_bucket, rules]
      properties:
        target:
          $ref: '#/components/schemas/TargetNameValue'
        destination_bucket:
          type: string
          minLength: 3
          maxLength: 63
        rules:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/ReplicationRule'
    ReplicationResync:
      type: object
      description: |
        The walk that sends another deployment what it lacks of a bucket. Kept in the metadata, so it is the
        same whichever node answers.
      required: [state, scanned, sent]
      properties:
        state:
          type: string
          description: |
            `running` while the walk goes on - also while it waits for a target that cannot be reached -
            and `done` once it has been through every version. A newer release may add to the list.
        scanned:
          type: integer
          format: int64
          minimum: 0
          description: Versions looked at so far.
        sent:
          type: integer
          format: int64
          minimum: 0
          description: Versions the other deployment did not have and was sent.
    BucketReplicationStatus:
      type: object
      description: |
        How far the replication of a bucket has come. `pending` and `failed` are of this bucket and exact:
        they are counted in the bucket's usage record, in the metadata, and are the same whichever node
        leads. `target_state`, `last_error_class`, `oldest_pending_at` and `lost` are of the bucket's
        target, which other buckets may use too; the first three are what the node that leads the metadata
        group has in memory, and begin again when another node comes to lead.
      required: [target, target_state, pending, failed, lost, resync_needed]
      properties:
        target:
          $ref: '#/components/schemas/TargetNameValue'
        target_state:
          type: string
          description: |
            `ok` when the last attempt succeeded or nothing waits; `retrying` after a failure that is
            tried again; `stalled` when the other deployment refuses everything - the credential, the
            bucket, its versioning, its replica mode or its quota - and somebody has to act. A newer release
            may add to the list.
        last_error_class:
          type: string
          description: |
            The class of the last failure - never its words, and never the endpoint. Among them `auth`,
            `no_such_bucket`, `versioning`, `not_replica`, `quota`, `timeout`, `connect`, `tls`, `redirect`,
            `egress_refused`, `rejected`, `server`. `auth` is a credential the other deployment does not take
            (a 401 or a 403): it is tried again and stalls the target. `rejected` is a refusal of one request
            that says nothing of the others - a 4xx other than 401, 403, 408 and 429. The list is not closed.
            Absent when the last attempt succeeded.
        pending:
          type: integer
          format: int64
          minimum: 0
          description: |
            The versions of this bucket that are still to be replicated: those that say `PENDING` in
            `x-amz-replication-status`. Exact, from the bucket's usage record. While the usage of the bucket
            is being counted for the first time it is 0 and says nothing yet (`exact` of the bucket's usage
            is then false).
        oldest_pending_at:
          type: string
          format: date-time
          description: |
            When the oldest change that waits for the bucket's target was made - of any bucket that uses
            the target. Absent when nothing waits.
        failed:
          type: integer
          format: int64
          minimum: 0
          description: |
            The versions of this bucket that cannot be replicated and were given up on - a version encrypted
            with a key of the customer's, or one the other deployment refuses for itself: those that say
            `FAILED` in `x-amz-replication-status`. Exact, from the bucket's usage record; it does not begin
            again when another node comes to lead, and falls only when such a version is removed or a resync
            replicates it.
        lost:
          type: integer
          format: int64
          minimum: 0
          description: |
            Changes that were dropped before they were sent, because the target could not be reached while
            more changes waited than the deployment keeps. Kept in the metadata; it does not begin again.
        resync_needed:
          type: boolean
          description: True when changes were lost - the other deployment lacks versions until a resync has been through.
        resync:
          $ref: '#/components/schemas/ReplicationResync'
    BucketReplicaMode:
      type: object
      required: [replica]
      properties:
        replica:
          type: boolean
          description: Whether the bucket takes new versions from another deployment only.
        source:
          type: string
          description: The ID of that deployment. Absent when the bucket is no replica.
    BucketReplicaModePut:
      type: object
      required: [source]
      properties:
        source:
          type: string
          maxLength: 64
          pattern: '^[A-Za-z0-9-]*$'
          description: |
            The deployment ID of the source, as `GET /cluster` of the source gives it. Empty to promote the
            bucket.
    TargetNameValue:
      type: string
      description: The name of a target. Lower-case letters, digits and hyphens; it is part of the ARNs the S3 API uses.
      minLength: 1
      maxLength: 63
      pattern: '^[a-z0-9][a-z0-9-]*$'
    TargetAuth:
      type: object
      description: How the deployment proves who it is to a target. Never the secret itself.
      required: [mode]
      properties:
        mode:
          type: string
          enum: [none, bearer, basic, token, sigv4]
          description: |
            `none`; `bearer` (webhook: the secret is sent as `Authorization: Bearer`); `basic` (nats: `id`
            is the user and the secret the password); `token` (nats: the secret is the token); `sigv4` (s3:
            `id` is the access key ID and the secret its secret key).
        id:
          type: string
          maxLength: 128
          description: The user name or the access key ID, for the modes that have one. Not a secret.
    TargetAuthPut:
      type: object
      required: [mode]
      properties:
        mode:
          type: string
          enum: [none, bearer, basic, token, sigv4]
        id:
          type: string
          maxLength: 128
        secret:
          type: string
          format: password
          writeOnly: true
          minLength: 1
          maxLength: 4096
          description: |
            The bearer token, the password, the token or the secret key. Written, never read. Without it a
            change keeps the secret the target has; a change of `mode` needs it again, and the mode `none`
            removes it.
    Target:
      type: object
      description: |
        A place outside the deployment that it sends to, as it may be shown - with no credential, and
        without the path of its endpoint, which may be one.
      required: [name, kind, endpoint, endpoint_path_set, buckets, audit, auth, secret_set, signing_key_set, references, created_at, updated_at]
      properties:
        name:
          $ref: '#/components/schemas/TargetNameValue'
        kind:
          type: string
          enum: [webhook, nats, s3]
          description: |
            `webhook`: an HTTPS endpoint that is posted to. `nats`: a NATS server with JetStream. `s3`:
            another CactusFS deployment, for replication.
        endpoint:
          type: string
          description: |
            Where it is: **the origin only** - the scheme, the host, and the port when the endpoint names
            one - as in `https://hooks.example.com:8443`. The path is never part of it, for any caller: the
            URL of a webhook may carry a token in its path.
        endpoint_path_set:
          type: boolean
          description: |
            Whether the endpoint has a path (anything after the host and the port but a single `/`). It is
            all that is told of the path.
        region:
          type: string
          description: Kind `s3`. The region requests are signed for.
        subject:
          type: string
          description: Kind `nats`. The subject every message is published to. The stream that takes it is the operator's.
        ca_pem:
          type: string
          description: |
            The certificates the target's own must chain to, in PEM. Absent when the system's roots are used.
            Certificates are public; no key is ever part of a target.
        buckets:
          type: array
          description: |
            The buckets whose rules may name the target: names, or patterns with `*`. Empty: none may - a
            target that only exports the audit trail.
          items:
            type: string
        audit:
          type: boolean
          description: Whether every record of the audit trail is sent to the target as well.
        auth:
          $ref: '#/components/schemas/TargetAuth'
        secret_set:
          type: boolean
          description: Whether the target has a secret. It is all that is told of it.
        signing_key_set:
          type: boolean
          description: Whether the target has a key that requests to it are signed with. Kind `webhook` only.
        references:
          type: integer
          minimum: 0
          description: How many bucket configurations name the target. It cannot be deleted while there are any.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    TargetPut:
      type: object
      required: [kind, buckets]
      properties:
        kind:
          type: string
          enum: [webhook, nats, s3]
        endpoint:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 2048
          description: |
            The whole URL, with its path: `https://` for the kinds `webhook` and `s3`, `tls://` for `nats`,
            without userinfo, query or fragment. Written, never read back whole - an answer holds its
            scheme, host and port only. Required for a target that is new. Without it a change keeps the
            endpoint the target has, path and all; to change any part of it, send the whole URL again.
        region:
          type: string
          maxLength: 64
        subject:
          type: string
          maxLength: 255
        ca_pem:
          type: string
          maxLength: 65536
        buckets:
          type: array
          maxItems: 1000
          description: |
            The buckets whose rules may name the target: names, or patterns with `*`. It must be said; `["*"]`
            is every bucket, and an empty list none.
          items:
            type: string
            minLength: 1
            maxLength: 63
        audit:
          type: boolean
          default: false
        auth:
          $ref: '#/components/schemas/TargetAuthPut'
        rotate_signing_key:
          type: boolean
          default: false
          description: |
            Kind `webhook`. Makes a new signing key in place of the one the target has, and returns it once.
            The old one stops being used with the next request that is sent.
    TargetPutResult:
      type: object
      required: [target]
      properties:
        target:
          $ref: '#/components/schemas/Target'
        signing_key:
          type: string
          format: password
          description: |
            The key requests to a webhook are signed with, when this request made one: the target is new, or
            a new key was asked for. Shown once. It cannot be had again - only replaced.
    TargetStatus:
      type: object
      description: |
        Delivery to one target, as the node that leads the metadata group has it in memory. A node of an
        older release that leads cannot be asked: `state` is then `unsupported` and the figures are 0.
      required: [name, state, pending, lost, rejected]
      properties:
        name:
          $ref: '#/components/schemas/TargetNameValue'
        state:
          type: string
          description: |
            `ok` when the last attempt succeeded or nothing waits; `retrying` after a failure that is tried
            again, with a growing pause; `stalled` when the target refuses everything and somebody has to
            act; `unsupported` when the leader is of a release that cannot say. A newer release may add to
            the list.
        pending:
          type: integer
          format: int64
          minimum: 0
          description: Messages matched for the target and not yet acknowledged by it.
        oldest_pending_at:
          type: string
          format: date-time
          description: When the oldest of them was made. Absent when nothing waits.
        last_success_at:
          type: string
          format: date-time
          description: When the leader last delivered something. Absent when it has not since it came to lead.
        last_error_class:
          type: string
          description: |
            The class of the last failure - never its words, and never the endpoint. Among them `timeout`,
            `connect`, `tls`, `redirect`, `egress_refused`, `auth`, `rejected`, `server`, `no_stream`.
            `auth` is a credential the target does not take - a 401 or a 403 from a webhook, a NATS server
            that refuses the token: it is tried again, nothing is passed, and the target is `stalled`.
            `rejected` is a refusal of one message. The list is not closed. Absent when the last attempt
            succeeded.
        lost:
          type: integer
          format: int64
          minimum: 0
          description: |
            Messages that were dropped before they were sent, because the target could not be reached while
            more waited than the deployment keeps. Kept in the metadata; it does not begin again.
        rejected:
          type: integer
          format: int64
          minimum: 0
          description: |
            Messages the target answered with a refusal of that one message - a 4xx other than 401, 403, 408
            and 429 - since the leader came to lead. They are not sent again. A 401 and a 403 are not counted
            here: they are of the credential, class `auth`, and are tried again.
    ObjectList:
      type: object
      required: [objects, common_prefixes, truncated, access_included]
      properties:
        objects:
          type: array
          items:
            $ref: '#/components/schemas/ObjectSummary'
        access_included:
          type: boolean
          description: |
            True only when the listing was asked for with `access=true` and the caller holds
            `admin:GetObjectAccess` on the bucket or on at least one object of this page: the objects the
            caller holds it on then carry `access`. False otherwise - not asked for, not permitted, or a
            node that keeps no such record - and then no object carries `access`.
        common_prefixes:
          type: array
          items:
            type: string
        truncated:
          type: boolean
        next_continuation_token:
          type: string
    ObjectMetadata:
      type: object
      required: [bucket, key, size, etag, last_modified, content_type, encryption]
      properties:
        bucket:
          type: string
        key:
          type: string
        size:
          type: integer
          format: int64
        etag:
          type: string
        last_modified:
          type: string
          format: date-time
        content_type:
          type: string
        encryption:
          type: string
          description: How the object is encrypted at rest.
    ObjectReader:
      type: object
      required: [who, presigned, downloads, copies, last_at]
      properties:
        who:
          type: string
          description: The reader, as the audit trail names actors - `root`, `user/<name>`, `key/<access key ID>` or `anonymous`.
        presigned:
          type: boolean
          description: |
            True for reads made with URLs this reader signed: whoever held the URL read, not necessarily the
            signer.
        downloads:
          type: integer
          format: int64
          minimum: 0
        copies:
          type: integer
          format: int64
          minimum: 0
        last_at:
          type: string
          format: date-time
          description: When the last of this reader's reads was recorded.
    ObjectAccess:
      type: object
      description: |
        Who uploaded a version of an object and who read it. Best-effort counts, not an audit trail.
      required: [uploaded_at, download_count, copy_count, readers, other_readers, other_downloads, other_copies]
      properties:
        uploaded_by:
          type: string
          description: Who uploaded the version, as the audit trail names actors. Absent when it was not recorded.
        uploaded_at:
          type: string
          format: date-time
        download_count:
          type: integer
          format: int64
          minimum: 0
          description: Downloads of the version, every ranged request counted by itself.
        copy_count:
          type: integer
          format: int64
          minimum: 0
          description: How often the version was the source of a copy.
        last_downloaded_at:
          type: string
          format: date-time
          description: When the last download or copy was recorded. Absent when there was none.
        readers:
          type: array
          maxItems: 32
          description: The readers kept by name. Beyond 32, whoever read longest ago is counted among the others.
          items:
            $ref: '#/components/schemas/ObjectReader'
        other_readers:
          type: integer
          format: int64
          minimum: 0
          description: Readers who are no longer kept by name.
        other_downloads:
          type: integer
          format: int64
          minimum: 0
        other_copies:
          type: integer
          format: int64
          minimum: 0
    SearchResult:
      type: object
      required: [kind, bucket]
      properties:
        kind:
          type: string
          enum: [bucket, object]
          description: What was found - a bucket, by its name, or an object, by its key.
        bucket:
          type: string
          description: The bucket, or the bucket of the object.
        key:
          type: string
          description: The key of the object. A bucket has none.
        size:
          type: integer
          format: int64
          minimum: 0
          description: The size of the object, in bytes.
        last_modified:
          type: string
          format: date-time
          description: When the object was stored.
        etag:
          type: string
          description: The entity tag of the object.
    SearchResults:
      type: object
      required: [results, match, examined, complete]
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/SearchResult'
        match:
          type: string
          enum: [substring, wildcard, regex]
          description: How `q` was read.
        examined:
          type: integer
          minimum: 0
          description: How many keys this request looked at.
        complete:
          type: boolean
          description: False when a bound stopped the request before it had looked at everything.
        next_continuation:
          type: string
          description: Where to go on, when `complete` is false.
    User:
      type: object
      required: [name, groups, roles, disabled, has_password, created_at]
      properties:
        name:
          $ref: '#/components/schemas/Name'
        groups:
          type: array
          items:
            $ref: '#/components/schemas/Name'
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Name'
        disabled:
          type: boolean
        has_password:
          type: boolean
          description: Whether the user can sign in to the console.
        created_at:
          type: string
          format: date-time
    UserCreate:
      type: object
      required: [name]
      properties:
        name:
          $ref: '#/components/schemas/Name'
        groups:
          type: array
          maxItems: 64
          items:
            $ref: '#/components/schemas/Name'
        roles:
          type: array
          maxItems: 64
          items:
            $ref: '#/components/schemas/Name'
        disabled:
          type: boolean
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 12
          maxLength: 1024
    UserUpdate:
      type: object
      required: [groups, roles, disabled]
      properties:
        groups:
          type: array
          maxItems: 64
          items:
            $ref: '#/components/schemas/Name'
        roles:
          type: array
          maxItems: 64
          items:
            $ref: '#/components/schemas/Name'
        disabled:
          type: boolean
        password:
          type: string
          format: password
          writeOnly: true
          description: When given, replaces the console password.
          minLength: 12
          maxLength: 1024
    Group:
      type: object
      required: [name, roles, created_at]
      properties:
        name:
          $ref: '#/components/schemas/Name'
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Name'
        created_at:
          type: string
          format: date-time
    GroupCreate:
      type: object
      required: [name, roles]
      properties:
        name:
          $ref: '#/components/schemas/Name'
        roles:
          type: array
          maxItems: 64
          items:
            $ref: '#/components/schemas/Name'
    GroupUpdate:
      type: object
      required: [roles]
      properties:
        roles:
          type: array
          maxItems: 64
          items:
            $ref: '#/components/schemas/Name'
    Role:
      type: object
      required: [name, policies, built_in, created_at]
      properties:
        name:
          $ref: '#/components/schemas/Name'
        policies:
          type: array
          items:
            $ref: '#/components/schemas/Name'
        built_in:
          type: boolean
        created_at:
          type: string
          format: date-time
    RoleCreate:
      type: object
      required: [name, policies]
      properties:
        name:
          $ref: '#/components/schemas/Name'
        policies:
          type: array
          maxItems: 64
          items:
            $ref: '#/components/schemas/Name'
    RoleUpdate:
      type: object
      required: [policies]
      properties:
        policies:
          type: array
          maxItems: 64
          items:
            $ref: '#/components/schemas/Name'
    PolicyDocument:
      type: object
      description: |
        A policy in the IAM policy language (Version, Statement with Effect, Action, Resource, Condition). The
        server reads the document as it was sent, byte for byte: one that names a key twice in an object, or
        is larger than 20 KiB as sent, is refused.
      additionalProperties: true
      # The bytes the client sent reach the policy parsers, which refuse a
      # key given twice and measure the document as sent; a decoded map
      # would keep only one of the two values and be re-encoded.
      x-go-type: json.RawMessage
      x-go-type-import:
        path: encoding/json
    Policy:
      type: object
      required: [name, document, built_in, created_at]
      properties:
        name:
          $ref: '#/components/schemas/Name'
        document:
          $ref: '#/components/schemas/PolicyDocument'
        built_in:
          type: boolean
        created_at:
          type: string
          format: date-time
    PolicyCreate:
      type: object
      required: [name, document]
      properties:
        name:
          $ref: '#/components/schemas/Name'
        document:
          $ref: '#/components/schemas/PolicyDocument'
    PolicyUpdate:
      type: object
      required: [document]
      properties:
        document:
          $ref: '#/components/schemas/PolicyDocument'
    APIKey:
      type: object
      required: [access_key_id, owner, description, created_at]
      properties:
        access_key_id:
          type: string
        owner:
          $ref: '#/components/schemas/Name'
        description:
          type: string
        inline_policy:
          $ref: '#/components/schemas/PolicyDocument'
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
    APIKeyCreate:
      type: object
      properties:
        description:
          type: string
          maxLength: 256
        inline_policy:
          $ref: '#/components/schemas/PolicyDocument'
        expires_at:
          type: string
          format: date-time
    APIKeyCreated:
      type: object
      required: [key, secret_key]
      properties:
        key:
          $ref: '#/components/schemas/APIKey'
        secret_key:
          type: string
          format: password
          description: Shown once. It cannot be had again.
    NodeLabels:
      type: object
      properties:
        region:
          type: string
        zone:
          type: string
        rack:
          type: string
        host:
          type: string
    Node:
      type: object
      required: [id, roles, labels, leader]
      properties:
        id:
          type: string
        roles:
          type: array
          items:
            type: string
        labels:
          $ref: '#/components/schemas/NodeLabels'
        leader:
          type: boolean
          description: Whether the node leads the metadata group.
        metadata_version:
          type: integer
    Drive:
      type: object
      required: [id, node_id, state]
      properties:
        id:
          type: string
        node_id:
          type: string
        state:
          type: string
          enum: [online, offline]
    ErasureSet:
      type: object
      required: [index, drives]
      properties:
        index:
          type: integer
        drives:
          type: array
          items:
            $ref: '#/components/schemas/Drive'
    ClusterStatus:
      type: object
      required: [deployment_id, answered_by, server, leader, nodes, erasure_sets, node_failures_tolerated, drives_online, drives_total]
      properties:
        deployment_id:
          type: string
        answered_by:
          type: string
          description: |
            The node that answered. `server` is its build; the builds of the other nodes are not known to it:
            during a rolling upgrade, ask each node.
        server:
          $ref: '#/components/schemas/ServerVersion'
        leader:
          type: string
          description: The node that leads the metadata group, or empty when there is none.
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/Node'
        erasure_sets:
          type: array
          items:
            $ref: '#/components/schemas/ErasureSet'
        node_failures_tolerated:
          type: integer
        drives_online:
          type: integer
        drives_total:
          type: integer
    Settings:
      type: object
      description: |
        How the deployment is configured, read from its nodes as the request was served. Nothing of it is
        stored.
      required: [answered_by, cluster, nodes, mismatches]
      properties:
        answered_by:
          type: string
          description: The node that answered and asked the others.
        cluster:
          $ref: '#/components/schemas/SettingsCluster'
        nodes:
          type: array
          description: Every node of the deployment, by ID, with its answer or the reason there is none.
          items:
            $ref: '#/components/schemas/NodeSettings'
        mismatches:
          type: array
          description: |
            The settings of scope `cluster` in which the nodes that answered differ, by name. Besides the
            settings, `kms-key-id` and `version` are compared. Empty when the nodes agree, and when fewer than
            two answered.
          items:
            $ref: '#/components/schemas/SettingsMismatch'
    SettingsCluster:
      type: object
      description: |
        What holds for the deployment as a whole, from the replicated record of the answering node and its part
        of the metadata group. A node that runs on its own is a deployment of one node.
      required: [deployment_id, metadata_level, nodes, voters, erasure_sets]
      properties:
        deployment_id:
          type: string
          description: Empty while the deployment has no drive topology.
        metadata_level:
          type: integer
          description: |
            The format of metadata entry the deployment writes now: the newest every member of the metadata
            group can apply, as the metadata store of the answering node works it out - the number its metric
            `cactusfs_metadata_schema_level` shows. A member that has not said what it can apply holds the level
            back. It is 1 or more; when it cannot be read there is no answer, and the request fails.
        leader:
          type: string
          description: The node that leads the metadata group. Absent when there is none.
        nodes:
          type: integer
          description: |
            How many nodes are recorded. 1 when none is: the answering node, which runs on its own.
        voters:
          type: integer
          description: |
            How many of them have the role `meta` and vote in the metadata group. 1 when no node is recorded: a
            node on its own is the one member of its metadata group.
        erasure_sets:
          type: array
          items:
            $ref: '#/components/schemas/SettingsErasureSet'
    SettingsErasureSet:
      type: object
      description: The coding of one erasure set.
      required: [index, drives, data, parity, read_quorum, write_quorum]
      properties:
        index:
          type: integer
        drives:
          type: integer
          description: The number of drives in the set.
        data:
          type: integer
          description: The number of data shards of an object.
        parity:
          type: integer
          description: The number of parity shards; as many drives can be lost.
        read_quorum:
          type: integer
        write_quorum:
          type: integer
    NodeSettings:
      type: object
      description: |
        What one node says of itself. A node that did not answer has `node_id`, `answered: false` and `reason`
        and nothing else; one that answered has no `reason`, and has `roles`, `labels`, `settings`, `drives`
        and `certificates`, each of which may be empty.
      required: [node_id, answered]
      properties:
        node_id:
          type: string
        answered:
          type: boolean
        reason:
          type: string
          description: |
            Why the node did not answer: it could not be reached (`unreachable`), it did not answer in time
            (`timeout`), it is of a release that cannot be asked (`unsupported`), or it was reached and could
            not answer (`failed`). The cause itself is in the log of the answering node, not here.
          enum: [unreachable, timeout, unsupported, failed]
        roles:
          type: array
          description: The roles the node runs.
          items:
            type: string
        labels:
          type: object
          description: The placement labels that are set, by name - `region`, `zone`, `rack`, `host`.
          additionalProperties:
            type: string
        server:
          $ref: '#/components/schemas/ServerVersion'
        started_at:
          type: string
          format: date-time
          description: When the process started.
        kms_key_id:
          type: string
          description: The name of the key that wraps data keys. A name, never key material.
        settings:
          type: array
          description: The settings of the node, by name.
          items:
            $ref: '#/components/schemas/Setting'
        drives:
          type: array
          description: The drives of the node, by ID.
          items:
            $ref: '#/components/schemas/DriveSettings'
        metadata:
          $ref: '#/components/schemas/SettingsVolume'
        certificates:
          type: array
          items:
            $ref: '#/components/schemas/SettingsCertificate'
    Setting:
      type: object
      description: One setting of one node, as it may be shown.
      required: [name, kind, scope, source, set]
      properties:
        name:
          type: string
          description: The name of the setting, which is that of its flag where it has one.
        env:
          type: string
          description: The environment variable that sets it.
        flag:
          type: string
          description: The flag that sets it, without dashes. A secret has none.
        group:
          type: string
          description: The heading the setting is listed under.
        kind:
          type: string
          description: |
            What the value is, and with that how much of it is shown: `plain`, `path`, `url` (shown without
            userinfo, query and fragment), `secret` or `secret-file` (never shown). The list is not closed: a
            node of a newer release may name a kind this document does not, and its value is then never
            shown either. Read a kind you do not know as a secret.
        scope:
          type: string
          description: |
            Whose the setting is: `node` for what each node has for itself, `cluster` for what must be the
            same on every node. A newer release may add to the list.
        source:
          type: string
          description: |
            How the value arrived: `default`, `environment`, `flag`, or `derived` from other settings. A newer
            release may add to the list.
        set:
          type: boolean
          description: Whether the setting has a value. For the kinds `secret` and `secret-file` it is all that is told.
        value:
          type: string
          maxLength: 4096
          description: |
            The redacted value. Never present for the kinds `secret` and `secret-file`, nor for a kind that is
            not known; absent when there is nothing to show.
    SettingsFilesystem:
      type: object
      description: |
        The file system behind a directory, where the node can tell - on Linux. Mount options are never given.
      required: [type, device, mount_point]
      properties:
        type:
          type: string
        device:
          type: string
          description: What is mounted, without any credential it names.
        mount_point:
          type: string
          description: Where it is mounted, as the node sees it.
    SettingsVolume:
      type: object
      description: A directory a node stores in.
      required: [directory, total_bytes, free_bytes]
      properties:
        directory:
          type: string
          description: The directory as the node sees it - inside a container, the path in the container.
        filesystem:
          $ref: '#/components/schemas/SettingsFilesystem'
        total_bytes:
          type: integer
          format: int64
          minimum: 0
        free_bytes:
          type: integer
          format: int64
          minimum: 0
    DriveSettings:
      type: object
      description: One drive of a node - where it is and what it belongs to.
      required: [id, directory, total_bytes, free_bytes, online]
      properties:
        id:
          type: string
        directory:
          type: string
          description: The directory as the node sees it - inside a container, the path in the container.
        label:
          type: string
          description: What the deployment calls the volume, as the node was told. Absent when it was told nothing.
        filesystem:
          $ref: '#/components/schemas/SettingsFilesystem'
        total_bytes:
          type: integer
          format: int64
          minimum: 0
        free_bytes:
          type: integer
          format: int64
          minimum: 0
        online:
          type: boolean
          description: Whether the node can use the drive.
        erasure_set:
          type: integer
          minimum: 0
          description: The index of the erasure set the drive is in. Absent for a drive that is in none.
    SettingsCertificate:
      type: object
      description: What may be said of a certificate a node serves - who it names and until when. Nothing of the key.
      required: [use, subject, issuer, dns_names, ip_addresses, not_before, not_after]
      properties:
        use:
          type: string
          description: |
            `s3` for the certificate of the listeners clients reach, `node` for the one a node shows other
            nodes. A newer release may add to the list.
        subject:
          type: string
        issuer:
          type: string
        dns_names:
          type: array
          items:
            type: string
        ip_addresses:
          type: array
          items:
            type: string
        not_before:
          type: string
          format: date-time
        not_after:
          type: string
          format: date-time
    SettingsMismatch:
      type: object
      description: A setting that should be the same on every node and is not.
      required: [setting, values]
      properties:
        setting:
          type: string
          description: The name of the setting, or `kms-key-id` or `version`.
        values:
          type: array
          description: What each node that answered has, by node ID.
          items:
            $ref: '#/components/schemas/SettingsMismatchValue'
    SettingsMismatchValue:
      type: object
      required: [node_id, value]
      properties:
        node_id:
          type: string
        value:
          type: string
          description: |
            The redacted value; `set` or `not set` for a secret; empty, or `not set` for a secret, on a node
            that does not have the setting.
    ScrubStatus:
      type: object
      required: [passes, objects, damaged, shards_rebuilt, unrecoverable, bytes]
      properties:
        passes:
          type: integer
          format: int64
        last_pass_at:
          type: string
          format: date-time
        objects:
          type: integer
          format: int64
          description: Objects checked in the last pass.
        damaged:
          type: integer
          format: int64
        shards_rebuilt:
          type: integer
          format: int64
        unrecoverable:
          type: integer
          format: int64
        bytes:
          type: integer
          format: int64
    HealStatus:
      type: object
      required: [objects, shards_rebuilt, unrecoverable]
      properties:
        objects:
          type: integer
          format: int64
          description: Objects found damaged since the node started.
        shards_rebuilt:
          type: integer
          format: int64
        unrecoverable:
          type: integer
          format: int64
    CollectionStatus:
      type: object
      required: [passes, shards, removed]
      properties:
        passes:
          type: integer
          format: int64
        last_pass_at:
          type: string
          format: date-time
        shards:
          type: integer
          format: int64
          description: Shards looked at in the last pass.
        removed:
          type: integer
          format: int64
    MaintenanceStatus:
      type: object
      required: [node_id, started_at, scrub, heal, collection]
      properties:
        node_id:
          type: string
        started_at:
          type: string
          format: date-time
        scrub:
          $ref: '#/components/schemas/ScrubStatus'
        heal:
          $ref: '#/components/schemas/HealStatus'
        collection:
          $ref: '#/components/schemas/CollectionStatus'
    UpdatesView:
      type: object
      description: |
        What the answering node knows of releases (`GET /updates`). Nothing in it names the update source's
        address, nor anything the source said in its own words.
      required: [current, source_configured, channel, available, mode, upgrade_available, instructions]
      properties:
        current:
          $ref: '#/components/schemas/ServerVersion'
        source_configured:
          type: boolean
          description: Whether an `update-source` is configured. Without one nothing is ever asked, and `available` is empty.
        channel:
          $ref: '#/components/schemas/UpdateChannel'
        checked_at:
          type: string
          format: date-time
          description: When the node last asked the source, whether or not it answered. Absent when it has not asked since it started.
        last_error:
          $ref: '#/components/schemas/UpdateCheckError'
        available:
          type: array
          description: |
            The releases newer than the running one that the channel offers, newest first, as the source listed
            them when it last answered. Empty when it has not.
          items:
            $ref: '#/components/schemas/AvailableRelease'
        next_step:
          type: string
          description: |
            The version the console offers to install: the newest of `available` that may be installed. Absent when
            none may.
        mode:
          $ref: '#/components/schemas/UpgradeMode'
        upgrade_available:
          type: boolean
          description: |
            Whether an upgrade can be started from the console on this deployment: `mode` is not `off` and what
            it needs is there. It does not say whether the caller may.
        unavailable_reason:
          type: string
          description: Why an upgrade cannot be started here, in words that name no secret. Absent when it can.
        instructions:
          type: array
          description: |
            What an operator does to install `next_step` without the console, as lines of text to copy - the
            binary to download and its checksum to check, or the `helm upgrade` to run. Empty when there is
            nothing to install.
          items:
            type: string
    UpdateChannel:
      type: string
      description: |
        Which releases are offered (`update-channel`): `stable` leaves pre-releases out, `prerelease` offers them
        too. Values are only ever added to.
      enum: [stable, prerelease]
    UpdateCheckError:
      type: string
      description: |
        Why the last check could not be read, as a class: the source could not be reached (`unreachable`), it
        limited the rate of requests (`rate-limited`), it answered with a refusal (`refused`), its answer was
        not one this node reads (`invalid-answer`), or it did not answer in time (`timeout`). Absent when the
        last check was read. The cause is in the log of the node, without the source's address. Values are
        only ever added to.
      enum: [unreachable, rate-limited, refused, invalid-answer, timeout]
    AvailableRelease:
      type: object
      description: A release the source listed. Nothing of it is trusted until its signed lists verify, when it is installed.
      required: [version, prerelease, allowed]
      properties:
        version:
          type: string
          description: The release, a semantic version without a leading "v".
        published:
          type: string
          format: date-time
          description: When it was published, as the source says. Absent when the source did not say.
        prerelease:
          type: boolean
          description: Whether it is a pre-release, by its version or because the source marks it so.
        notes_url:
          type: string
          description: The https address of its release notes, for a link; the console never fetches it. Absent when there is none.
        allowed:
          type: boolean
          description: Whether it may be installed from the running release.
        refusal:
          $ref: '#/components/schemas/UpgradeRefusal'
    UpgradeRefusal:
      type: string
      description: |
        Why a release may not be installed from the running one. Absent when it may. `equal` and `older`: it is
        not newer (nothing is downgraded); `prerelease-on-stable`: it is a pre-release and the channel is
        `stable`; `major`: it is of another major version; `skipped-minor`: it is more than one minor version
        ahead; `not-newest-patch`: a newer patch of the next minor version is listed; `unknown-release`: it was
        not listed when the node last checked. Values are only ever added to.
      enum: [equal, older, prerelease-on-stable, major, skipped-minor, not-newest-patch, unknown-release]
    UpgradeMode:
      type: string
      description: |
        How this deployment installs a release (`upgrade-mode`): `off` installs nothing and gives the
        instructions instead; `binary` replaces the binary of a deployment of one node; `kubernetes` moves the
        nodes to the release's image, one at a time. Values are only ever added to.
      enum: ['off', binary, kubernetes]
    UpgradeRequest:
      type: object
      required: [version, password]
      properties:
        version:
          type: string
          description: The release to install, as `GET /updates` lists it.
          minLength: 1
          maxLength: 128
        password:
          type: string
          format: password
          writeOnly: true
          description: The password of the user the session belongs to, typed again for this request.
          minLength: 1
          maxLength: 1024
    UpgradeProgress:
      type: object
      description: |
        Where the latest upgrade stands, as read from the deployment. `idle`: none was started since the
        answering node started; `verifying`: the release is being fetched and verified; `running`: nodes are
        being moved; `restart-required`: the binary was replaced and whoever runs the node must restart it
        (Windows); `failed`: it stopped, and the nodes say where and why; `done`: every node runs the target.
      required: [state, nodes]
      properties:
        state:
          $ref: '#/components/schemas/UpgradeState'
        target:
          type: string
          description: The version being installed. Absent when idle.
        started_by:
          type: string
          description: Who started it, as the audit trail names actors (`user/alice`). Absent when idle.
        started_at:
          type: string
          format: date-time
          description: When it was started. Absent when idle.
        nodes:
          type: array
          description: The nodes of the deployment, in the order they are moved. Empty when idle.
          items:
            $ref: '#/components/schemas/UpgradeNode'
    UpgradeState:
      type: string
      description: Where an upgrade stands (see `UpgradeProgress`). Values are only ever added to.
      enum: [idle, verifying, running, restart-required, failed, done]
    UpgradeNode:
      type: object
      description: One node in an upgrade.
      required: [id, state]
      properties:
        id:
          type: string
          description: The node's ID.
        version:
          type: string
          description: The release the node runs now, as it reports it. Absent when it could not be asked.
        build:
          type: string
          description: The node's build number, as it reports it. Absent when it could not be asked.
        state:
          $ref: '#/components/schemas/UpgradeNodeState'
        reason:
          type: string
          description: Why the node failed or was put back, in words that name no secret. Absent otherwise.
    UpgradeNodeState:
      type: string
      description: |
        Where a node stands in an upgrade: not moved yet (`pending`), being moved or coming up again
        (`upgrading`), running the target and ready (`done`), did not come up on the target (`failed`), or
        failed and was put back where it was (`restored`). Values are only ever added to.
      enum: [pending, upgrading, done, failed, restored]
    AuditRecord:
      type: object
      required: [sequence, time, actor, action, resource, outcome, hash, previous_hash]
      properties:
        sequence:
          type: integer
          format: int64
        time:
          type: string
          format: date-time
        actor:
          type: string
        access_key_id:
          type: string
        action:
          type: string
        resource:
          type: string
        outcome:
          type: string
        source_ip:
          type: string
        request_id:
          type: string
        details:
          type: object
          additionalProperties:
            type: string
        previous_hash:
          type: string
        hash:
          type: string
    AuditPage:
      type: object
      required: [records]
      properties:
        records:
          type: array
          items:
            $ref: '#/components/schemas/AuditRecord'
        next_after:
          type: integer
          format: int64
          description: Pass it as `after` for the next page. Absent on the last page.
