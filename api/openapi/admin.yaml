openapi: 3.0.3
info:
  title: CactusFS management API
  version: 1.0.0
  description: |
    The management API of CactusFS: buckets and objects, users, groups, roles,
    policies and API keys, the state of the cluster, and the audit trail.

    **Authentication.** Every request is authenticated, except signing in and
    fetching this document. Send an API key as a bearer credential,
    `Authorization: Bearer <access key ID>:<secret key>`, or - from the
    console - the session cookie that signing in sets. A request made with a
    session that changes something must also carry the CSRF token of that
    session in `X-CSRF-Token`.

    **Authorization.** Every request is decided by the same authorizer as the
    S3 API, from the policies of the user. What a request needs is named in
    each operation as `x-cactusfs-action`.

    **Errors** are `application/problem+json` (RFC 9457).

    **Idempotency.** Every request that changes something accepts
    `Idempotency-Key`. A request repeated with the same key and the same
    content gets the answer the first one got, and changes nothing again; with
    the same key and other content it is refused with 422; while the first is
    still being carried out it is refused with 409. Keys are kept for 24 hours.
servers:
  - url: /api/v1
security:
  - apiKey: []
  - session: []
tags:
  - name: session
    description: Signing in to the console and out of it.
  - name: buckets
  - name: objects
  - name: search
    description: Finding buckets and objects by name.
  - name: users
  - name: groups
  - name: roles
  - name: policies
  - name: keys
    description: API keys.
  - name: cluster
  - name: audit
  - name: meta
    description: This document.
paths:
  /session:
    post:
      operationId: signIn
      tags: [session]
      summary: Sign in to the console
      description: |
        Checks a user name and password and starts a session. The session token is set as an HttpOnly cookie;
        the CSRF token is returned once, here. `Idempotency-Key` is accepted and has no effect: an answer that
        holds a session is never given twice, so repeating a sign-in starts another session.
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInRequest'
      responses:
        '200':
          description: Signed in.
          headers:
            Set-Cookie:
              description: The session cookie.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        default:
          $ref: '#/components/responses/Problem'
    get:
      operationId: getSession
      tags: [session]
      summary: Who is making this request
      responses:
        '200':
          description: The identity of the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Identity'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: signOut
      tags: [session]
      summary: Sign out
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204':
          description: Signed out. The cookie is cleared.
          headers:
            Set-Cookie:
              description: Clears the session cookie.
              schema:
                type: string
        default:
          $ref: '#/components/responses/Problem'
  /buckets:
    get:
      operationId: listBuckets
      tags: [buckets]
      summary: List buckets
      description: |
        Every bucket, in name order. With `details=true` every bucket also carries `details`: who created
        it and its latest uploads and downloads, where the caller holds `admin:GetObjectAccess` on that
        bucket - the keys of the objects only where the caller holds `s3:ListBucket` on it as well - and a
        summary of the bucket's policy, where the caller holds `s3:GetBucketPolicy` on it. Every upload
        and download is of an object, and is additionally decided for that object as
        `GET /buckets/{bucket}/object/access` decides it: a row is given only where the caller holds
        `admin:GetObjectAccess` on its key, and is otherwise left out whole - who, when and key - so a
        policy that denies the action by key holds here too. The action is required on the bucket as
        well: a caller who holds it on objects only is given `access_included: false` and no row, which
        is stricter than the object list's `access_included`. Those
        permissions decide only what the list carries, bucket by bucket: a caller without them is given
        the same list with `access_included: false` or `policy_included: false`. The list is authorized
        as it is without `details`, is never refused for want of those permissions, and nothing is written
        to the audit trail for a part that is left out; where a part may be shown and cannot be read, the
        list fails as any read that fails does.
      x-cactusfs-action: s3:ListAllMyBuckets
      parameters:
        - name: details
          in: query
          description: |
            Whether every bucket should carry `details`: its creator, its latest uploads and downloads
            and a summary of its policy, each as far as the caller may see it. See `BucketDetails`.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: The buckets.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Bucket'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createBucket
      tags: [buckets]
      summary: Create a bucket
      x-cactusfs-action: s3:CreateBucket
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BucketCreate'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bucket'
        default:
          $ref: '#/components/responses/Problem'
  /buckets/{bucket}:
    get:
      operationId: getBucket
      tags: [buckets]
      summary: Get a bucket
      x-cactusfs-action: s3:ListBucket
      parameters:
        - $ref: '#/components/parameters/BucketName'
      responses:
        '200':
          description: The bucket.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bucket'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteBucket
      tags: [buckets]
      summary: Delete an empty bucket
      x-cactusfs-action: s3:DeleteBucket
      parameters:
        - $ref: '#/components/parameters/BucketName'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204':
          description: Deleted.
        default:
          $ref: '#/components/responses/Problem'
  /buckets/{bucket}/usage:
    get:
      operationId: getBucketUsage
      tags: [buckets]
      summary: How many objects a bucket holds, and their size together
      description: >-
        Counts the current versions of the bucket's objects and adds up their
        sizes, by reading the index: older versions and uploads in progress are
        not counted. For a very large bucket the count stops at a bound and
        `complete` is false; the figures are then of the keys counted so far.
      x-cactusfs-action: s3:ListBucket
      parameters:
        - $ref: '#/components/parameters/BucketName'
      responses:
        '200':
          description: The bucket's usage.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BucketUsage'
        default:
          $ref: '#/components/responses/Problem'
  /buckets/{bucket}/objects:
    get:
      operationId: listObjects
      tags: [objects]
      summary: List the objects of a bucket
      description: |
        One page of the bucket's objects. With `access=true` every object also says who uploaded it and
        when, how often it was downloaded and copied, and when last - the figures of
        `/buckets/{bucket}/object/access`, without the readers - where the caller holds
        `admin:GetObjectAccess` on that object. That permission decides only what the listing carries: a
        caller without it is given the same listing with `access_included: false` and no `access` on any
        object. The listing is never refused for want of that permission, and nothing is written to the audit trail
        for it; where the facts may be shown and cannot be read, the listing fails as any read that fails does.
      x-cactusfs-action: s3:ListBucket
      parameters:
        - $ref: '#/components/parameters/BucketName'
        - name: prefix
          in: query
          description: Only keys that begin with this.
          schema:
            type: string
            maxLength: 1024
        - name: delimiter
          in: query
          description: Keys that contain it after the prefix are rolled up into common prefixes.
          schema:
            type: string
            maxLength: 16
        - name: continuation_token
          in: query
          description: The `next_continuation_token` of the previous page.
          schema:
            type: string
            maxLength: 4096
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 200
        - name: access
          in: query
          description: |
            Whether the listing should carry, for each object, who uploaded it and how often it was
            downloaded. It does so only for a caller who holds `admin:GetObjectAccess`; see
            `access_included`.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: One page of the listing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectList'
        default:
          $ref: '#/components/responses/Problem'
  /buckets/{bucket}/object:
    get:
      operationId: getObject
      tags: [objects]
      summary: Download an object
      x-cactusfs-action: s3:GetObject
      parameters:
        - $ref: '#/components/parameters/BucketName'
        - $ref: '#/components/parameters/ObjectKey'
      responses:
        '200':
          description: The content of the object.
          headers:
            Content-Length:
              schema:
                type: integer
                format: int64
            ETag:
              schema:
                type: string
            Last-Modified:
              schema:
                type: string
            Content-Disposition:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        default:
          $ref: '#/components/responses/Problem'
    put:
      operationId: putObject
      tags: [objects]
      summary: Upload an object
      description: |
        Stores the body as the object. `Content-Length` is required. With `Idempotency-Key`, a repeated request
        is recognised by its bucket, key and length, not by its content.
      x-cactusfs-action: s3:PutObject
      parameters:
        - $ref: '#/components/parameters/BucketName'
        - $ref: '#/components/parameters/ObjectKey'
        - name: Content-Type
          in: header
          description: The media type to store with the object.
          schema:
            type: string
            maxLength: 255
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectMetadata'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteObject
      tags: [objects]
      summary: Delete an object
      x-cactusfs-action: s3:DeleteObject
      parameters:
        - $ref: '#/components/parameters/BucketName'
        - $ref: '#/components/parameters/ObjectKey'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204':
          description: Deleted, or was not there.
        default:
          $ref: '#/components/responses/Problem'
  /buckets/{bucket}/object/metadata:
    get:
      operationId: getObjectMetadata
      tags: [objects]
      summary: Get what is known about an object
      x-cactusfs-action: s3:GetObject
      parameters:
        - $ref: '#/components/parameters/BucketName'
        - $ref: '#/components/parameters/ObjectKey'
      responses:
        '200':
          description: The metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectMetadata'
        default:
          $ref: '#/components/responses/Problem'
  /buckets/{bucket}/object/access:
    get:
      operationId: getObjectAccess
      tags: [objects]
      summary: Get who uploaded an object and who downloaded it
      description: |
        Who uploaded the object and when, how often it was downloaded and used as the source of a copy, and
        by whom. The figures are best-effort counts, not an audit trail: every node counts in memory and hands
        its counts over every half a minute or so, a node that crashes loses what it had not handed over, and
        a transfer that was cut short counts like a whole one. They are counts of one version - in a bucket
        that keeps no versions an overwrite starts again at zero. Reading the object does not give the
        permission to see them.
      x-cactusfs-action: admin:GetObjectAccess
      parameters:
        - $ref: '#/components/parameters/BucketName'
        - $ref: '#/components/parameters/ObjectKey'
        - name: version_id
          in: query
          description: The version to ask about - `null`, or the ID of a version. Without it, the current version.
          schema:
            type: string
            pattern: '^(null|[0-9a-f]{32})$'
      responses:
        '200':
          description: What is known of the uploading and the reading of the object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectAccess'
        default:
          $ref: '#/components/responses/Problem'
  /search:
    get:
      operationId: search
      tags: [search]
      summary: Search buckets and objects by name
      description: |
        Finds the buckets whose name, and the objects whose key, answer to `q`.

        **What is searched.** Only what the caller may list: the name of a bucket is a result for who may list
        the buckets (`s3:ListAllMyBuckets`), and the keys of a bucket are searched for who may list that bucket
        (`s3:ListBucket`, the bucket's own policy included). Buckets the caller may not list are passed over
        without a word. Who may list neither the buckets nor any bucket is refused with 403, as is a `bucket`
        the caller may not list. Current versions are searched; an object that was deleted is not found.

        **The query** is read in one of three ways.
        Plain text is found anywhere in a name, whatever its case: `report` finds `2025/Annual-Report.pdf`.
        Text with `*` or `?` in it is a pattern for the whole name, whatever its case: `*` stands for any run
        of characters, `/` included, and `?` for exactly one, so `*.pdf` finds every key that ends so.
        Text that begins with `rx:` is a regular expression in the RE2 syntax, taken as written - case and
        all - and found anywhere in a name unless it anchors itself: `rx:^logs/\d{4}/`. A regular expression
        that cannot be read is refused with 400, and `detail` says what the matter with it is.

        **Bounds.** One request looks at no more than 50 000 keys and 200 buckets, for no more than two
        seconds, and returns no more than `limit` results. When a bound stops it, `complete` is false and
        `next_continuation` goes on from there: send it as `continuation` with the same `q` and `bucket`.
        A page can be empty and still not be the last. Only buckets the caller may see count, and only such
        a bucket is where a page stops: `examined`, `complete` and the number of pages say nothing of the
        others. A caller runs one search at a time and a node eight; beyond that the answer is 429 with
        `Retry-After`.

        **What a page costs.** Before it looks at a key, every page decides again which buckets are the
        caller's to see - all of them, whatever `continuation` says - from the bucket policies as the node
        that answers has them, read page by page. That takes time in proportion to the number of buckets
        there are and the size of their policies, not to how many of them the caller may see nor to where the
        page begins. The node remembers what a policy says for as long as the policy does not change, so a
        page checks every policy and reads anew only those that changed: some 0.2 seconds for 5 000 buckets
        whose policies are 16 KiB each, 0.1 for 20 000 with policies of 1 KiB, on the machine it was measured
        on.

        **503 from a search.** Deciding counts towards the two seconds. When it takes them all, the answer is
        503 with `Retry-After: 1` and a `detail` that says so, and no part of an answer. That 503 has two
        causes, and only one of them passes. A node that was started not long ago remembers nothing yet and
        reads every policy in full - some ten times the work, 2.6 seconds for the 5 000 buckets above - but
        keeps what it has read when it gives up, so the same request sent again gets further and is soon
        answered. Past a size of the deployment, though, the two seconds are not enough even then: about
        10 000 buckets with policies of 16 KiB, or 150 000 with policies of 1 KiB, on that machine (the node
        remembers 128 MiB of policies and reads the others in full on every page). There the 503 is a limit
        and repeating the request does not help: search a `bucket` by name, which decides that bucket alone.
        The root identity is bound by no bucket policy, reads none, and is not subject to this.

        A `continuation` says where to go on and grants nothing. It is refused with 400 when it is not one
        this API gave out for the same `q` and `bucket`.

        Results come in order: buckets by name, each followed by its objects by key. A search is a read and
        leaves no audit record.
      x-cactusfs-action: s3:ListBucket
      parameters:
        - name: q
          in: query
          required: true
          description: What to search for - text, a wildcard, or `rx:` and a regular expression.
          schema:
            type: string
            minLength: 1
            maxLength: 256
        - name: bucket
          in: query
          description: Search the keys of this bucket only. Its name is then no result.
          schema:
            type: string
            minLength: 3
            maxLength: 63
        - name: continuation
          in: query
          description: The `next_continuation` of the previous page.
          schema:
            type: string
            maxLength: 4096
        - name: limit
          in: query
          description: The most results to return.
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        '200':
          description: One page of what was found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResults'
        '429':
          description: |
            The caller has a search running already, or the node is running as many as it runs at a time
            (`code` is `TooManyRequests`). Nothing was searched; the same request can be sent again.
          headers:
            Retry-After:
              description: After how many seconds to send the request again.
              schema:
                type: integer
                minimum: 1
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List users
      x-cactusfs-action: admin:ListUsers
      responses:
        '200':
          description: The users.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createUser
      tags: [users]
      summary: Create a user
      description: |
        A user with a password can sign in to the console. Whoever may create users can give them any role.
      x-cactusfs-action: admin:PutUser
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          $ref: '#/components/responses/Problem'
  /users/{name}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get a user
      x-cactusfs-action: admin:GetUser
      parameters:
        - $ref: '#/components/parameters/EntityName'
      responses:
        '200':
          description: The user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          $ref: '#/components/responses/Problem'
    put:
      operationId: updateUser
      tags: [users]
      summary: Change a user
      x-cactusfs-action: admin:PutUser
      parameters:
        - $ref: '#/components/parameters/EntityName'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: Changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteUser
      tags: [users]
      summary: Delete a user
      x-cactusfs-action: admin:DeleteUser
      parameters:
        - $ref: '#/components/parameters/EntityName'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204':
          description: Deleted.
        default:
          $ref: '#/components/responses/Problem'
  /users/{name}/keys:
    get:
      operationId: listAPIKeys
      tags: [keys]
      summary: List the API keys of a user
      x-cactusfs-action: admin:ListAPIKeys
      parameters:
        - $ref: '#/components/parameters/EntityName'
      responses:
        '200':
          description: The keys, without their secrets.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/APIKey'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createAPIKey
      tags: [keys]
      summary: Create an API key for a user
      description: |
        The key acts as the user and can never do more than the user can. An inline policy narrows it further.
        The secret key is returned once.
      x-cactusfs-action: admin:CreateAPIKey
      parameters:
        - $ref: '#/components/parameters/EntityName'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/APIKeyCreate'
      responses:
        '201':
          description: Created. The secret is in this response and nowhere else, ever.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIKeyCreated'
        default:
          $ref: '#/components/responses/Problem'
  /keys/{access_key_id}:
    delete:
      operationId: deleteAPIKey
      tags: [keys]
      summary: Revoke an API key
      x-cactusfs-action: admin:DeleteAPIKey
      parameters:
        - name: access_key_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204':
          description: Revoked. It stops working at once.
        default:
          $ref: '#/components/responses/Problem'
  /groups:
    get:
      operationId: listGroups
      tags: [groups]
      summary: List groups
      x-cactusfs-action: admin:ListGroups
      responses:
        '200':
          description: The groups.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Group'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createGroup
      tags: [groups]
      summary: Create a group
      description: |
        A group gives its roles to every user in it.
      x-cactusfs-action: admin:PutGroup
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupCreate'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        default:
          $ref: '#/components/responses/Problem'
  /groups/{name}:
    get:
      operationId: getGroup
      tags: [groups]
      summary: Get a group
      x-cactusfs-action: admin:GetGroup
      parameters:
        - $ref: '#/components/parameters/EntityName'
      responses:
        '200':
          description: The group.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        default:
          $ref: '#/components/responses/Problem'
    put:
      operationId: updateGroup
      tags: [groups]
      summary: Change a group
      x-cactusfs-action: admin:PutGroup
      parameters:
        - $ref: '#/components/parameters/EntityName'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupUpdate'
      responses:
        '200':
          description: Changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteGroup
      tags: [groups]
      summary: Delete a group
      x-cactusfs-action: admin:DeleteGroup
      parameters:
        - $ref: '#/components/parameters/EntityName'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204':
          description: Deleted.
        default:
          $ref: '#/components/responses/Problem'
  /roles:
    get:
      operationId: listRoles
      tags: [roles]
      summary: List roles
      x-cactusfs-action: admin:ListRoles
      responses:
        '200':
          description: The roles.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Role'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createRole
      tags: [roles]
      summary: Create a role
      description: |
        A role is a named set of policies. The built-in roles cannot be changed.
      x-cactusfs-action: admin:PutRole
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleCreate'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        default:
          $ref: '#/components/responses/Problem'
  /roles/{name}:
    get:
      operationId: getRole
      tags: [roles]
      summary: Get a role
      x-cactusfs-action: admin:GetRole
      parameters:
        - $ref: '#/components/parameters/EntityName'
      responses:
        '200':
          description: The role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        default:
          $ref: '#/components/responses/Problem'
    put:
      operationId: updateRole
      tags: [roles]
      summary: Change a role
      x-cactusfs-action: admin:PutRole
      parameters:
        - $ref: '#/components/parameters/EntityName'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleUpdate'
      responses:
        '200':
          description: Changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteRole
      tags: [roles]
      summary: Delete a role
      x-cactusfs-action: admin:DeleteRole
      parameters:
        - $ref: '#/components/parameters/EntityName'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204':
          description: Deleted.
        default:
          $ref: '#/components/responses/Problem'
  /policies:
    get:
      operationId: listPolicies
      tags: [policies]
      summary: List policies
      x-cactusfs-action: admin:ListPolicies
      responses:
        '200':
          description: The policies.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Policy'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createPolicy
      tags: [policies]
      summary: Create a policy
      description: |
        A policy document in the IAM policy language. Anything in it that is not understood is refused.
      x-cactusfs-action: admin:PutPolicy
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyCreate'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
        default:
          $ref: '#/components/responses/Problem'
  /policies/{name}:
    get:
      operationId: getPolicy
      tags: [policies]
      summary: Get a policy
      x-cactusfs-action: admin:GetPolicy
      parameters:
        - $ref: '#/components/parameters/EntityName'
      responses:
        '200':
          description: The policy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
        default:
          $ref: '#/components/responses/Problem'
    put:
      operationId: updatePolicy
      tags: [policies]
      summary: Change a policy
      x-cactusfs-action: admin:PutPolicy
      parameters:
        - $ref: '#/components/parameters/EntityName'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyUpdate'
      responses:
        '200':
          description: Changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deletePolicy
      tags: [policies]
      summary: Delete a policy
      x-cactusfs-action: admin:DeletePolicy
      parameters:
        - $ref: '#/components/parameters/EntityName'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204':
          description: Deleted.
        default:
          $ref: '#/components/responses/Problem'
  /cluster:
    get:
      operationId: getCluster
      tags: [cluster]
      summary: The nodes and drives of the deployment
      x-cactusfs-action: admin:GetClusterStatus
      responses:
        '200':
          description: The state of the cluster as this node sees it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterStatus'
        default:
          $ref: '#/components/responses/Problem'
  /cluster/maintenance:
    get:
      operationId: getMaintenance
      tags: [cluster]
      summary: Scrubbing, healing and collection on this node
      description: |
        Scrubbing runs on the node that leads the metadata group; a node that does not lead reports no scrub pass.
      x-cactusfs-action: admin:GetClusterStatus
      responses:
        '200':
          description: What the background work of the answering node has done since it started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceStatus'
        default:
          $ref: '#/components/responses/Problem'
  /settings:
    get:
      operationId: getSettings
      tags: [cluster]
      summary: How every node of the deployment is configured
      description: |
        The settings of every node, its drives and the directories they are in, the certificates it serves, and
        what holds for the deployment as a whole. The node that answers asks every other node as the request is
        served, each at most once and all at the same time, and waits for none of them longer than three
        seconds: the view is live, and nothing of it is stored anywhere.

        **Nothing secret is part of it.** A setting of kind `secret` or `secret-file` is listed with `set` and
        never with a `value`; a setting of kind `url` is given without userinfo, query and fragment; no mount
        option of a file system and nothing of a private key is given. A value is cut at 4096 bytes. Each node
        redacts what it says of itself, and the node that answers redacts all of it again.

        A node that did not answer is listed with `answered: false` and the `reason`, and nothing else. A node
        of an older release, which cannot be asked, has the reason `unsupported`.
      x-cactusfs-action: admin:GetSettings
      responses:
        '200':
          description: The settings of the deployment as the answering node could gather them.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
        '403':
          description: The caller is not allowed `admin:GetSettings`. The refusal is written to the audit trail.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /audit:
    get:
      operationId: listAudit
      tags: [audit]
      summary: Read the audit trail
      x-cactusfs-action: admin:GetAuditLog
      parameters:
        - name: after
          in: query
          description: Return records with a sequence number greater than this.
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
      responses:
        '200':
          description: Records in the order they were written. The chain of hashes is verified before they are returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditPage'
        default:
          $ref: '#/components/responses/Problem'
  /openapi.json:
    get:
      operationId: getOpenAPIJSON
      tags: [meta]
      summary: This document as JSON
      security: []
      responses:
        '200':
          description: The OpenAPI document.
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: '#/components/responses/Problem'
  /openapi.yaml:
    get:
      operationId: getOpenAPIYAML
      tags: [meta]
      summary: This document as YAML
      security: []
      responses:
        '200':
          description: The OpenAPI document.
          content:
            application/yaml:
              schema:
                type: string
        default:
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: An API key, as `<access key ID>:<secret key>`.
    session:
      type: apiKey
      in: cookie
      name: __Host-cactusfs-session
      description: The cookie that signing in sets. Requests that change something also need `X-CSRF-Token`.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: Makes the request safe to repeat. Any string of 1 to 128 printable ASCII characters, unique per request.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[\x21-\x7E]+$'
    CSRFToken:
      name: X-CSRF-Token
      in: header
      description: The CSRF token of the session. Required when the request is made with a session; ignored with an API key.
      schema:
        type: string
        maxLength: 128
    BucketName:
      name: bucket
      in: path
      required: true
      schema:
        type: string
        minLength: 3
        maxLength: 63
    ObjectKey:
      name: key
      in: query
      required: true
      description: The key of the object.
      schema:
        type: string
        minLength: 1
        maxLength: 1024
    EntityName:
      name: name
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Name'
  responses:
    Problem:
      description: The request was not carried out.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Name:
      type: string
      description: The name of a user, group, role or policy.
      minLength: 1
      maxLength: 64
      pattern: '^[A-Za-z0-9][A-Za-z0-9+=,.@_-]*$'
    Problem:
      type: object
      description: Problem details (RFC 9457).
      required: [type, title, status, code]
      properties:
        type:
          type: string
          description: A URI reference that identifies the kind of problem.
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          description: A stable name for the kind of problem, for programs.
        request_id:
          type: string
    SignInRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 1024
    ServerVersion:
      type: object
      description: |
        Which build of CactusFS answered. It is told to a caller who has proved who they are, and to nobody
        else: no answer to a request without a credential names it, and no response header does.
      required: [version, build]
      properties:
        version:
          type: string
          description: The release, a semantic version without a leading "v".
        build:
          type: string
          description: |
            The number of the build: the count of commits it was made from. "0" is a build that was not numbered -
            one made with plain `go build`, say.
        commit:
          type: string
          description: |
            The short hash of the commit the build was made from, followed by "-dirty" when the tree had
            uncommitted changes. Absent when the build does not know it.
    Session:
      type: object
      required: [user, csrf_token, expires_at, server]
      properties:
        user:
          type: string
        csrf_token:
          type: string
          description: Send it back in `X-CSRF-Token` with every request that changes something.
        expires_at:
          type: string
          format: date-time
        server:
          $ref: '#/components/schemas/ServerVersion'
    Identity:
      type: object
      required: [kind, via, server]
      properties:
        server:
          $ref: '#/components/schemas/ServerVersion'
        kind:
          type: string
          enum: [root, user]
        via:
          type: string
          enum: [api_key, session]
        user:
          type: string
        access_key_id:
          type: string
    Bucket:
      type: object
      required: [name, created_at]
      properties:
        name:
          type: string
        created_at:
          type: string
          format: date-time
        details:
          $ref: '#/components/schemas/BucketDetails'
    BucketDetails:
      type: object
      description: |
        What the list of buckets says of one bucket beyond its name, when it was asked for with
        `details=true`: every bucket of such a list has it, and no bucket of any other answer. Each part
        is given as far as the caller may see it of this bucket; a part that is left out was not refused
        and is not audited.
      required: [access_included, policy_included]
      properties:
        access_included:
          type: boolean
          description: |
            True when the caller holds `admin:GetObjectAccess` on the bucket itself and this node keeps
            the record: `activity` is then given, and `created_by` when it was recorded. False otherwise -
            also for a caller who holds the action on objects of the bucket and not on the bucket - and
            then neither is given. True says nothing of any one object: the rows of `activity` are
            decided object by object, and may be none.
        created_by:
          type: string
          description: |
            Who created the bucket, as the audit trail names actors. Absent when it was not recorded -
            the bucket is older than the record - and when `access_included` is false.
        activity:
          $ref: '#/components/schemas/BucketActivity'
        policy_included:
          type: boolean
          description: |
            True when the caller holds `s3:GetBucketPolicy` on the bucket: `policy` then says what the
            bucket's policy is, and is absent when the bucket has none. False otherwise - not permitted,
            or the stored policy of the bucket cannot be read - and then `policy` is absent and says
            nothing of whether there is one.
        policy:
          $ref: '#/components/schemas/BucketPolicySummary'
    BucketActivity:
      type: object
      description: |
        The latest uploads into and downloads from a bucket, newest first, at most three of each. Kept as
        well as can be without making a request wait for it: not an audit trail. An upload has one row a
        key; a download one row for a key, a reader and whether the reader came with a presigned URL.
        The rows outlive the objects they name. A row of an object the caller does not hold
        `admin:GetObjectAccess` on is left out, as `GET /buckets/{bucket}/object/access` would refuse it:
        there may be fewer rows than are kept, or both arrays may be empty, and nothing says how many
        were left out. No older row takes the place of one that is left out.
      required: [uploads, downloads]
      properties:
        uploads:
          type: array
          maxItems: 3
          items:
            $ref: '#/components/schemas/BucketActivityEntry'
        downloads:
          type: array
          maxItems: 3
          items:
            $ref: '#/components/schemas/BucketActivityEntry'
    BucketActivityEntry:
      type: object
      required: [at, by]
      properties:
        at:
          type: string
          format: date-time
          description: |
            When the version was committed, for an upload; for a download, when the node that served it
            handed its count over, which is up to a flush interval after the bytes left.
        by:
          type: string
          description: |
            Who uploaded or downloaded, as the audit trail names actors, or `anonymous`. Empty for an
            upload whose uploader was not recorded; never empty for a download.
        key:
          type: string
          description: |
            The key of the object, which may have been deleted since. Absent when the caller does not
            hold `s3:ListBucket` on the bucket.
        presigned:
          type: boolean
          description: |
            Present and true for a download made with a URL that `by` signed: whoever held the URL made
            it, not necessarily the signer.
    BucketPolicySummary:
      type: object
      description: What a bucket's policy is, without what it says.
      required: [statements, open_to_anyone]
      properties:
        statements:
          type: integer
          minimum: 0
          description: How many statements the policy has.
        open_to_anyone:
          type: boolean
          description: |
            True when some statement of the policy allows something to every caller: an `Allow` whose
            principal is `*`. It classifies the document and decides nothing - conditions and `Deny`
            statements are not weighed, and it does not say that callers who have not authenticated are
            let in: a statement that allows every caller `s3:PutObject` sets it, and nobody writes
            without authenticating.
    BucketCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 63
    ObjectSummary:
      type: object
      required: [key, size, etag, last_modified]
      properties:
        key:
          type: string
        size:
          type: integer
          format: int64
        etag:
          type: string
        last_modified:
          type: string
          format: date-time
        access:
          $ref: '#/components/schemas/ObjectAccessSummary'
    ObjectAccessSummary:
      type: object
      description: |
        Who uploaded the current version of an object and how often it was read, as a listing carries it:
        the figures of `ObjectAccess` without the readers. Best-effort counts, not an audit trail. Present
        on an object only in a listing that was asked for with `access=true`, and only where the caller
        holds `admin:GetObjectAccess` on the object.
      required: [uploaded_at, download_count, copy_count]
      properties:
        uploaded_by:
          type: string
          description: Who uploaded the version, as the audit trail names actors. Absent when it was not recorded.
        uploaded_at:
          type: string
          format: date-time
        download_count:
          type: integer
          format: int64
          minimum: 0
          description: Downloads of the version, every ranged request counted by itself.
        copy_count:
          type: integer
          format: int64
          minimum: 0
          description: How often the version was the source of a copy.
        last_downloaded_at:
          type: string
          format: date-time
          description: When the last download or copy was recorded. Absent when there was none.
    BucketUsage:
      type: object
      required: [object_count, total_size, complete]
      properties:
        object_count:
          type: integer
          format: int64
          minimum: 0
          description: Objects in the bucket (current versions; delete markers are not objects).
        total_size:
          type: integer
          format: int64
          minimum: 0
          description: Their sizes added up, in bytes.
        complete:
          type: boolean
          description: False when the bucket has more objects than are counted in one request.
    ObjectList:
      type: object
      required: [objects, common_prefixes, truncated, access_included]
      properties:
        objects:
          type: array
          items:
            $ref: '#/components/schemas/ObjectSummary'
        access_included:
          type: boolean
          description: |
            True only when the listing was asked for with `access=true` and the caller holds
            `admin:GetObjectAccess` on the bucket or on at least one object of this page: the objects the
            caller holds it on then carry `access`. False otherwise - not asked for, not permitted, or a
            node that keeps no such record - and then no object carries `access`.
        common_prefixes:
          type: array
          items:
            type: string
        truncated:
          type: boolean
        next_continuation_token:
          type: string
    ObjectMetadata:
      type: object
      required: [bucket, key, size, etag, last_modified, content_type, encryption]
      properties:
        bucket:
          type: string
        key:
          type: string
        size:
          type: integer
          format: int64
        etag:
          type: string
        last_modified:
          type: string
          format: date-time
        content_type:
          type: string
        encryption:
          type: string
          description: How the object is encrypted at rest.
    ObjectReader:
      type: object
      required: [who, presigned, downloads, copies, last_at]
      properties:
        who:
          type: string
          description: The reader, as the audit trail names actors - `root`, `user/<name>`, `key/<access key ID>` or `anonymous`.
        presigned:
          type: boolean
          description: |
            True for reads made with URLs this reader signed: whoever held the URL read, not necessarily the
            signer.
        downloads:
          type: integer
          format: int64
          minimum: 0
        copies:
          type: integer
          format: int64
          minimum: 0
        last_at:
          type: string
          format: date-time
          description: When the last of this reader's reads was recorded.
    ObjectAccess:
      type: object
      description: |
        Who uploaded a version of an object and who read it. Best-effort counts, not an audit trail.
      required: [uploaded_at, download_count, copy_count, readers, other_readers, other_downloads, other_copies]
      properties:
        uploaded_by:
          type: string
          description: Who uploaded the version, as the audit trail names actors. Absent when it was not recorded.
        uploaded_at:
          type: string
          format: date-time
        download_count:
          type: integer
          format: int64
          minimum: 0
          description: Downloads of the version, every ranged request counted by itself.
        copy_count:
          type: integer
          format: int64
          minimum: 0
          description: How often the version was the source of a copy.
        last_downloaded_at:
          type: string
          format: date-time
          description: When the last download or copy was recorded. Absent when there was none.
        readers:
          type: array
          maxItems: 32
          description: The readers kept by name. Beyond 32, whoever read longest ago is counted among the others.
          items:
            $ref: '#/components/schemas/ObjectReader'
        other_readers:
          type: integer
          format: int64
          minimum: 0
          description: Readers who are no longer kept by name.
        other_downloads:
          type: integer
          format: int64
          minimum: 0
        other_copies:
          type: integer
          format: int64
          minimum: 0
    SearchResult:
      type: object
      required: [kind, bucket]
      properties:
        kind:
          type: string
          enum: [bucket, object]
          description: What was found - a bucket, by its name, or an object, by its key.
        bucket:
          type: string
          description: The bucket, or the bucket of the object.
        key:
          type: string
          description: The key of the object. A bucket has none.
        size:
          type: integer
          format: int64
          minimum: 0
          description: The size of the object, in bytes.
        last_modified:
          type: string
          format: date-time
          description: When the object was stored.
        etag:
          type: string
          description: The entity tag of the object.
    SearchResults:
      type: object
      required: [results, match, examined, complete]
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/SearchResult'
        match:
          type: string
          enum: [substring, wildcard, regex]
          description: How `q` was read.
        examined:
          type: integer
          minimum: 0
          description: How many keys this request looked at.
        complete:
          type: boolean
          description: False when a bound stopped the request before it had looked at everything.
        next_continuation:
          type: string
          description: Where to go on, when `complete` is false.
    User:
      type: object
      required: [name, groups, roles, disabled, has_password, created_at]
      properties:
        name:
          $ref: '#/components/schemas/Name'
        groups:
          type: array
          items:
            $ref: '#/components/schemas/Name'
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Name'
        disabled:
          type: boolean
        has_password:
          type: boolean
          description: Whether the user can sign in to the console.
        created_at:
          type: string
          format: date-time
    UserCreate:
      type: object
      required: [name]
      properties:
        name:
          $ref: '#/components/schemas/Name'
        groups:
          type: array
          maxItems: 64
          items:
            $ref: '#/components/schemas/Name'
        roles:
          type: array
          maxItems: 64
          items:
            $ref: '#/components/schemas/Name'
        disabled:
          type: boolean
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 12
          maxLength: 1024
    UserUpdate:
      type: object
      required: [groups, roles, disabled]
      properties:
        groups:
          type: array
          maxItems: 64
          items:
            $ref: '#/components/schemas/Name'
        roles:
          type: array
          maxItems: 64
          items:
            $ref: '#/components/schemas/Name'
        disabled:
          type: boolean
        password:
          type: string
          format: password
          writeOnly: true
          description: When given, replaces the console password.
          minLength: 12
          maxLength: 1024
    Group:
      type: object
      required: [name, roles, created_at]
      properties:
        name:
          $ref: '#/components/schemas/Name'
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Name'
        created_at:
          type: string
          format: date-time
    GroupCreate:
      type: object
      required: [name, roles]
      properties:
        name:
          $ref: '#/components/schemas/Name'
        roles:
          type: array
          maxItems: 64
          items:
            $ref: '#/components/schemas/Name'
    GroupUpdate:
      type: object
      required: [roles]
      properties:
        roles:
          type: array
          maxItems: 64
          items:
            $ref: '#/components/schemas/Name'
    Role:
      type: object
      required: [name, policies, built_in, created_at]
      properties:
        name:
          $ref: '#/components/schemas/Name'
        policies:
          type: array
          items:
            $ref: '#/components/schemas/Name'
        built_in:
          type: boolean
        created_at:
          type: string
          format: date-time
    RoleCreate:
      type: object
      required: [name, policies]
      properties:
        name:
          $ref: '#/components/schemas/Name'
        policies:
          type: array
          maxItems: 64
          items:
            $ref: '#/components/schemas/Name'
    RoleUpdate:
      type: object
      required: [policies]
      properties:
        policies:
          type: array
          maxItems: 64
          items:
            $ref: '#/components/schemas/Name'
    PolicyDocument:
      type: object
      description: A policy in the IAM policy language (Version, Statement with Effect, Action, Resource, Condition).
      additionalProperties: true
    Policy:
      type: object
      required: [name, document, built_in, created_at]
      properties:
        name:
          $ref: '#/components/schemas/Name'
        document:
          $ref: '#/components/schemas/PolicyDocument'
        built_in:
          type: boolean
        created_at:
          type: string
          format: date-time
    PolicyCreate:
      type: object
      required: [name, document]
      properties:
        name:
          $ref: '#/components/schemas/Name'
        document:
          $ref: '#/components/schemas/PolicyDocument'
    PolicyUpdate:
      type: object
      required: [document]
      properties:
        document:
          $ref: '#/components/schemas/PolicyDocument'
    APIKey:
      type: object
      required: [access_key_id, owner, description, created_at]
      properties:
        access_key_id:
          type: string
        owner:
          $ref: '#/components/schemas/Name'
        description:
          type: string
        inline_policy:
          $ref: '#/components/schemas/PolicyDocument'
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
    APIKeyCreate:
      type: object
      properties:
        description:
          type: string
          maxLength: 256
        inline_policy:
          $ref: '#/components/schemas/PolicyDocument'
        expires_at:
          type: string
          format: date-time
    APIKeyCreated:
      type: object
      required: [key, secret_key]
      properties:
        key:
          $ref: '#/components/schemas/APIKey'
        secret_key:
          type: string
          format: password
          description: Shown once. It cannot be had again.
    NodeLabels:
      type: object
      properties:
        region:
          type: string
        zone:
          type: string
        rack:
          type: string
        host:
          type: string
    Node:
      type: object
      required: [id, roles, labels, leader]
      properties:
        id:
          type: string
        roles:
          type: array
          items:
            type: string
        labels:
          $ref: '#/components/schemas/NodeLabels'
        leader:
          type: boolean
          description: Whether the node leads the metadata group.
        metadata_version:
          type: integer
    Drive:
      type: object
      required: [id, node_id, state]
      properties:
        id:
          type: string
        node_id:
          type: string
        state:
          type: string
          enum: [online, offline]
    ErasureSet:
      type: object
      required: [index, drives]
      properties:
        index:
          type: integer
        drives:
          type: array
          items:
            $ref: '#/components/schemas/Drive'
    ClusterStatus:
      type: object
      required: [deployment_id, answered_by, server, leader, nodes, erasure_sets, node_failures_tolerated, drives_online, drives_total]
      properties:
        deployment_id:
          type: string
        answered_by:
          type: string
          description: |
            The node that answered. `server` is its build; the builds of the other nodes are not known to it:
            during a rolling upgrade, ask each node.
        server:
          $ref: '#/components/schemas/ServerVersion'
        leader:
          type: string
          description: The node that leads the metadata group, or empty when there is none.
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/Node'
        erasure_sets:
          type: array
          items:
            $ref: '#/components/schemas/ErasureSet'
        node_failures_tolerated:
          type: integer
        drives_online:
          type: integer
        drives_total:
          type: integer
    Settings:
      type: object
      description: |
        How the deployment is configured, read from its nodes as the request was served. Nothing of it is
        stored.
      required: [answered_by, cluster, nodes, mismatches]
      properties:
        answered_by:
          type: string
          description: The node that answered and asked the others.
        cluster:
          $ref: '#/components/schemas/SettingsCluster'
        nodes:
          type: array
          description: Every node of the deployment, by ID, with its answer or the reason there is none.
          items:
            $ref: '#/components/schemas/NodeSettings'
        mismatches:
          type: array
          description: |
            The settings of scope `cluster` in which the nodes that answered differ, by name. Besides the
            settings, `kms-key-id` and `version` are compared. Empty when the nodes agree, and when fewer than
            two answered.
          items:
            $ref: '#/components/schemas/SettingsMismatch'
    SettingsCluster:
      type: object
      description: |
        What holds for the deployment as a whole, from the replicated record of the answering node and its part
        of the metadata group. A node that runs on its own is a deployment of one node.
      required: [deployment_id, metadata_level, nodes, voters, erasure_sets]
      properties:
        deployment_id:
          type: string
          description: Empty while the deployment has no drive topology.
        metadata_level:
          type: integer
          description: |
            The format of metadata entry the deployment writes now: the newest every member of the metadata
            group can apply, as the metadata store of the answering node works it out - the number its metric
            `cactusfs_metadata_schema_level` shows. A member that has not said what it can apply holds the level
            back. It is 1 or more; when it cannot be read there is no answer, and the request fails.
        leader:
          type: string
          description: The node that leads the metadata group. Absent when there is none.
        nodes:
          type: integer
          description: |
            How many nodes are recorded. 1 when none is: the answering node, which runs on its own.
        voters:
          type: integer
          description: |
            How many of them have the role `meta` and vote in the metadata group. 1 when no node is recorded: a
            node on its own is the one member of its metadata group.
        erasure_sets:
          type: array
          items:
            $ref: '#/components/schemas/SettingsErasureSet'
    SettingsErasureSet:
      type: object
      description: The coding of one erasure set.
      required: [index, drives, data, parity, read_quorum, write_quorum]
      properties:
        index:
          type: integer
        drives:
          type: integer
          description: The number of drives in the set.
        data:
          type: integer
          description: The number of data shards of an object.
        parity:
          type: integer
          description: The number of parity shards; as many drives can be lost.
        read_quorum:
          type: integer
        write_quorum:
          type: integer
    NodeSettings:
      type: object
      description: |
        What one node says of itself. A node that did not answer has `node_id`, `answered: false` and `reason`
        and nothing else; one that answered has no `reason`, and has `roles`, `labels`, `settings`, `drives`
        and `certificates`, each of which may be empty.
      required: [node_id, answered]
      properties:
        node_id:
          type: string
        answered:
          type: boolean
        reason:
          type: string
          description: |
            Why the node did not answer: it could not be reached (`unreachable`), it did not answer in time
            (`timeout`), it is of a release that cannot be asked (`unsupported`), or it was reached and could
            not answer (`failed`). The cause itself is in the log of the answering node, not here.
          enum: [unreachable, timeout, unsupported, failed]
        roles:
          type: array
          description: The roles the node runs.
          items:
            type: string
        labels:
          type: object
          description: The placement labels that are set, by name - `region`, `zone`, `rack`, `host`.
          additionalProperties:
            type: string
        server:
          $ref: '#/components/schemas/ServerVersion'
        started_at:
          type: string
          format: date-time
          description: When the process started.
        kms_key_id:
          type: string
          description: The name of the key that wraps data keys. A name, never key material.
        settings:
          type: array
          description: The settings of the node, by name.
          items:
            $ref: '#/components/schemas/Setting'
        drives:
          type: array
          description: The drives of the node, by ID.
          items:
            $ref: '#/components/schemas/DriveSettings'
        metadata:
          $ref: '#/components/schemas/SettingsVolume'
        certificates:
          type: array
          items:
            $ref: '#/components/schemas/SettingsCertificate'
    Setting:
      type: object
      description: One setting of one node, as it may be shown.
      required: [name, kind, scope, source, set]
      properties:
        name:
          type: string
          description: The name of the setting, which is that of its flag where it has one.
        env:
          type: string
          description: The environment variable that sets it.
        flag:
          type: string
          description: The flag that sets it, without dashes. A secret has none.
        group:
          type: string
          description: The heading the setting is listed under.
        kind:
          type: string
          description: |
            What the value is, and with that how much of it is shown: `plain`, `path`, `url` (shown without
            userinfo, query and fragment), `secret` or `secret-file` (never shown). The list is not closed: a
            node of a newer release may name a kind this document does not, and its value is then never
            shown either. Read a kind you do not know as a secret.
        scope:
          type: string
          description: |
            Whose the setting is: `node` for what each node has for itself, `cluster` for what must be the
            same on every node. A newer release may add to the list.
        source:
          type: string
          description: |
            How the value arrived: `default`, `environment`, `flag`, or `derived` from other settings. A newer
            release may add to the list.
        set:
          type: boolean
          description: Whether the setting has a value. For the kinds `secret` and `secret-file` it is all that is told.
        value:
          type: string
          maxLength: 4096
          description: |
            The redacted value. Never present for the kinds `secret` and `secret-file`, nor for a kind that is
            not known; absent when there is nothing to show.
    SettingsFilesystem:
      type: object
      description: |
        The file system behind a directory, where the node can tell - on Linux. Mount options are never given.
      required: [type, device, mount_point]
      properties:
        type:
          type: string
        device:
          type: string
          description: What is mounted, without any credential it names.
        mount_point:
          type: string
          description: Where it is mounted, as the node sees it.
    SettingsVolume:
      type: object
      description: A directory a node stores in.
      required: [directory, total_bytes, free_bytes]
      properties:
        directory:
          type: string
          description: The directory as the node sees it - inside a container, the path in the container.
        filesystem:
          $ref: '#/components/schemas/SettingsFilesystem'
        total_bytes:
          type: integer
          format: int64
          minimum: 0
        free_bytes:
          type: integer
          format: int64
          minimum: 0
    DriveSettings:
      type: object
      description: One drive of a node - where it is and what it belongs to.
      required: [id, directory, total_bytes, free_bytes, online]
      properties:
        id:
          type: string
        directory:
          type: string
          description: The directory as the node sees it - inside a container, the path in the container.
        label:
          type: string
          description: What the deployment calls the volume, as the node was told. Absent when it was told nothing.
        filesystem:
          $ref: '#/components/schemas/SettingsFilesystem'
        total_bytes:
          type: integer
          format: int64
          minimum: 0
        free_bytes:
          type: integer
          format: int64
          minimum: 0
        online:
          type: boolean
          description: Whether the node can use the drive.
        erasure_set:
          type: integer
          minimum: 0
          description: The index of the erasure set the drive is in. Absent for a drive that is in none.
    SettingsCertificate:
      type: object
      description: What may be said of a certificate a node serves - who it names and until when. Nothing of the key.
      required: [use, subject, issuer, dns_names, ip_addresses, not_before, not_after]
      properties:
        use:
          type: string
          description: |
            `s3` for the certificate of the listeners clients reach, `node` for the one a node shows other
            nodes. A newer release may add to the list.
        subject:
          type: string
        issuer:
          type: string
        dns_names:
          type: array
          items:
            type: string
        ip_addresses:
          type: array
          items:
            type: string
        not_before:
          type: string
          format: date-time
        not_after:
          type: string
          format: date-time
    SettingsMismatch:
      type: object
      description: A setting that should be the same on every node and is not.
      required: [setting, values]
      properties:
        setting:
          type: string
          description: The name of the setting, or `kms-key-id` or `version`.
        values:
          type: array
          description: What each node that answered has, by node ID.
          items:
            $ref: '#/components/schemas/SettingsMismatchValue'
    SettingsMismatchValue:
      type: object
      required: [node_id, value]
      properties:
        node_id:
          type: string
        value:
          type: string
          description: |
            The redacted value; `set` or `not set` for a secret; empty, or `not set` for a secret, on a node
            that does not have the setting.
    ScrubStatus:
      type: object
      required: [passes, objects, damaged, shards_rebuilt, unrecoverable, bytes]
      properties:
        passes:
          type: integer
          format: int64
        last_pass_at:
          type: string
          format: date-time
        objects:
          type: integer
          format: int64
          description: Objects checked in the last pass.
        damaged:
          type: integer
          format: int64
        shards_rebuilt:
          type: integer
          format: int64
        unrecoverable:
          type: integer
          format: int64
        bytes:
          type: integer
          format: int64
    HealStatus:
      type: object
      required: [objects, shards_rebuilt, unrecoverable]
      properties:
        objects:
          type: integer
          format: int64
          description: Objects found damaged since the node started.
        shards_rebuilt:
          type: integer
          format: int64
        unrecoverable:
          type: integer
          format: int64
    CollectionStatus:
      type: object
      required: [passes, shards, removed]
      properties:
        passes:
          type: integer
          format: int64
        last_pass_at:
          type: string
          format: date-time
        shards:
          type: integer
          format: int64
          description: Shards looked at in the last pass.
        removed:
          type: integer
          format: int64
    MaintenanceStatus:
      type: object
      required: [node_id, started_at, scrub, heal, collection]
      properties:
        node_id:
          type: string
        started_at:
          type: string
          format: date-time
        scrub:
          $ref: '#/components/schemas/ScrubStatus'
        heal:
          $ref: '#/components/schemas/HealStatus'
        collection:
          $ref: '#/components/schemas/CollectionStatus'
    AuditRecord:
      type: object
      required: [sequence, time, actor, action, resource, outcome, hash, previous_hash]
      properties:
        sequence:
          type: integer
          format: int64
        time:
          type: string
          format: date-time
        actor:
          type: string
        access_key_id:
          type: string
        action:
          type: string
        resource:
          type: string
        outcome:
          type: string
        source_ip:
          type: string
        request_id:
          type: string
        details:
          type: object
          additionalProperties:
            type: string
        previous_hash:
          type: string
        hash:
          type: string
    AuditPage:
      type: object
      required: [records]
      properties:
        records:
          type: array
          items:
            $ref: '#/components/schemas/AuditRecord'
        next_after:
          type: integer
          format: int64
          description: Pass it as `after` for the next page. Absent on the last page.
