  /buckets/{bucket}/object/access:
    get:
      operationId: getObjectAccess
      tags: [objects]
      summary: Get who uploaded an object and who downloaded it
      description: |
        Who uploaded the object and when, how often it was downloaded and used as the source of a copy, and
        by whom. The figures are best-effort counts, not an audit trail: every node counts in memory and hands
        its counts over every half a minute or so, a node that crashes loses what it had not handed over, and
        a transfer that was cut short counts like a whole one. They are counts of one version - in a bucket
        that keeps no versions an overwrite starts again at zero. Reading the object does not give the
        permission to see them.
      x-cactusfs-action: admin:GetObjectAccess
      parameters:
        - $ref: '#/components/parameters/BucketName'
        - $ref: '#/components/parameters/ObjectKey'
        - name: version_id
          in: query
          description: The version to ask about - `null`, or the ID of a version. Without it, the current version.
          schema:
            type: string
            pattern: '^(null|[0-9a-f]{32})$'
      responses:
        '200':
          description: What is known of the uploading and the reading of the object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectAccess'
        default:
          $ref: '#/components/responses/Problem'
  /buckets/{bucket}/object/preview:
    get:
      operationId: previewObject
      tags: [objects]
      summary: Get an object's bytes for the console to show
      description: |
        The bytes of an object version for the console to draw itself, when the object is of a kind it shows:
        an image (PNG, JPEG, GIF, WebP), a PDF, a Word document (DOCX), an Excel workbook (XLSX), or text, CSV
        or JSON. The answer is always `application/octet-stream` and an attachment, whatever the object is:
        `X-CactusFS-Preview-Kind` says what it is, and nothing of it is ever rendered by the browser on the
        console's origin.

        **Who may.** The caller needs `s3:GetObject` on the object - `s3:GetObjectVersion` when `version_id`
        is given - because a preview is never more than a download, AND either `admin:PreviewObject` on it or
        to own the version shown. The owner is the user who uploaded that version - by a console session or by
        one of their API keys; the root identity and keys that belong to no user own nothing, and a version
        uploaded before its uploader was recorded has no owner. An explicit Deny of `admin:PreviewObject`
        refuses the owner as well, an API key's own policy must allow both actions, and a locked session
        previews nothing. A refusal is written to the audit trail; a preview is not, and counts as a
        download.

        **What kind of thing it is** is decided from the type the object was stored with AND the signature
        of its first bytes, never from its key: both must say the same. A stored type of
        `application/octet-stream`, or none, lets the bytes decide for images and PDF only. SVG, HTML, XML,
        script and every type not listed are never previewed (415).

        **Bounds.** An object larger than the node's `preview-max-size` (32 MiB unless configured) is refused
        with 413 before any of it is read - but for text, CSV and JSON, of which the first 1 MiB is sent and
        `X-CactusFS-Preview-Truncated` says whether there is more. An image may have at most 16 384 pixels on
        a side and 40 megapixels in all, read from its header (413 when it has more, 415 when its size is not
        found in its first 256 KiB). A GIF frame that reaches past the GIF's screen is refused: when such a
        frame begins later in the object, the transfer is cut off there, and the answer is shorter than its
        `Content-Length` - an error, never a shorter image. A caller has at most 2 previews running at once and
        a node 16; beyond, the answer is 429 with `Retry-After`. There is no `Range`.

        An object encrypted with a customer key (SSE-C) cannot be previewed: this API never holds the key
        (409, `code` `CustomerKeyRequired`).
      x-cactusfs-action: admin:PreviewObject
      parameters:
        - $ref: '#/components/parameters/BucketName'
        - $ref: '#/components/parameters/ObjectKey'
        - name: version_id
          in: query
          description: The version to show - `null`, or the ID of a version. Without it, the current version.
          schema:
            type: string
            pattern: '^(null|[0-9a-f]{32})$'
      responses:
        '200':
          description: The bytes of the version, or the first 1 MiB of them for text, CSV and JSON.
          headers:
            X-CactusFS-Preview-Kind:
              description: What the object is shown as. Values are only ever added to.
              required: true
              schema:
                $ref: '#/components/schemas/PreviewKind'
            X-CactusFS-Preview-Truncated:
              description: Whether the object has more bytes than were sent (text, CSV and JSON only).
              required: true
              schema:
                type: boolean
            Content-Length:
              required: true
              schema:
                type: integer
                format: int64
            ETag:
              description: The entity tag of the version shown.
              required: true
              schema:
                type: string
            Content-Disposition:
              description: Always `attachment`.
              required: true
              schema:
                type: string
            Content-Security-Policy:
              description: Always `sandbox; default-src 'none'`.
              required: true
              schema:
                type: string
            Cross-Origin-Resource-Policy:
              description: Always `same-origin`.
              required: true
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '403':
          description: |
            The caller may not download the object, or neither owns the version nor is allowed
            `admin:PreviewObject` on it (`code` is `AccessDenied`). The refusal is written to the audit trail.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: There is no such bucket, object or version (`code` is `NoSuchBucket`, `NoSuchObject` or `NoSuchVersion`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: |
            The object is encrypted with a customer key (SSE-C), which this API never holds (`code` is
            `CustomerKeyRequired`). It can be downloaded through the S3 API with its key.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          description: |
            The object is larger than a preview may be, or the image has more pixels than a preview may have
            (`code` is `PreviewTooLarge`). Nothing of the object was sent; it can be downloaded.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '415':
          description: |
            The object is not of a kind the console shows, or its stored type and its bytes do not agree
            (`code` is `NotPreviewable`). Nothing of the object was sent; it can be downloaded.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '423':
          description: The session is locked (`code` is `SessionLocked`); a locked session previews nothing.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: |
            The caller has 2 previews running already, or the node 16 (`code` is `TooManyRequests`). Nothing
            was read; the same request can be sent again.
          headers:
            Retry-After:
              description: After how many seconds to send the request again.
              schema:
                type: integer
                minimum: 1
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /search:
    get:
      operationId: search
      tags: [search]
      summary: Search buckets and objects by name
      description: |
        Finds the buckets whose name, and the objects whose key, answer to `q`.

        **What is searched.** Only what the caller may list: the name of a bucket is a result for who may list
        the buckets (`s3:ListAllMyBuckets`), and the keys of a bucket are searched for who may list that bucket
        (`s3:ListBucket`, the bucket's own policy included). Buckets the caller may not list are passed over
        without a word. Who may list neither the buckets nor any bucket is refused with 403, as is a `bucket`
        the caller may not list. Current versions are searched; an object that was deleted is not found.

        **The query** is read in one of three ways.
        Plain text is found anywhere in a name, whatever its case: `report` finds `2025/Annual-Report.pdf`.
        Text with `*` or `?` in it is a pattern for the whole name, whatever its case: `*` stands for any run
        of characters, `/` included, and `?` for exactly one, so `*.pdf` finds every key that ends so.
        Text that begins with `rx:` is a regular expression in the RE2 syntax, taken as written - case and
        all - and found anywhere in a name unless it anchors itself: `rx:^logs/\d{4}/`. A regular expression
        that cannot be read is refused with 400, and `detail` says what the matter with it is.

        **Bounds.** One request looks at no more than 50 000 keys and 200 buckets, for no more than two
        seconds, and returns no more than `limit` results. When a bound stops it, `complete` is false and
        `next_continuation` goes on from there: send it as `continuation` with the same `q` and `bucket`.
        A page can be empty and still not be the last. Only buckets the caller may see count, and only such
        a bucket is where a page stops: `examined`, `complete` and the number of pages say nothing of the
        others. A caller runs one search at a time and a node eight; beyond that the answer is 429 with
        `Retry-After`.

        **What a page costs.** Before it looks at a key, every page decides again which buckets are the
        caller's to see - all of them, whatever `continuation` says - from the bucket policies as the node
        that answers has them, read page by page. That takes time in proportion to the number of buckets
        there are and the size of their policies, not to how many of them the caller may see nor to where the
        page begins. The node remembers what a policy says for as long as the policy does not change, so a
        page checks every policy and reads anew only those that changed: some 0.2 seconds for 5 000 buckets
        whose policies are 16 KiB each, 0.1 for 20 000 with policies of 1 KiB, on the machine it was measured
        on.

        **503 from a search.** Deciding counts towards the two seconds. When it takes them all, the answer is
        503 with `Retry-After: 1` and a `detail` that says so, and no part of an answer. That 503 has two
        causes, and only one of them passes. A node that was started not long ago remembers nothing yet and
        reads every policy in full - some ten times the work, 2.6 seconds for the 5 000 buckets above - but
        keeps what it has read when it gives up, so the same request sent again gets further and is soon
        answered. Past a size of the deployment, though, the two seconds are not enough even then: about
        10 000 buckets with policies of 16 KiB, or 150 000 with policies of 1 KiB, on that machine (the node
        remembers 128 MiB of policies and reads the others in full on every page). There the 503 is a limit
        and repeating the request does not help: search a `bucket` by name, which decides that bucket alone.
        The root identity is bound by no bucket policy, reads none, and is not subject to this.

        A `continuation` says where to go on and grants nothing. It is refused with 400 when it is not one
        this API gave out for the same `q` and `bucket`.

        Results come in order: buckets by name, each followed by its objects by key. A search is a read and
        leaves no audit record.
      x-cactusfs-action: s3:ListBucket
      parameters:
        - name: q
          in: query
          required: true
          description: What to search for - text, a wildcard, or `rx:` and a regular expression.
          schema:
            type: string
            minLength: 1
            maxLength: 256
        - name: bucket
          in: query
          description: Search the keys of this bucket only. Its name is then no result.
          schema:
            type: string
            minLength: 3
            maxLength: 63
        - name: continuation
          in: query
          description: The `next_continuation` of the previous page.
          schema:
            type: string
            maxLength: 4096
        - name: limit
          in: query
          description: The most results to return.
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        '200':
          description: One page of what was found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResults'
        '429':
          description: |
            The caller has a search running already, or the node is running as many as it runs at a time
            (`code` is `TooManyRequests`). Nothing was searched; the same request can be sent again.
          headers:
            Retry-After:
              description: After how many seconds to send the request again.
              schema:
                type: integer
                minimum: 1
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'
