openapi: 3.0.3
info:
  title: CactusFS management API
  version: 1.0.0
  description: |
    The management API of CactusFS: buckets and objects, users, groups, roles,
    policies and API keys, the state of the cluster, and the audit trail; the
    quota of a bucket, the targets the deployment sends to, and the
    notifications and the replication of a bucket.

    **Authentication.** Every request is authenticated, except signing in and
    fetching this document. Send an API key as a bearer credential,
    `Authorization: Bearer <access key ID>:<secret key>`, or - from the
    console - the session cookie that signing in sets. A request made with a
    session that changes something must also carry the CSRF token of that
    session in `X-CSRF-Token`.

    **Authorization.** Every request is decided by the same authorizer as the
    S3 API, from the policies of the user. What a request needs is named in
    each operation as `x-cactusfs-action`.

    **Errors** are `application/problem+json` (RFC 9457).

    **A locked session.** A console session that reaches its timeout while its
    user is uploading objects is not ended: it is locked. A locked session may
    store objects (`putObject`), read its own state (`getSession`), unlock
    (`unlockSession`) and sign out (`signOut`). Every other operation answers
    423 with the problem code `SessionLocked` - not 401, which says that the
    session is gone. The password of the session's user unlocks it. A session
    is locked no longer than the uploads last and a moment more, and no longer
    than the deployment allows; then it has ended, and the answer is 401. An
    API key is never locked. What is wrong with a request whoever sent it is
    still said first: 400, 404, 415 and 501 are answered to a locked session
    as to any other.

    **A changed password** ends every console session of the user, at once,
    that of the user who changed it included: the next request answers 401.

    **Idempotency.** Every request that changes something accepts
    `Idempotency-Key`. A request repeated with the same key and the same
    content gets the answer the first one got, and changes nothing again; with
    the same key and other content it is refused with 422; while the first is
    still being carried out it is refused with 409. Keys are kept for 24 hours.
    A locked session is given no answer that was kept, and none of its
    answers is: with a key or without, it is answered 423 - but for an upload,
    whose repeat is answered as ever. A request whose body may hold a secret
    (`createUser`, `updateUser`, `putTarget`) is recognised again by a slow
    hash of the body, never by the body or a plain hash of it; when that hash
    cannot be made at once the request is answered 429 with `Retry-After`,
    and nothing is reserved.
servers:
  - url: /api/v1
security:
  - apiKey: []
  - session: []
tags:
  - name: session
    description: Signing in to the console and out of it.
  - name: buckets
  - name: objects
  - name: search
    description: Finding buckets and objects by name.
  - name: users
  - name: groups
  - name: roles
  - name: policies
  - name: keys
    description: API keys.
  - name: targets
    description: The places outside the deployment that it sends to - webhooks, NATS servers, other deployments.
  - name: cluster
  - name: audit
  - name: meta
    description: This document.
paths:
  /session:
    post:
      operationId: signIn
      tags: [session]
      summary: Sign in to the console
      description: |
        Checks a user name and password and starts a session. The session token is set as an HttpOnly cookie;
        the CSRF token is returned once, here. `Idempotency-Key` is accepted and has no effect: an answer that
        holds a session is never given twice, so repeating a sign-in starts another session.
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInRequest'
      responses:
        '200':
          description: Signed in.
          headers:
            Set-Cookie:
              description: The session cookie.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        default:
          $ref: '#/components/responses/Problem'
    get:
      operationId: getSession
      tags: [session]
      summary: Who is making this request
      description: |
        The identity of the caller. For a console session it also says when the session reaches its timeout
        and whether it is locked. A locked session can ask this.
      responses:
        '200':
          description: The identity of the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Identity'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: signOut
      tags: [session]
      summary: Sign out
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204':
          description: Signed out. The cookie is cleared.
          headers:
            Set-Cookie:
              description: Clears the session cookie.
              schema:
                type: string
        default:
          $ref: '#/components/responses/Problem'
  /session/unlock:
    post:
      operationId: unlockSession
      tags: [session]
      summary: Unlock the session with the user's password
      description: |
        Checks the password of the user the session belongs to - no user name is taken - and gives the session
        its full authority back, for another lifetime. The session gets a new token, set as the cookie, and a
        new CSRF token, returned once, here; the tokens it had are refused from then on. It is accepted on a
        session that is not locked too, and does the same.

        A password that is not accepted answers 403 with the code `AccessDenied` - not 401 - and the session
        stays as it was. Too many attempts from one address answer 429 with the code `TooManyAttempts` and
        `Retry-After`, as at sign-in: failed sign-ins and failed unlocks are counted together. After too many
        wrong passwords for one session the session is ended: the answer is then 401 and the cookie is
        cleared. A session that had ended before is answered 401 as well, and the cookie is left alone.
        A request made with an API key answers 400: a key has nothing to unlock.

        Send it once. The tokens the request came with are refused the moment it has succeeded: the same
        request sent again answers 401, although the session lives on under the tokens of the first answer.

        `Idempotency-Key` is accepted and has no effect: nothing of a request that holds a password is kept,
        and an answer that holds a session is never given twice.
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnlockRequest'
      responses:
        '200':
          description: Unlocked. The session has a new token and a new CSRF token.
          headers:
            Set-Cookie:
              description: The session cookie, with the new token.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        default:
          $ref: '#/components/responses/Problem'
  /buckets:
    get:
      operationId: listBuckets
      tags: [buckets]
      summary: List buckets
      description: |
        Every bucket, in name order. With `details=true` every bucket also carries `details`: who created
        it and its latest uploads and downloads, where the caller holds `admin:GetObjectAccess` on that
        bucket - the keys of the objects only where the caller holds `s3:ListBucket` on it as well - and a
        summary of the bucket's policy, where the caller holds `s3:GetBucketPolicy` on it. Every upload
        and download is of an object, and is additionally decided for that object as
        `GET /buckets/{bucket}/object/access` decides it: a row is given only where the caller holds
        `admin:GetObjectAccess` on its key, and is otherwise left out whole - who, when and key - so a
        policy that denies the action by key holds here too. The action is required on the bucket as
        well: a caller who holds it on objects only is given `access_included: false` and no row, which
        is stricter than the object list's `access_included`. Those
        permissions decide only what the list carries, bucket by bucket: a caller without them is given
        the same list with `access_included: false` or `policy_included: false`. The list is authorized
        as it is without `details`, is never refused for want of those permissions, and nothing is written
        to the audit trail for a part that is left out; where a part may be shown and cannot be read, the
        list fails as any read that fails does.
      x-cactusfs-action: s3:ListAllMyBuckets
      parameters:
        - name: details
          in: query
          description: |
            Whether every bucket should carry `details`: its creator, its latest uploads and downloads
            and a summary of its policy, each as far as the caller may see it. See `BucketDetails`.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: The buckets.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Bucket'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createBucket
      tags: [buckets]
      summary: Create a bucket
      x-cactusfs-action: s3:CreateBucket
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BucketCreate'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bucket'
        default:
          $ref: '#/components/responses/Problem'
  /buckets/{bucket}:
    get:
      operationId: getBucket
      tags: [buckets]
      summary: Get a bucket
      x-cactusfs-action: s3:ListBucket
      parameters:
        - $ref: '#/components/parameters/BucketName'
      responses:
        '200':
          description: The bucket.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bucket'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteBucket
      tags: [buckets]
      summary: Delete an empty bucket
      x-cactusfs-action: s3:DeleteBucket
      parameters:
        - $ref: '#/components/parameters/BucketName'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204':
          description: Deleted.
        default:
          $ref: '#/components/responses/Problem'
  /buckets/{bucket}/usage:
    get:
      operationId: getBucketUsage
      tags: [buckets]
      summary: How many objects a bucket holds, and their size together
      description: |
        How many objects the bucket holds and their sizes together - the current versions; older versions and
        uploads in progress are not part of `object_count` and `total_size`.

        Where the metadata store keeps a count of the bucket, the answer is that count: `exact` and
        `complete` are true, and `versions`, `stored_bytes` and `upload_bytes` say what the bucket keeps
        beyond its current versions - which is what a quota counts. A bucket made by a release that counts is
        counted from the start. One that is older is counted in the background, without being asked; until
        that is done, and on a deployment that does not count yet, `exact` is false and the answer is made as
        it always was, by reading the index: for a very large bucket that count stops at a bound and
        `complete` is false; the figures are then of the keys counted so far.
      x-cactusfs-action: s3:ListBucket
      parameters:
        - $ref: '#/components/parameters/BucketName'
      responses:
        '200':
          description: The bucket's usage.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BucketUsage'
        default:
          $ref: '#/components/responses/Problem'
  /buckets/{bucket}/usage/recount:
    post:
      operationId: recountBucketUsage
      tags: [buckets]
      summary: Count a bucket's usage again
      description: |
        Asks for the bucket's usage to be counted again from its index, as it was counted the first time: by
        the metadata store, in steps, while the bucket is used. The answer is given as soon as the count is
        asked for; `GET /buckets/{bucket}/usage` goes on answering from the figures there are until the new
        ones take their place, and `exact` stays true meanwhile. A count that comes out other than the
        figures that were kept is counted in `cactusfs_bucket_usage_drift_total`. Asking again while a count
        is under way starts it again.

        Answers 503 until every member of the metadata group is of a release that counts usage.

        The request has no body. Like every POST of this API it must still say
        `Content-Type: application/json`, and is refused with 415 otherwise.
      x-cactusfs-action: admin:RecountBucketUsage
      parameters:
        - $ref: '#/components/parameters/BucketName'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '202':
          description: The count was asked for.
        default:
          $ref: '#/components/responses/Problem'
  /buckets/{bucket}/quota:
    get:
      operationId: getBucketQuota
      tags: [buckets]
      summary: Get the quota of a bucket
      description: |
        The most bytes the bucket may hold, and how many it holds. A bucket without a quota is answered too:
        `quota_bytes` is then absent.
      x-cactusfs-action: admin:GetBucketQuota
      parameters:
        - $ref: '#/components/parameters/BucketName'
      responses:
        '200':
          description: The quota, or that there is none.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BucketQuota'
        default:
          $ref: '#/components/responses/Problem'
    put:
      operationId: putBucketQuota
      tags: [buckets]
      summary: Set the quota of a bucket
      description: |
        Sets the most bytes the bucket may hold. What counts is what the bucket keeps: every version of every
        object, current or not, by its size, and the parts of multipart uploads that are not completed. A
        quota below what the bucket holds already is accepted: nothing is removed, and nothing more is taken
        until enough was deleted.

        Once it is set, an upload, a copy or a part that would take the bucket past it is refused - in S3
        with `403 QuotaExceeded`, here with a 403 whose `code` is `QuotaExceeded`. Deleting is never refused.

        Having `s3:*` on the bucket does not give this: a bucket's own administrator cannot lift its limit.
      x-cactusfs-action: admin:PutBucketQuota
      parameters:
        - $ref: '#/components/parameters/BucketName'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BucketQuotaPut'
      responses:
        '200':
          description: Set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BucketQuota'
        '403':
          description: The caller is not allowed `admin:PutBucketQuota`. The refusal is written to the audit trail.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: |
            The bucket's usage is still being counted (`code` is `Conflict`): a quota can be set once
            `exact` is true. A bucket made by this release is exact from the start; one that was there before
            is counted without being asked.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteBucketQuota
      tags: [buckets]
      summary: Remove the quota of a bucket
      x-cactusfs-action: admin:DeleteBucketQuota
      parameters:
        - $ref: '#/components/parameters/BucketName'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204':
          description: Removed, or there was none.
        default:
          $ref: '#/components/responses/Problem'
  /buckets/{bucket}/notifications:
    get:
      operationId: getBucketNotifications
      tags: [buckets]
      summary: Get the notification rules of a bucket
      description: |
        The rules by which changes of the bucket's objects are told to targets - what S3 calls the
        notification configuration, and the same document `GET /{bucket}?notification` gives. A bucket
        without rules is answered with none.
      x-cactusfs-action: s3:GetBucketNotification
      parameters:
        - $ref: '#/components/parameters/BucketName'
      responses:
        '200':
          description: The rules, in the order they were given.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BucketNotifications'
        default:
          $ref: '#/components/responses/Problem'
    put:
      operationId: putBucketNotifications
      tags: [buckets]
      summary: Set the notification rules of a bucket
      description: |
        Replaces the rules. A rule names a target by its name, never an address: targets are defined under
        `/targets` by who may define them, and each lists the buckets that may use it. A rule that names a
        target that is not there, is not of kind `webhook` or `nats`, or does not allow this bucket is refused
        with 400. No rules at all removes the configuration.

        From then on every change a rule matches is delivered to its target at least once, in the order the
        changes were made; see `api/asyncapi/events.yaml`, `cactusfs.notification.object.v1`. Nothing of
        before is delivered.

        Answers 503 until every member of the metadata group is of a release that knows notifications.
      x-cactusfs-action: s3:PutBucketNotification
      parameters:
        - $ref: '#/components/parameters/BucketName'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BucketNotificationsPut'
      responses:
        '200':
          description: Set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BucketNotifications'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteBucketNotifications
      tags: [buckets]
      summary: Remove the notification rules of a bucket
      description: |
        What was matched before is still delivered; nothing after is.
      x-cactusfs-action: s3:PutBucketNotification
      parameters:
        - $ref: '#/components/parameters/BucketName'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204':
          description: Removed, or there were none.
        default:
          $ref: '#/components/responses/Problem'
  /buckets/{bucket}/replication:
    get:
      operationId: getBucketReplication
      tags: [buckets]
      summary: Get the replication configuration of a bucket
      description: |
        Where the versions of this bucket are copied to - the same document `GET /{bucket}?replication`
        gives. 404 when the bucket has none.
      x-cactusfs-action: s3:GetReplicationConfiguration
      parameters:
        - $ref: '#/components/parameters/BucketName'
      responses:
        '200':
          description: The configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BucketReplication'
        default:
          $ref: '#/components/responses/Problem'
    put:
      operationId: putBucketReplication
      tags: [buckets]
      summary: Set the replication configuration of a bucket
      description: |
        Has every new version of the bucket that a rule matches copied to one bucket of another deployment,
        through a target of kind `s3` that allows this bucket. The bucket must keep versions (400 otherwise,
        and versioning cannot be suspended while the configuration is there) and must not itself be a replica
        (409). The bucket at the other end must be put into replica mode there, with this deployment as its
        source.

        Versions that were there before are not sent until a resync is asked for. Versions removed for good
        are never removed at the other end.

        Answers 503 until every member of the metadata group is of a release that knows replication.
      x-cactusfs-action: s3:PutReplicationConfiguration
      parameters:
        - $ref: '#/components/parameters/BucketName'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BucketReplicationPut'
      responses:
        '200':
          description: Set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BucketReplication'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteBucketReplication
      tags: [buckets]
      summary: Remove the replication configuration of a bucket
      description: |
        Nothing more is matched. What was matched and not yet sent is still sent. Nothing is removed at the
        other end, and the bucket there stays a replica until it is promoted there.
      x-cactusfs-action: s3:PutReplicationConfiguration
      parameters:
        - $ref: '#/components/parameters/BucketName'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204':
          description: Removed, or there was none.
        default:
          $ref: '#/components/responses/Problem'
  /buckets/{bucket}/replication/status:
    get:
      operationId: getBucketReplicationStatus
      tags: [buckets]
      summary: How far the replication of a bucket has come
      description: |
        What the node that leads the metadata group, which does the sending, says of the bucket's target, and
        the resync of the bucket if one was asked for. Any node answers; it asks the leader. 404 when the
        bucket has no replication configuration; 503 when there is no leader to ask.
      x-cactusfs-action: admin:GetReplicationStatus
      parameters:
        - $ref: '#/components/parameters/BucketName'
      responses:
        '200':
          description: The state of replication as the leader has it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BucketReplicationStatus'
        default:
          $ref: '#/components/responses/Problem'
  /buckets/{bucket}/replication/resync:
    post:
      operationId: resyncBucketReplication
      tags: [buckets]
      summary: Send what the other deployment lacks
      description: |
        Starts a walk of every version of the bucket, oldest key first, that asks the other deployment for
        each and sends those it does not have - the versions that were there before the configuration, and
        those that were lost to a target that could not be reached for too long (`resync_needed`). The walk
        is the leader's, goes on across a change of leader from where it had come, and is followed in
        `GET /buckets/{bucket}/replication/status`. Asking again starts it from the beginning. 404 when the
        bucket has no replication configuration.

        The request has no body. Like every POST of this API it must still say
        `Content-Type: application/json`, and is refused with 415 otherwise.
      x-cactusfs-action: admin:ResyncReplication
      parameters:
        - $ref: '#/components/parameters/BucketName'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '202':
          description: The resync was started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplicationResync'
        default:
          $ref: '#/components/responses/Problem'
  /buckets/{bucket}/replica:
    get:
      operationId: getBucketReplicaMode
      tags: [buckets]
      summary: Whether a bucket is the replica of another deployment's
      x-cactusfs-action: admin:GetBucketReplicaMode
      parameters:
        - $ref: '#/components/parameters/BucketName'
      responses:
        '200':
          description: The mode of the bucket.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BucketReplicaMode'
        default:
          $ref: '#/components/responses/Problem'
    put:
      operationId: putBucketReplicaMode
      tags: [buckets]
      summary: Make a bucket a replica, or promote it
      description: |
        With a `source`, the bucket becomes the replica of a bucket of that deployment: from then on it takes
        new versions and delete markers from that source only, and refuses everybody else's - the root
        identity's too - with `409 InvalidBucketState`. Reading is as before, and so is removing a version for
        good, which stays governed by the permissions and locks of this deployment. The bucket must keep
        versions, its usage must be exact, and it must have no replication configuration of its own (409
        otherwise).

        With an empty `source` the bucket is promoted: it takes writes again, and nothing more from the
        source. Promotion is the whole of failing over; nothing is sent back.

        Answers 503 until every member of the metadata group is of a release that knows replication.
      x-cactusfs-action: admin:PutBucketReplicaMode
      parameters:
        - $ref: '#/components/parameters/BucketName'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BucketReplicaModePut'
      responses:
        '200':
          description: Set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BucketReplicaMode'
        default:
          $ref: '#/components/responses/Problem'
  /buckets/{bucket}/objects:
    get:
      operationId: listObjects
      tags: [objects]
      summary: List the objects of a bucket
      description: |
        One page of the bucket's objects. With `access=true` every object also says who uploaded it and
        when, how often it was downloaded and copied, and when last - the figures of
        `/buckets/{bucket}/object/access`, without the readers - where the caller holds
        `admin:GetObjectAccess` on that object. That permission decides only what the listing carries: a
        caller without it is given the same listing with `access_included: false` and no `access` on any
        object. The listing is never refused for want of that permission, and nothing is written to the audit trail
        for it; where the facts may be shown and cannot be read, the listing fails as any read that fails does.
      x-cactusfs-action: s3:ListBucket
      parameters:
        - $ref: '#/components/parameters/BucketName'
        - name: prefix
          in: query
          description: Only keys that begin with this.
          schema:
            type: string
            maxLength: 1024
        - name: delimiter
          in: query
          description: Keys that contain it after the prefix are rolled up into common prefixes.
          schema:
            type: string
            maxLength: 16
        - name: continuation_token
          in: query
          description: The `next_continuation_token` of the previous page.
          schema:
            type: string
            maxLength: 4096
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 200
        - name: access
          in: query
          description: |
            Whether the listing should carry, for each object, who uploaded it and how often it was
            downloaded. It does so only for a caller who holds `admin:GetObjectAccess`; see
            `access_included`.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: One page of the listing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectList'
        default:
          $ref: '#/components/responses/Problem'
  /buckets/{bucket}/object:
    get:
      operationId: getObject
      tags: [objects]
      summary: Download an object
      x-cactusfs-action: s3:GetObject
      parameters:
        - $ref: '#/components/parameters/BucketName'
        - $ref: '#/components/parameters/ObjectKey'
      responses:
        '200':
          description: The content of the object.
          headers:
            Content-Length:
              schema:
                type: integer
                format: int64
            ETag:
              schema:
                type: string
            Last-Modified:
              schema:
                type: string
            Content-Disposition:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        default:
          $ref: '#/components/responses/Problem'
    put:
      operationId: putObject
      tags: [objects]
      summary: Upload an object
      description: |
        Stores the body as the object. `Content-Length` is required. With `Idempotency-Key`, a repeated request
        is recognised by its bucket, key and length, not by its content.
      x-cactusfs-action: s3:PutObject
      parameters:
        - $ref: '#/components/parameters/BucketName'
        - $ref: '#/components/parameters/ObjectKey'
        - name: Content-Type
          in: header
          description: The media type to store with the object.
          schema:
            type: string
            maxLength: 255
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectMetadata'
        '403':
          description: |
            The caller is not allowed `s3:PutObject` on the object (`code` is `AccessDenied`), or the bucket
            has a quota and the object would take it past it (`code` is `QuotaExceeded`). Nothing was
            stored. Sending the same request again does not help until something was deleted or the quota
            was raised.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteObject
      tags: [objects]
      summary: Delete an object
      x-cactusfs-action: s3:DeleteObject
      parameters:
        - $ref: '#/components/parameters/BucketName'
        - $ref: '#/components/parameters/ObjectKey'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204':
          description: Deleted, or was not there.
        default:
          $ref: '#/components/responses/Problem'
  /buckets/{bucket}/object/metadata:
    get:
      operationId: getObjectMetadata
      tags: [objects]
      summary: Get what is known about an object
      x-cactusfs-action: s3:GetObject
      parameters:
        - $ref: '#/components/parameters/BucketName'
        - $ref: '#/components/parameters/ObjectKey'
      responses:
        '200':
          description: The metadata.
