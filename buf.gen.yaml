# Generates the node RPC code. The plugins are pinned by `tool` directives in
# go.mod. Run through `make gen`. `clean` empties the output directory first:
# never point `out` at a directory that holds anything else.
version: v2
clean: true
plugins:
  - local: [go, tool, protoc-gen-go]
    out: internal/adapters/noderpc/nodev1
    opt: [paths=source_relative]
  - local: [go, tool, protoc-gen-go-grpc]
    out: internal/adapters/noderpc/nodev1
    opt: [paths=source_relative, require_unimplemented_servers=true]
